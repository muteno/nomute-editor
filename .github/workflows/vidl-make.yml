name: vidl-make

# 영상 받기(설정 ▸ 다운로드 영상 플랫폼 경로 · /api/vidl 발사 · 운영자 260728 "배치파일 조건대로") — 단일 잡:
#   URL → yt-dlp 3판{최고화질+자막(en,ko srt→txt) · 프레임별(maxfps_) · FHD별(1080p_)} → R2 vidl_res/<id>/
#   → 드라이브 '내 드라이브/Shared' 업로드(GDRIVE_SA_JSON 있을 때 · 비치명) → viewer/vidl_out/<id>/result.json 커밋(폼이 폴링).
# 자막 0개 = Whisper 받아쓰기 폴백(운영자 260802 · Handy 개념 이식) — ly_stt.py 정본 공용 · fail-soft · result.json "stt" 표기.
# LLM 0콜(STT = 로컬 Whisper·키 불필요) · 조건 정본 = apps/vidl/vidl_run.py(레퍼런스 = 운영자 Downloader.bat v7.0) · 골격 = conv-make 미러.
on:
  workflow_dispatch:
    inputs:
      id:
        description: '작업 id(타임스탬프-hex6)'
        type: string
      url:
        description: '영상 게시물 URL(yt-dlp)'
        type: string
      mode:
        description: '받을 것 — both(영상+자막) · video(영상만) · subs(자막만)'
        type: string
        default: 'both'

concurrency:
  group: vidl-make-${{ inputs.id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vidl:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # 최악 스택{환경 ~10 + 3판 다운로드 + R2·드라이브 업로드} — 무한 행만 차단(conv 문법)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 체크아웃 다이어트(운영자 260802 "스레드 다운로드 굉장히 오래걸리는데" · thumb-make 260728 정본 계승) —
          #   구 fetch-depth:0(전 히스토리)이 114s를 먹었다(260802 run 30752917025 실측: 체크아웃 114s·환경 57s·받기 19s = 370KB jpg 1장에 잡 3분27초).
          #   이 잡이 읽는 것 = apps/vidl+apps/ly(setup)+.github+push/assets(웹푸시)+viewer/vidl_out 뿐 → depth 1 + sparse = 수초 · 레포가 커져도 안 늘어나는 구조.
          # 결과 커밋은 아래 Commit output이 shallow-safe 재작성(fetch tip→reset→재적용 · 구 rebase는 얕은 클론에서 공통조상 부재로 실패 가능).
          fetch-depth: 1
          sparse-checkout: |
            apps/vidl
            apps/ly
            .github
            push
            assets/brand
            viewer/vidl_out

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 환경 (ffmpeg+yt-dlp+Whisper)
        timeout-minutes: 20   # 콜드런 large-v3 3.1GB 다운 감안(ly-make STT 환경 동형) — 캐시 적중 시 즉시
        uses: ./.github/actions/runner-setup
        with:
          setup: apps/ly/setup.sh   # ffmpeg+yt-dlp+faster-whisper+large-v3 prefetch(ly 정본 재사용 — 정본 중복 신설 금지) · 자막 0개 받아쓰기 폴백(vidl_run stt_fallback · 운영자 260802)용
          whisper: 'true'
          apt: ffmpeg

      - name: 받기 (yt-dlp 3판 → R2·드라이브 → result.json)
        timeout-minutes: 30   # 스텝 캡 — py 총예산 25분 + 여유 · 잡 55분 하드캔슬 전 failure() error.log 표면화 마감 확보(평의회5 P1)
        env:
          IN_ID: ${{ inputs.id }}
          IN_URL: ${{ inputs.url }}
          IN_MODE: ${{ inputs.mode || 'both' }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          set -e
          [ -n "$IN_ID" ] || { echo "::error::id 없음"; exit 1; }
          case "$IN_ID" in *[!0-9a-f-]*) echo "::error::잘못된 id"; exit 1;; esac
          [ -n "$IN_URL" ] || { echo "영상 URL이 없어 — 다시 시도해줘." > /tmp/vidl_err.txt; echo "::error::url 빈값"; exit 1; }
          # R2 시크릿 프리플라이트 — 25분 다운로드 후 업로드에서 죽는 대신 즉시 정직 실패(평의회5 P2)
          [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_PUBLIC_BASE" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] \
            || { echo "저장소(R2)가 설정 안 돼 있어 — 관리자 설정 후 다시." > /tmp/vidl_err.txt; echo "::error::R2 시크릿 미설정"; exit 1; }
          case "$IN_MODE" in both|video|subs) ;; *) IN_MODE=both ;; esac   # 화이트리스트(주입 차단 · py도 재검증)
          python3 apps/vidl/vidl_run.py "$IN_ID" "$IN_URL" "$IN_MODE"

      - name: 실패 기록(error.log) — 프론트가 폴링해 즉시 표시
        if: failure()
        env:
          IN_ID: ${{ inputs.id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          [ -n "$IN_ID" ] || exit 0
          case "$IN_ID" in *[!0-9a-f-]*) exit 0;; esac
          mkdir -p "viewer/vidl_out/${IN_ID}"
          # 소스 유무 무관 무조건 생성(스텝 SIGKILL 시 py가 err를 못 써도 프론트 폴링이 안 헛돌게 · 평의회5 P1)
          if [ -s /tmp/vidl_err.txt ]; then cat /tmp/vidl_err.txt > /tmp/vidl_msg.txt;
          else echo "받기가 중간에 멈췄어 — 잠시 후 다시 시도해줘. (run ${RUN_ID})" > /tmp/vidl_msg.txt; fi
          # 시크릿 마스킹(stderr에 Bearer/키/업로드 URL 유출 차단 · 퍼블릭 레포 커밋 · 평의회1 P2·평의회5) — 마지막 40줄만.
          tail -n 40 /tmp/vidl_msg.txt | sed -E \
            -e 's#(Bearer|Authorization:?)[[:space:]]*[A-Za-z0-9._~+/=-]+#\1 [숨김]#g' \
            -e 's#(refresh_token|client_secret|access_token|AKIA)[A-Za-z0-9._-]*#\1[숨김]#g' \
            -e 's#https://[^ ]*(upload|googleapis|r2\.cloudflarestorage)[^ ]*#[URL숨김]#g' \
            > "viewer/vidl_out/${IN_ID}/error.log"
          echo "error.log: $(cat viewer/vidl_out/${IN_ID}/error.log)"

      - name: Commit output
        if: always()
        env:
          IN_ID: ${{ inputs.id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          [ -n "$IN_ID" ] || { echo "id 없음 — 커밋 스킵"; exit 0; }
          case "$IN_ID" in *[!0-9a-f-]*) echo "잘못된 id — 커밋 스킵"; exit 0;; esac
          git config user.name "nomute-bot"
          git config user.email "bot@nomute.local"
          # shallow-safe 재작성(thumb-make 260728 정본 계승 · 체크아웃 다이어트 동행) — depth 1 클론엔 공통조상이 없어 구 rebase 재시도가 실패 가능.
          # 방식: 산출 디렉토리(result.json·error.log)를 밖에 보관 → 매 시도 {최신 tip fetch → reset --hard → 재적용 → 재커밋 → push}.
          STAGE="$(mktemp -d)"
          cp -r "viewer/vidl_out/${IN_ID}" "$STAGE/out" 2>/dev/null || { echo "커밋할 것 없음(산출 부재)"; exit 0; }
          pushed=0
          for i in 1 2 3 4 5; do
            if git fetch --depth=1 origin "$BRANCH"; then
              git reset --hard FETCH_HEAD
              mkdir -p "viewer/vidl_out/${IN_ID}"
              cp -r "$STAGE/out/." "viewer/vidl_out/${IN_ID}/"
              git add -- "viewer/vidl_out/${IN_ID}"   # -- = id 옵션주입 차단(평의회1 P3)
              git diff --cached --quiet && { echo "커밋할 것 없음"; pushed=1; break; }   # 빈 커밋 가드(평의회5 P2)
              git commit -m "vidl: ${IN_ID} 받기 출력" || { echo "커밋 실패"; pushed=1; break; }
              if git push origin "HEAD:$BRANCH"; then pushed=1; break; fi
            fi
            sleep $((i*3))
          done
          [ "$pushed" = 1 ] || { echo "::error::push ${BRANCH} 5회 실패 — 출력 유실"; exit 1; }

      - name: 완료 알림(웹푸시) — 창을 닫고 있어도 다 됐다는 걸 알린다
        if: success()
        continue-on-error: true   # 알림 실패는 비치명 — 결과 커밋이 본체(conv-make 관례)
        env:
          IN_ID: ${{ inputs.id }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          timeout 120 python3 -m pip install --quiet pywebpush || { echo "::warning::pywebpush 미설치 — 완료 알림 생략"; exit 0; }
          N=$(python3 -c "import json;print(len(json.load(open('viewer/vidl_out/${IN_ID}/result.json'))['files']))" 2>/dev/null || echo 0)
          # url = 뷰어 딥링크(?vidl=<id>) → 앱이 다운로드 창 + 그 결과 패널을 바로 연다(index.html _dgDeepLink)
          python3 .github/scripts/push_send.py --notify "영상 받기" "다 받았어요 — 파일 ${N}건, 눌러서 저장하세요" \
            --url "/?vidl=${IN_ID}" --tag "nomute-make-${IN_ID}" --kind make \
            || echo "::warning::완료 푸시 실패(비치명)"
