name: cf-redeploy
# 라이브 강제 재배포 버튼(운영자 260803 "강제 하드 배포시켜") — main 최신 그대로 Cloudflare Pages 빌드 1발.
# 왜: 260803 실사고 = Pages 빌드 큐가 밀려 라이브가 main보다 3시간 39분 뒤처진 채 서빙(라이브 도장 02be81e·14:52 vs
#     main e8c9ce8·18:31). 코드·게이트·머지는 전부 녹색인데 운영자 화면만 옛 판 = "고쳤다는데 안 됨"의 정체.
#     그때 세션이 쓸 수 있는 수단이 「커밋을 하나 더 밀어 큐 뒤에 붙기」뿐이라 되레 느려졌다. 이 워크플로가 그 사각을 닫는다.
# ⚠ 되돌리기 아님 — 훅은 **그 시점 main HEAD**를 빌드한다(롤백·force·체크아웃 이동 0 · 병렬 세션 작업 전부 포함된 채로 나간다).
#   라이브를 과거로 되돌리는 축은 live-smoke의 live_rollback.py 단독이고, 이 파일은 그 경로를 건드리지 않는다.
# 수단 = CF_DEPLOY_HOOK(기존 시크릿 · news-ask.yml이 쓰던 정본 문법 그대로 계승 · 신규 자격증명 0).
on:
  workflow_dispatch:
    inputs:
      note:
        description: '사유 한 줄(로그용 · 비워도 됨)'
        default: ''
        required: false
permissions:
  contents: read
concurrency:
  group: cf-redeploy
  cancel-in-progress: false
jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 발사 전 라이브 도장 기록
        run: |
          set +e
          BEFORE=$(curl -sS --max-time 20 "https://apps.nomute.kr/?nosw=1" | grep -o "BUILD_STAMP = '[^']*'" | head -1)
          echo "발사 전 라이브 = ${BEFORE:-측정불가}"
          echo "BEFORE=${BEFORE}" >> "$GITHUB_ENV"
          echo "사유: ${{ inputs.note }}"
      - name: Cloudflare Pages 재배포 트리거(main HEAD 그대로)
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "${CF_DEPLOY_HOOK}" ]; then
            echo "::error::CF_DEPLOY_HOOK 미설정 — 재배포 불가(레포 시크릿 등록 필요)"; exit 1
          fi
          if curl -fsS -X POST "${CF_DEPLOY_HOOK}" -o /dev/null; then
            echo "재배포 트리거 ✓ — main HEAD ${GITHUB_SHA::7} 빌드 시작"
          else
            echo "::error::재배포 트리거 실패(훅 URL·Cloudflare 상태 확인)"; exit 1
          fi
      - name: 수렴 확인(최대 15분 — 라이브 도장이 바뀌는지)
        run: |
          set +e
          for i in $(seq 1 90); do
            NOW=$(curl -sS --max-time 20 "https://apps.nomute.kr/?nosw=1" | grep -o "BUILD_STAMP = '[^']*'" | head -1)
            if [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ]; then
              echo "수렴 ✓ (${i}0s 내) — ${BEFORE} → ${NOW}"; exit 0
            fi
            sleep 10
          done
          echo "::warning::15분 내 라이브 도장 무변화(${BEFORE}) — Cloudflare 빌드 큐 적체·실패 의심(대시보드 확인)"
          exit 0
