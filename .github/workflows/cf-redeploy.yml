name: cf-redeploy
# 라이브 강제 재배포 버튼(운영자 260803 "강제 하드 배포시켜") — main 최신 그대로 Cloudflare Pages 빌드 1발.
# 왜: 260803 실사고 = Pages 빌드 큐가 밀려 라이브가 main보다 3시간 39분 뒤처진 채 서빙(라이브 도장 02be81e·14:52 vs
#     main e8c9ce8·18:31). 코드·게이트·머지는 전부 녹색인데 운영자 화면만 옛 판 = "고쳤다는데 안 됨"의 정체.
#     그때 세션이 쓸 수 있는 수단이 「커밋을 하나 더 밀어 큐 뒤에 붙기」뿐이라 되레 느려졌다. 이 워크플로가 그 사각을 닫는다.
# ⚠ 되돌리기 아님 — 훅은 **그 시점 main HEAD**를 빌드한다(롤백·force·체크아웃 이동 0 · 병렬 세션 작업 전부 포함된 채로 나간다).
#   라이브를 과거로 되돌리는 축은 live-smoke의 live_rollback.py 단독이고, 이 파일은 그 경로를 건드리지 않는다.
# 수단 = CF_DEPLOY_HOOK(기존 시크릿 · news-ask.yml:241 정본 문법 그대로 계승 · 신규 자격증명 0).
# ⚠ 3인 검수 260803 반영: ⓐ 자유텍스트 입력은 run 본문 보간 금지 → env 배선(thumb-redo.yml:55 WISH 정본 · 주입 실증 후 봉합)
#   ⓑ 기준 도장 측정 실패 = 즉시 중단(빈 BEFORE면 첫 폴이 "수렴 ✓"로 거짓 초록 — 이 파일이 닫겠다는 사고의 재생산이라 하드 실패)
#   ⓒ 폴링 = 벽시계 데드라인 15분(회수×sleep 산식은 curl 지연이 붙으면 job timeout을 넘겨 fail-soft에 도달 전 강제취소된다)
#   ⓓ checkout 없음 = 레포 파일 무접촉(전 스텝 curl 단독) → permissions {} · GITHUB_SHA는 러너 환경변수라 그대로 쓴다.
on:
  workflow_dispatch:
    inputs:
      note:
        description: '사유 한 줄(로그용 · 비워도 됨)'
        default: ''
        required: false
        type: string
permissions: {}
concurrency:
  group: cf-redeploy
  cancel-in-progress: false
jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25        # 폴링 예산 15분 + curl 지연·발사 여유(live-smoke = 대기 12분에 28분 = 같은 결 배수)
    steps:
      - name: 발사 전 라이브 도장 기록(측정 실패 = 중단)
        env:
          NOTE: ${{ inputs.note }}   # run 본문 직접 보간 금지 — 자유 산문이라 셸 파싱을 갈라 임의 명령이 실행된다(검수 재현)
        run: |
          set +e
          BEFORE=$(curl -sS --max-time 20 "https://apps.nomute.kr/?nosw=1" | grep -o "BUILD_STAMP = '[^']*'" | head -1)
          echo "사유: ${NOTE}"
          if [ -z "$BEFORE" ]; then
            echo "::error::발사 전 라이브 도장 측정 실패 — 기준이 없으면 수렴 판정이 첫 폴에서 거짓 초록이 된다(재실행)"; exit 1
          fi
          echo "발사 전 라이브 = ${BEFORE}"
          echo "BEFORE=${BEFORE}" >> "$GITHUB_ENV"
      - name: Cloudflare Pages 재배포 트리거(main HEAD 그대로)
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "${CF_DEPLOY_HOOK}" ]; then
            echo "::error::CF_DEPLOY_HOOK 미설정 — 재배포 불가(레포 시크릿 등록 필요)"; exit 1
          fi
          if curl -fsS -X POST "${CF_DEPLOY_HOOK}" -o /dev/null; then
            echo "재배포 트리거 ✓ — main HEAD ${GITHUB_SHA::7} 빌드 시작"
          else
            echo "::error::재배포 트리거 실패(훅 URL·Cloudflare 상태 확인)"; exit 1
          fi
      - name: 수렴 확인(벽시계 15분 — 라이브 도장이 바뀌는지)
        run: |
          set +e
          DEADLINE=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            NOW=$(curl -sS --max-time 10 "https://apps.nomute.kr/?nosw=1" | grep -o "BUILD_STAMP = '[^']*'" | head -1)
            if [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ]; then
              echo "라이브 도장 전진 ✓ — ${BEFORE} → ${NOW}"
              echo "⚠ 도장이 바뀐 것 = 빌드가 1건 반영됐다는 뜻이지 '최신 수렴'의 증명은 아니다(큐 적체 시 옛 빌드가 먼저 도달한다) — 최신 여부는 main 최신 도장과 대조해 판단"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::15분 내 라이브 도장 무변화(${BEFORE}) — Cloudflare 빌드 큐 적체·실패 의심(대시보드 확인)"
          exit 0
