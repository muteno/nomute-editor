name: cf-redeploy
# 라이브 강제 재배포 버튼(운영자 260803 "강제 하드 배포시켜") — main 최신 그대로 Cloudflare Pages 빌드 1발.
# 왜: 260803 실사고 = Pages 빌드 큐가 밀려 라이브가 main보다 3시간 39분 뒤처진 채 서빙(라이브 도장 02be81e·14:52 vs
#     main e8c9ce8·18:31). 코드·게이트·머지는 전부 녹색인데 운영자 화면만 옛 판 = "고쳤다는데 안 됨"의 정체.
#     그때 세션이 쓸 수 있는 수단이 「커밋을 하나 더 밀어 큐 뒤에 붙기」뿐이라 되레 느려졌다. 이 워크플로가 그 사각을 닫는다.
# ⚠ 되돌리기 아님 — 훅은 **그 시점 main HEAD**를 빌드한다(롤백·force·체크아웃 이동 0 · 병렬 세션 작업 전부 포함된 채로 나간다).
#   라이브를 과거로 되돌리는 축은 live-smoke의 live_rollback.py 단독이고, 이 파일은 그 경로를 건드리지 않는다.
# 수단 = CF_DEPLOY_HOOK(기존 시크릿 · news-ask.yml:241 정본 문법 그대로 계승 · 신규 자격증명 0).
# ⚠ 3인 검수 260803 반영: ⓐ 자유텍스트 입력은 run 본문 보간 금지 → env 배선(thumb-redo.yml:55 WISH 정본 · 주입 실증 후 봉합)
#   ⓑ 기준 도장 측정 실패 = 즉시 중단(빈 BEFORE면 첫 폴이 "수렴 ✓"로 거짓 초록 — 이 파일이 닫겠다는 사고의 재생산이라 하드 실패)
#   ⓒ 폴링 = 벽시계 데드라인 15분(회수×sleep 산식은 curl 지연이 붙으면 job timeout을 넘겨 fail-soft에 도달 전 강제취소된다)
#   ⓓ 수렴 판정 = 「도장이 **바뀌었나**」가 아니라 「도장이 **레포 정본과 같아졌나**」 — BUILD_STAMP는 빌드 시각이 아니라
#      stamp-version.yml:45가 커밋에 구워 넣은 문자열이라, 코드 무변경 재배포는 도장이 바이트 동일하다(변화 판정 = 성공을 실패로 오보).
#      역으로 큐 적체 중엔 옛 빌드가 먼저 도달해 도장이 바뀌기도 한다(변화 판정 = 최신 아닌데 성공으로 오보). 양방향 오보를 목표값 대조로 닫는다.
#      정본 = main의 viewer/index.html BUILD_STAMP(= live-smoke.yml:57 EXPECT와 같은 축 · ref: main 고정 = dispatch가 딴 ref를 골라도 기준은 언제나 main).
#   ⓔ ⚠ 미확인(레포 안에 근거 0 · 추측 금지) = CF_DEPLOY_HOOK이 빌드하는 브랜치와, 훅이 SHA를 POST 시점에 고정하는지 빌드 시작 시점에
#      해석하는지. 정황증거뿐 = news-ask.yml:238·news-analyze.yml:266·thumb-redo.yml:88이 main 푸시 직후 같은 훅으로 피드를 반영한다.
#      그래서 이 워크플로는 「성공했다」를 스스로 단정하지 않고 **라이브 실물 대조 결과만** 보고한다.
#   ⓕ 비용 정직 고지 = 빌드 슬롯을 1개 쓴다. 병렬 세션이 코드를 미는 시간대엔 남의 배포 도착이 그만큼 밀릴 수 있고(live-smoke 12분 창 초과 시
#      DEPLOYMISS 오경보), 월 빌드 한도도 그만큼 준다. 상시 발사용이 아니라 **라이브가 실제로 뒤처졌을 때** 쓰는 버튼이다.
on:
  workflow_dispatch:
    inputs:
      note:
        description: '사유 한 줄(로그용 · 비워도 됨)'
        default: ''
        required: false
        type: string
permissions:
  contents: read              # main의 viewer/index.html 1파일만 읽는다(수렴 목표값 = 레포 정본 도장) · 그 외 쓰기 0
concurrency:
  group: cf-redeploy
  cancel-in-progress: false
jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25        # 폴링 예산 15분 + curl 지연·발사 여유(live-smoke = 대기 12분에 28분 = 같은 결 배수)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                                  # dispatch가 딴 ref로 발사돼도 기준 도장은 언제나 main(위험 = 거짓 SHA 로그)
          sparse-checkout: viewer/index.html         # 목표 도장 1줄만 필요 = 전체 클론 안 함
          sparse-checkout-cone-mode: false
      - name: 기준 도장 확정(라이브 = 지금 / 목표 = main 정본 · 측정 실패 = 중단)
        env:
          NOTE: ${{ inputs.note }}   # run 본문 직접 보간 금지 — 자유 산문이라 셸 파싱을 갈라 임의 명령이 실행된다(검수 재현)
        run: |
          set +e
          echo "사유: ${NOTE}"
          BEFORE=$(curl -sS --max-time 20 "https://apps.nomute.kr/?nosw=1" | grep -o "BUILD_STAMP = '[^']*'" | head -1)
          EXPECT=$(grep -o "BUILD_STAMP = '[^']*'" viewer/index.html | head -1)
          if [ -z "$BEFORE" ]; then
            echo "::error::발사 전 라이브 도장 측정 실패 — 기준이 없으면 수렴 판정이 첫 폴에서 거짓 초록이 된다(재실행)"; exit 1
          fi
          if [ -z "$EXPECT" ]; then
            echo "::error::main 정본 도장(viewer/index.html BUILD_STAMP) 판독 실패 — 목표값 없이는 수렴을 판정할 수 없다"; exit 1
          fi
          echo "라이브(현재) = ${BEFORE}"
          echo "main 정본(목표) = ${EXPECT}"
          { echo "BEFORE=${BEFORE}"; echo "EXPECT=${EXPECT}"; } >> "$GITHUB_ENV"
      - name: Cloudflare Pages 재배포 트리거(main HEAD 그대로)
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "${CF_DEPLOY_HOOK}" ]; then
            echo "::error::CF_DEPLOY_HOOK 미설정 — 재배포 불가(레포 시크릿 등록 필요)"; exit 1
          fi
          if curl -fsS -X POST "${CF_DEPLOY_HOOK}" -o /dev/null; then
            echo "재배포 트리거 ✓ — main HEAD ${GITHUB_SHA::7} 빌드 시작"
          else
            echo "::error::재배포 트리거 실패(훅 URL·Cloudflare 상태 확인)"; exit 1
          fi
      - name: 수렴 확인(벽시계 15분 — 라이브 도장이 main 정본과 같아지는지)
        run: |
          set +e
          DEADLINE=$(( $(date +%s) + 900 ))
          LAST="$BEFORE"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            NOW=$(curl -sS --max-time 10 "https://apps.nomute.kr/?nosw=1" | grep -o "BUILD_STAMP = '[^']*'" | head -1)
            if [ -n "$NOW" ] && [ "$NOW" = "$EXPECT" ]; then
              echo "수렴 ✓ — 라이브 = main 정본 ${EXPECT}"; exit 0
            fi
            if [ -n "$NOW" ] && [ "$NOW" != "$LAST" ]; then
              echo "· 라이브 전진(중간): ${LAST} → ${NOW} (목표 ${EXPECT} 아직 아님 = 큐가 옛 빌드부터 소화 중)"; LAST="$NOW"
            fi
            sleep 10
          done
          echo "::warning::15분 내 미수렴 — 라이브 ${LAST} ≠ main 정본 ${EXPECT}(Cloudflare 빌드 큐 적체·실패 의심 · 대시보드 확인)"
          exit 0
