name: rate

# 뷰어 스크랩 관심도(★1~5)·픽 → scraper/ratings.jsonl 누적·커밋. (feedback.yml 미러)
# 트리거 = Pages Function /api/rate (GH_TOKEN dispatch). 과금 0(러너 ~10s, Gemini·Drive 무관).
on:
  workflow_dispatch:
    inputs:
      id:
        description: '후보 id(또는 url)'
        type: string
        default: ''
      url:
        description: '원문 url'
        type: string
        default: ''
      title:
        description: '제목'
        type: string
        default: ''
      score:
        description: '관심도 0~5'
        type: string
        default: '0'
      picked:
        description: 'true=고름(분석 후보)'
        type: string
        default: ''
      memo:
        description: '1·5점 주관식 메모(선택)'
        type: string
        default: ''
      dismissed:
        description: 'true=관심없음(👎·별점 1점 미만·숨김)'
        type: string
        default: ''
      acked:
        description: 'true=확인(봤음 표시·흐려짐·cross-device 동기화)'
        type: string
        default: ''
      action:
        description: '신속 트리아지: down|pass|pick'
        type: string
        default: ''
      reason:
        description: '사유(객관식 키 — 기준=docs/curation-rubric.md)'
        type: string
        default: ''

concurrency:
  group: rate
  cancel-in-progress: false

permissions:
  contents: write

env:
  PAGES_COALESCE: ${{ vars.PAGES_COALESCE }}   # [CF-Pages-Skip] 코얼레싱 킬스위치(0=off · 부재=ON) — 정본 = git_land.sh 헤더 · Q1331
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Record rating
        env:
          R_ID: ${{ inputs.id }}
          R_URL: ${{ inputs.url }}
          R_TITLE: ${{ inputs.title }}
          R_SCORE: ${{ inputs.score }}
          R_PICKED: ${{ inputs.picked }}
          R_MEMO: ${{ inputs.memo }}
          R_DISMISSED: ${{ inputs.dismissed }}
          R_ACKED: ${{ inputs.acked }}
          R_ACTION: ${{ inputs.action }}
          R_REASON: ${{ inputs.reason }}
        run: |
          python3 .github/scripts/rate_record.py
          # 긴급 오발 신고(reason=brkno) 폐루프 — 같은 축 2건(또는 총 3건·72h 아사창)이면 messages/ 에 개선안 알림.
          # LLM·네트워크 0(결정적 축 매칭) · 신고가 없으면 원장만 갱신하고 조용히 끝난다(운영자 260803 4차).
          # ⚠️ fail-open 필수 — 이 스텝은 `bash -e`라 rc≠0이면 **아래 커밋 전에 죽어** 방금 rate_record.py 가
          #    적재한 별점·픽이 러너와 함께 증발한다(부속 기능이 본체를 인질로 잡는 구조 · 평의회2 260803 지적).
          #    scrape.yml fire_watch·news-analyze messages add 와 같은 관용구.
          python3 scraper/brk_misfire.py || echo "::warning::brk_misfire 실패(스킵) — 평점 기록은 계속"
          # 썸네일 투표 리포트도 같은 fail-open 관용구 — 부속 기능이 본체(별점 적재)를 인질로 잡지 않는다.
          python3 scraper/thumb_vote_report.py || echo "::warning::thumb_vote_report 실패(스킵) — 평점 기록은 계속"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/ratings.jsonl
          # 썸네일 화풍 투표(action=thumb)는 thumb_votes.jsonl 로 분기한다 — 여기 안 실으면 적재는 되고
          # 커밋이 안 돼 다음 체크아웃에서 **조용히 증발**한다(운영자 260805 "남게끔" = 남는 게 이 기능의 전부).
          git add scraper/thumb_votes.jsonl 2>/dev/null || true
          git add -A messages 2>/dev/null || true
          git add scraper/brk_misfire.json 2>/dev/null || true
          git add scraper/thumb_vote_report.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          # 제목은 셸 주입 위험 → 커밋 메시지엔 안전한 값(점수·픽)만.
          PFX=""; [ "${PAGES_COALESCE:-1}" != "0" ] && PFX="[CF-Pages-Skip] "   # CF 빌드만 스킵(코얼레싱 · 정본 = git_land.sh 헤더 · Q1331 — GitHub 발화 무손상 토큰)
          git commit -m "${PFX}rate: ${R_SCORE}점 pick=${R_PICKED:-0} dismiss=${R_DISMISSED:-0}"
          for i in 0 1 2 3; do
            [ "$i" -gt 0 ] && sleep $((2**i))
            git pull --rebase --autostash -X ours origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
          done
          echo "::error::rate push 실패"; exit 1
