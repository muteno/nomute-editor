name: check-refs

# 수정 모드 ③ 게이트(참조·버전·디자인거울·viewer JS 구문 정합)를 CI로 자동화 = "진짜 기계강제"(§🎨).
# 누가 손으로 check_refs 돌리는 걸 깜빡해도 PR마다 자동 검사 → 실패면 PR 빨강.
# (머지 하드차단까지 원하면 브랜치 보호에서 이 체크를 required 로 지정.)
# 과금 0 — 러너 ~20s, stdlib만(pip 0) + node(viewer 인라인 JS 구문검사용).
on:
  pull_request:
    branches: [main]
  # main push에도 돈다(260726 봉합) — PR에서만 검사하면 두 PR이 *각자* 통과한 뒤 main에서 부딪혀도 아무도 안 잡는다.
  # 그 사각이 원장 Q번호 경합 58종 면책의 근본 원인(같은 날 4연속 = Q556→558→560 실측). paths로 원장만 좁혀 러너 낭비 0
  # (봇 데이터 커밋 viewer/*.json 등은 트리거 안 됨 · 원장 변경은 하루 몇 건) · concurrency가 연타를 취소한다.
  push:
    branches: [main]
    paths: ['docs/요구사항_큐.md']
  workflow_dispatch:

concurrency:
  group: check-refs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: check_refs (경로·버전·디자인거울·JS 구문)
        run: python3 shared/check_refs.py
