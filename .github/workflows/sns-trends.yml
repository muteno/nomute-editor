# SNS 트렌드 수집 — 유튜브 인기 급상승(공식 API·키 게이트) + 구글 트렌드 실시간 검색어(무키) + 틱톡 인기(tikwm 무키)
# 운영자 260710 "틱톡·유튜브 끌어오기 ㄱㄱ 다" · 260711 tikwm 이식(외부 도구) · 조사 정본 = docs/curation-algorithm.md §7 메이저 SNS 항목.
# LLM 0콜·과금 0(유튜브 무료 쿼터 ~1%) · 큐레이션 신호·임계 0 접촉(표시 전용 신규 레인 · §1 보수성).
# 틱톡 주 경로 = sns_trends.py tiktok()(tikwm·stdlib) — 구 Playwright 카나리아(tiktok-canary.yml)는 도먼트 대안 축.
name: sns-trends
on:
  schedule:
    - cron: '17,47 * * * *'   # 백스톱 전용 — GitHub schedule = best-effort(피크시 1~4h 드롭·실측 260713: run 간격 09:13→13:04=3h51m·13:04→16:42=3h38m = "지연" 배지 근본원인). 주 하트비트는 아래 push(폰). :30 봇 혼잡 회피 오프셋 유지.
  push:
    branches: [main]
    paths:
      - 'viewer/sns_subs_phone.json'   # 폰(muteno-phone·실기기 PAT) 구독수집 커밋 = 실측 ~30분 규칙 하트비트 — 실기기 cron이라 GitHub schedule 드롭과 무관 → 트렌드 수집이 편승(지연 근본해소 260713). 폰 전용 파일만 감시 = 봇 GITHUB_TOKEN 커밋·자기 산출(sns_trends/brief) 재트리거 0(무한루프 없음). 근접 중복 발사는 Collect 선두 신선도 게이트가 차단.
  workflow_dispatch:
    inputs:
      subs:
        description: '구독 축(X·틱톡·릴스·유튜브 계정) 수집 — 1=ON (§📰-e 카나리아 · 러너 실측 승격 전 cron은 OFF)'
        default: '1'
        required: false
      brief:
        description: 'AI 브리프(비서 페르소나 1콜·opus 5 max·입력 동일 = 스킵) — 1=ON (§📰-e 카나리아 · 실측 승격 전 cron은 OFF)'
        default: '0'
        required: false
      reddit:
        description: '레딧 핫(⑥ 무키 .json · 운영자 260712) — 1=ON (§📰-e 카나리아 · 러너 IP 403/429 실측 승격 전 cron은 OFF)'
        default: '1'
        required: false
      bsky:
        description: '블루스카이 인기(⑦ 무키 공개 AppView · 운영자 260712) — 1=ON (§📰-e 카나리아 · 실측 승격 전 cron은 OFF)'
        default: '1'
        required: false
      signal:
        description: '시그널 실검(⑨ 무키 JSON · 운영자 260712) — 1=ON (§📰-e 카나리아 · 실측 승격 전 cron은 OFF)'
        default: '1'
        required: false
      xtrends:
        description: 'X 실시간 트렌드(⑩ trends24·getdaytrends 파싱 · 운영자 260712) — 1=ON (동일 카나리아)'
        default: '1'
        required: false
      hn:
        description: '해커뉴스(⑫ 무키 Firebase · 운영자 260713) — 1=ON (§📰-e 카나리아)'
        default: '1'
        required: false
      fin:
        description: '금융 환율+코인(⑬ 무키 open.er-api+Upbit · 운영자 260713) — 1=ON (동일 카나리아)'
        default: '1'
        required: false
      bsky_tr:
        description: '블루스카이 인기글 자동 번역(⑦ topic·ko · opus high 1콜 · 증분 carry · 운영자 260713) — 1=ON (§📰-e 카나리아 · dispatch 실측 승격 전 cron은 OFF)'
        default: '0'
        required: false
      sns_tr:
        description: 'SNS 외국어 제목·본문 한글 자동번역(틱톡·유튜브·쇼츠·X/스레드 구독 등 전 소스 · 무키 gtx · LLM 0·과금 0 · 증분 carry · 실패=원문 유지 · bsky/실검 제외 · 운영자 260719 "미리 다 달아놔") — 1=ON · dispatch sns_tr=0=일시 OFF'
        default: '1'
        required: false
      sns_sum:
        description: 'X·스레드 구독 게시물 AI 한줄 요약(④⑧ · kw+S+V+O sum · sonnet 5 high 1콜 · 증분 carry · 대상 0=스킵 · 실패=원문 폴백 · 운영자 260726 "한줄로 뭐에 대해 말하는지") — 1=ON · dispatch sns_sum=0=일시 OFF'
        default: '1'
        required: false
      gt_img:
        description: '구글 급상승 꼬리 카드 이미지 백필(Q126 · Sonnet WebSearch 1콜 → og:image → R2 · 운영자 260718) — 기본 ON 승격(카나리아 run 29634967139 실측: 폴오버로 백업계정 전환·R2 10개 채움 · 운영자 "30분마다 실검 반영·소넷으로") · schedule=inputs 없음→ON · dispatch gt_img=0=일시 OFF · 롤백=step || 1 제거'
        default: '0'
        required: false

permissions:
  contents: write

concurrency:
  group: sns-trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 48   # 45→48(260727 · 브리프 다중 링크 수용): sns_brief 하드스톱 600s→780s = +3분(소재별 링크 확인 왕복 turns 8→12). 45→48 = 종전 여유 유지 · 41→45(260727 · 틱톡 세계 확장 수용): 틱톡 수집이 구 KR 단일창구 10콜 ~30s → 12지역 21콜 + 이월 조회수 재조회 = 최대 240s(TK_BUDGET 180 + TK_REFRESH_BUDGET 60) = +3.5분. 41→45 = 종전 여유 유지 · 36→41(260726 · X/스레드 요약 스텝 추가 수용): 종전 실산 ≈ 35.7분 + 요약(sonnet timeout 300s) ≈ 40.7분 → 41 = 합+여유(요약은 통상 carry 스킵 = 0s). 33→36(260718 트렌드 이미지) · 20→33(260717 chan_brief 이틀 정지 사고 미러). 30분 주기 초과분은 concurrency 큐 대기(사이클 유실 0) · 평상시 소요 불변 · 스크립트 상한 무접촉
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect (stdlib만 — deps 0)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # 미설정 = 유튜브 skip(no-op 스캐폴드·gtrends만 수집)
          SNS_SUBS: ${{ inputs.subs || '1' }}   # 구독 축 = 기본 ON 승격(§📰-e 이행 완료 — 카나리아 run 29153925931 실측 260711: rc=0·65s·틱톡10·유튜브10·레거시 무손상·커밋 eab3bc5). schedule = inputs 없음 → '1'(social-scan 관용구) · dispatch subs='0'=일시 OFF. X·인스타 = 러너 IP 429 실측(런마다 IP 로터리 = 확률 수집·빈 런 = 직전분 보존 fail-soft) — 지속 0건이면 폰 수집 경로 후속. 롤백 = || '' 복귀
          SNS_SUBS_BUDGET: '480'   # 한국/세계 2군 확장분(구 기본 240 · 지역별 상한 x20·tk15·ig10·yt15 = 최악 직렬 ≈460s 커버 · 운영자 260712)
          SNS_REDDIT: ${{ inputs.reddit || '1' }}   # ⑥ 레딧 = 기본 ON 승격(운영자 260801 승인) — OFF 사유였던 러너 403(카나리아 run 29197039475 실측 260713: 3서브레딧 전부 `.json` HTTP 403 = 데이터센터 IP 차단)은 `_reddit_rss` 폴백(260727 실측 "RSS + 봇UA = 200")으로 이미 우회로가 생겼다. 승격 목적 = **폰 단일 공급 해소**(워치독 `해외 레딧 0건(러너 IP 403 = 폰 공급 의존)` 축 — 폰이 죽으면 해외 커뮤니티축이 통째로 0건). ⚠️ 게시물 '나이'는 이걸로 안 줄어든다(레딧 hot 랭킹 특성 = 상위글이 원래 수 시간 숙성 · 실측 중앙 8.8h) — 이건 지연이 아니라 플랫폼 성질. 주 공급 우선순위는 **폰 유지**(sns_trends.py main `if _pr: rd = _pr` 무변경) = 러너는 폰 0건일 때 받는 폴백 → 회귀 위험 0. 러너도 RSS 403이면 rd=[] → 직전분 carry(종전 동일). 롤백 = || '0' 복귀
          SNS_BSKY: ${{ inputs.bsky || '1' }}       # ⑦ 블루스카이 = 기본 ON 승격(§📰-e 이행 — 카나리아 run 29197039475 실측 260713: rc=0·12건 수집·What's Hot 정상) · 롤백 = || '0'
          SNS_SIGNAL: ${{ inputs.signal || '1' }}   # ⑨ 시그널 실검 = 기본 ON 승격(§📰-e 이행 — 러너 카나리아 실측 260712) · 롤백 = || '0'
          SNS_XTRENDS: ${{ inputs.xtrends || '1' }} # ⑩ X 실시간 트렌드 = 기본 ON 승격(동일 실측) · 롤백 = || '0'
          SNS_HN: ${{ inputs.hn || '1' }}           # ⑫ 해커뉴스 = 기본 ON 승격(§📰-e 이행 — 카나리아 run 29201946896 실측 260713: rc=0·HN 10건·Firebase 정상) · 롤백 = || '0'
          SNS_FIN: ${{ inputs.fin || '1' }}         # ⑬ 금융 = 기본 ON 승격(동일 run 실측: 환율 4·코인 4 · open.er-api+Upbit 정상) · 롤백 = || '0'
          SAFETY_KEY: ${{ secrets.KOFIC_NOMUTE_JAENAN || secrets.SAFETY_KEY }}   # ⑭ 재난문자 = 공공데이터포털 키 — 운영자 시크릿명 = KOFIC_nomute_jaenan(260713 발급·등록 실측 · 구 SAFETY_KEY 스캐폴드명 폴백 유지 · GitHub 시크릿명 대소문자 무관 → 대문자 참조로 해석). KOBIS·EX와 동일 폴백 패턴
          KOBIS_KEY: ${{ secrets.KOFIC_NOMUTE_ID || secrets.KOFIC_NOMUTE }}   # ⑮ KOBIS 박스오피스 — 실측(260713): KOFIC_NOMUTE로 10건 수집 성공(run 03:20 KST)·_ID는 미존재였음 → 운영자 구두명(_ID)·실존명 양쪽 폴백(어느 이름이든 동작)
          EX_KEY: ${{ secrets.KOFIC_NOMUTE_EX }}    # ⑯ 도로공사 돌발·사고 — 운영자 시크릿명 = KOFIC_NOMUTE_EX(260713 등록 실측 · EX_URL env로 엔드포인트 교체 가능)
          # REDDIT_SUBS: 'popular,korea,worldnews'  # 서브레딧 노브(코드 기본과 동일 — 바꿀 때만 주석 해제)
        run: |
          # 신선도 게이트 — sns_trends 최근 28분 내 갱신이면 이번 트리거 수집 스킵(push·schedule 근접 발사 중복·과금·IP차단 위험 차단). exit 0(성공) → 후속 브리프/번역/커밋이 '입력 동일·무변동' 스킵으로 캐스케이드(추가 손질 0). 파일 없음·파싱 실패·미래시각(음수 el) = 수집 진행(fail-safe = 백스톱 절대 불차단). 1680s=28분 < schedule 30분 = 백스톱 발사는 항상 통과.
          FRESH=$(python3 -c "import json,datetime as dt; u=json.load(open('viewer/sns_trends.json'))['updated']; t=dt.datetime.fromisoformat(u); el=(dt.datetime.now(t.tzinfo)-t).total_seconds(); print(1 if 0<=el<1680 else 0)" 2>/dev/null || echo 0)
          if [ "$FRESH" = "1" ]; then echo "::notice::sns_trends 최근 28분 내 갱신 — 이번 트리거 수집 스킵(중복 방지)"; exit 0; fi
          timeout 840 python3 scraper/sns_trends.py   # 840 = 레거시 최악(무키 innertube ~170s) + 구독 예산 SNS_SUBS_BUDGET 480s + 여유. 구독 축은 스크립트 내부 wall-clock 예산이 상한(초과 = 잔여 계정 스킵·레거시 보존 — 평의회2·9 회계)

      # ── 국내 커뮤니티 베스트글(tbs · 21개 커뮤 630제목) — 폰 크론 전용이던 축을 러너로 이관(운영자 260726 "작동하게").
      #    근본원인 = 이 축의 유일 공급원이 폰(termux) 크론이었고 그게 죽어 viewer/tbs_data.json이 260720 22:47에서 정지 →
      #    키워드 알림의 '국내 커뮤니티' 감시망이 6일간 빈 채로 돌았다(실측). todaybeststory 공개 API = 원본 커뮤 직접크롤 아님 =
      #    러너 IP 차단 무관(레딧과 다름) → 이 컨테이너 실측 21/21·630건 성공으로 승격 근거 확보. 실패해도 fail-soft(직전분 보존·파이프 무중단).
      #    별도 스텝인 이유 = 위 Collect의 신선도 게이트가 `exit 0`으로 스텝을 끝내므로 같은 스텝에 두면 동반 스킵된다.
      - name: 국내 커뮤니티 수집(tbs · 키워드 알림 국내축 · fail-soft)
        continue-on-error: true
        run: |
          python3 -c "import requests" 2>/dev/null || pip install --quiet --disable-pip-version-check requests || true
          timeout 300 python3 scraper/tbs_scraper.py || echo "::warning::tbs 수집 실패 — 직전 tbs_data.json 보존(fail-soft)"

      # ── 키워드 알림 웹푸시(운영자 260727 "키워드 알림 발견 시 웹 알림 오게해줘") — 뷰어 인앱 토스트는 앱을 켜야만 떠서
      #    "놓치지 않게"라는 목적과 어긋났다. 수집 직후(원문이 가장 신선한 시점) 같은 매칭을 서버에서 돌려 웹푸시로 민다.
      #    발송 = push_send.py --notify 재사용(구독자·VAPID·죽은구독 정리 = 그쪽 계약) · dedup = push/kw_sent.json.
      #    settings/app.json은 읽기만(그 파일은 Pages Function이 GitHub API로 쓰는 계정 SSOT = 러너가 쓰면 병합 레이스).
      - name: 키워드 알림 웹푸시(발견 = 첫 1회 + 24h/3h · fail-soft)
        continue-on-error: true
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          python3 -c "import pywebpush" 2>/dev/null || pip install --quiet --disable-pip-version-check pywebpush || true
          timeout 300 python3 .github/scripts/kw_watch.py || true

      # ── 수집분 즉시 커밋(1차) — 뒤 LLM 브리프/번역 스텝이 job timeout으로 죽어도 수집 데이터(TOP 10·트렌드)는 이미 라이브 확보(운영자 260714 "데이터 잘 받아오게 설계" · 근본원인 = 맨끝 단일 Commit이라 중간 LLM 단계 timeout 시 수집분 동반 유실 · 실측 12:04~13:45 = 세 run 연쇄 cancelled 102분 갭). sns_trends.json은 push paths(sns_subs_phone.json) 미감시 = 재트리거 0. 브리프/번역 갱신분은 맨끝 Commit이 2차로 마저 커밋(입력 동일 스킵 캐스케이드로 무변동 시 생략).
      - name: Commit 수집분(1차 · 유실 방지)
        # git_land = 최신 main 재기점 재적층(insta·fb·lucy 4워크플로 공용 정본 · 260716 브리프 3일 정지 사고 처방).
        # 직전 조치(Q980 cbf24be = {파일별 실존 add · pull --rebase --autostash · 사유 표면화})가 8h 유실의 두 축을 옳게 짚었지만 **잔여 구멍이 하나 남는다** — 샌드박스 6시나리오 대조 실측(260728 Q982):
        #   {① kw_sent 부재 ② 커밋 대상 밖 dirty ③ 원격 레이스 ④ 레이스+dirty}는 직전 조치도 전부 착지 성공.
        #   ⑤ **커밋 대상 밖 untracked 파일이 원격 신규 커밋과 같은 경로일 때** = `--autostash`가 untracked를 안 담아 rebase가 "would be overwritten"으로 죽고 → push 4연속 rejected = **수집분 전량 폐기(사고 재현)**. 직전 조치 FAIL · git_land PASS.
        # git_land가 이기는 이유 = 리베이스를 아예 안 쓴다: {잔여 rebase/merge abort 청소 · fetch · reset --hard origin/main 재기점 · 산출물 스냅샷 재적층 · 6회} = 워킹트리 상태가 착지를 막을 경로 자체가 없다. 결측 인자도 자연 탈락(①과 동일 효과).
        # ⚠ 전제 = 인자 경로의 유일 기록자여야 한다(재적층이 남의 동시 변경을 덮을 수 있음). sns_trends/tbs/kw_sent/sns_brief = 이 워크플로 단독 소유(social-scan은 social_candidates.json만 커밋) = 충족. 롤백 = 이 두 스텝을 cbf24be 관용구로 원복.
        run: |
          bash .github/scripts/git_land.sh "sns-trends: 수집 갱신" viewer/sns_trends.json viewer/tbs_data.json push/kw_sent.json

      - name: Install Claude Code CLI (브리프 스텝용 — LLM 0콜 수집 레인이라 브리프 게이트와 동기)
        if: ${{ (inputs.brief || '1') == '1' || (inputs.bsky_tr || '0') == '1' || (inputs.gt_img || '1') == '1' || (inputs.sns_sum || '1') == '1' }}   # 기본 ON 승격(§📰-e 이행 — 카나리아 run 2차 실측 260712: rc=0·브리프 626자 생성·sns_brief.json 커밋 09:44 KST · 1차 rc=127 = CLI 부재 → 이 스텝 신설로 봉합) · 롤백 = || '0' · 블루스카이 번역(bsky_tr)·트렌드 이미지(gt_img)·X/스레드 요약(sns_sum · 260726)도 CLI 필요(운영자 260713·260718 · gt_img 상시 ON 승격 = || '1')
        run: npm install -g @anthropic-ai/claude-code

      - name: AI 브리프(비서 페르소나 · 운영자 260712) — 입력 동일 = 스킵(토큰 0) · 실패 = 직전 유지(fail-soft)
        env:
          SNS_BRIEF: ${{ inputs.brief || '1' }}   # 기본 ON 승격(§📰-e 이행 완료 — 카나리아 2차 run 실측 260712: 브리프 626자·sha 8d8d8af9·fail-soft/스킵 게이트 정상 · schedule = inputs 없음 → '1') · dispatch brief='0' = 일시 OFF · 롤백 = || '0'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', vars.ACTIVE_ACCOUNT || 'MUTENO')] }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT: ${{ (vars.ACTIVE_ACCOUNT || 'MUTENO') == 'NOMUTEFB' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_NOMUTEFB }}   # 서브1 폴오버(체인 MUTENO→NOMUTEFB→EMS1130G→MUTENONA · news-analyze 관용구)
          CLAUDE_CODE_OAUTH_TOKEN_ALT2: ${{ (vars.ACTIVE_ACCOUNT || 'MUTENO') == 'MUTENO' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}   # 서브2 폴오버(체인 3번째)
          CLAUDE_CODE_OAUTH_TOKEN_ALT3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENONA }}   # 서브3 폴오버(실꼬리 = 항상 MUTENONA)
        run: bash .github/scripts/sns_brief.sh   # 게이트·스킵·fail-soft 전부 스크립트 내(rc 항상 0 = 수집 커밋 비차단)

      - name: 블루스카이 번역(⑦ topic·ko · 증분 carry · 번역대상 0=스킵 · 실패=carry 유지 · 운영자 260713)
        env:
          BSKY_TR: ${{ inputs.bsky_tr || '0' }}   # 기본 OFF 전환(운영자 260721 "블루스카이는 실검만 사용" — 게시물 표면 소멸로 안 보이는 본문에 30분마다 LLM 번역 = 토큰 낭비 차단 · 실검 bsky_trends 번역 = 아래 무키 gtx sns_tr가 담당) · 게시물 표면 재도입 시 = || '1' 원복(구 기본 ON 근거 = 카나리아 run 29222700305 실측 260713 · 증분 carry 재번역 0) · dispatch bsky_tr='1' = 일시 ON · sns_trends.json 직접 병합(Commit git add 커버)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', vars.ACTIVE_ACCOUNT || 'MUTENO')] }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT: ${{ (vars.ACTIVE_ACCOUNT || 'MUTENO') == 'NOMUTEFB' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_NOMUTEFB }}   # 서브1 폴오버(체인 MUTENO→NOMUTEFB→EMS1130G→MUTENONA)
          CLAUDE_CODE_OAUTH_TOKEN_ALT2: ${{ (vars.ACTIVE_ACCOUNT || 'MUTENO') == 'MUTENO' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}   # 서브2 폴오버(체인 3번째)
          CLAUDE_CODE_OAUTH_TOKEN_ALT3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENONA }}   # 서브3 폴오버(실꼬리 = 항상 MUTENONA)
        run: bash .github/scripts/bsky_brief.sh   # 게이트·스킵·fail-soft 전부 스크립트 내(rc 항상 0 = 커밋 비차단)

      - name: SNS 제목·본문 한글 번역(외국어 → ko · 전 소스 · 무키 gtx · 증분 carry · 대상 0=스킵 · 실패=원문 유지 · 운영자 260719 "미리 다 달아놔")
        env:
          SNS_TR: ${{ inputs.sns_tr || '1' }}   # 기본 ON(무키 gtx·LLM 0·과금 0 = bsky와 동일 fail-soft 클래스라 카나리아 단계 생략 · schedule=inputs 없음→'1') · dispatch sns_tr='0' = 일시 OFF 롤백 · carry는 git HEAD(1차 커밋분) 기준 = 재번역 0 · sns_trends.json 직접 병합(맨끝 Commit git add 커버)
        run: python3 scraper/sns_tr.py   # 게이트·스킵·carry·fail-soft 전부 스크립트 내(rc 항상 0 = 커밋 비차단 · Claude CLI 불요 = 무키 gtx)

      - name: X·스레드 AI 한줄 요약(④⑧ · kw+S+V+O · sonnet 5 high 1콜 · 증분 carry · 대상 0=스킵 · 실패=원문 폴백 · 운영자 260726)
        env:
          SNS_SUM: ${{ inputs.sns_sum || '1' }}   # 기본 ON(sns_tr와 동일 fail-soft 클래스 — 실패 = 뷰어 원문 폴백 렌더라 표시 공백 0 · schedule=inputs 없음→'1') · dispatch sns_sum='0' = 일시 OFF 롤백 · carry는 git HEAD(1차 커밋분)+수집기 승계 블록 2중 = 재요약 0 · sns_trends.json 직접 병합(맨끝 Commit git add 커버)
          SNS_SUM_MODEL: claude-sonnet-5   # 운영자 260726 "sonnet 5 high 붙여가지고" — 요약 = 기계 분류 축(소넷 티어) · effort high는 스크립트 내 고정
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', vars.ACTIVE_ACCOUNT || 'MUTENO')] }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT: ${{ (vars.ACTIVE_ACCOUNT || 'MUTENO') == 'NOMUTEFB' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_NOMUTEFB }}   # 서브1 폴오버(체인 MUTENO→NOMUTEFB→EMS1130G→MUTENONA · news-analyze 관용구)
          CLAUDE_CODE_OAUTH_TOKEN_ALT2: ${{ (vars.ACTIVE_ACCOUNT || 'MUTENO') == 'MUTENO' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}   # 서브2 폴오버(체인 3번째)
          CLAUDE_CODE_OAUTH_TOKEN_ALT3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENONA }}   # 서브3 폴오버(실꼬리 = 항상 MUTENONA)
        run: bash .github/scripts/sns_sum.sh   # 게이트·스킵·carry·fail-soft 전부 스크립트 내(rc 항상 0 = 커밋 비차단)

      - name: 트렌드 이미지 백필(Q126 · 구글 급상승 꼬리 카드 커버 · 운영자 260718)
        env:
          TREND_IMG: ${{ inputs.gt_img || '1' }}   # 기본 ON 승격(운영자 260718 "30분마다 실검 반영·소넷으로" · schedule=inputs 없음→'1' · dispatch gt_img='0'=일시 OFF) · 롤백 = || '0'
          TREND_IMG_MODEL: claude-sonnet-5   # 운영자 260718 "사진 안 중요하니 소넷으로"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', vars.ACTIVE_ACCOUNT || 'MUTENO')] }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT: ${{ (vars.ACTIVE_ACCOUNT || 'MUTENO') == 'NOMUTEFB' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_NOMUTEFB }}   # 서브1 폴오버(체인 MUTENO→NOMUTEFB→EMS1130G→MUTENONA)
          CLAUDE_CODE_OAUTH_TOKEN_ALT2: ${{ (vars.ACTIVE_ACCOUNT || 'MUTENO') == 'MUTENO' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}   # 서브2 폴오버(체인 3번째)
          CLAUDE_CODE_OAUTH_TOKEN_ALT3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENONA }}   # 서브3 폴오버(실꼬리 = 항상 MUTENONA)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 .github/scripts/trend_images.py   # 게이트(TREND_IMG)·스킵·fail-soft 전부 스크립트 내(rc 항상 0 = 커밋 비차단)

      - name: Commit
        # 1차와 동일 git_land(브리프·번역·이미지 갱신분까지 착지). 인자에 tbs_data·kw_sent 동반 = 1차가 경쟁에 져도 2차가 마저 줍는다(결측은 자연 탈락).
        # 착지 실패 시 rc는 여전히 0 + ::warning만 = 종전 "다음 주기 재수집" 계약 그대로(후속 스텝·잡 비차단).
        run: |
          bash .github/scripts/git_land.sh "sns-trends: 유튜브·트렌드 갱신" viewer/sns_trends.json viewer/sns_brief.json viewer/tbs_data.json push/kw_sent.json
