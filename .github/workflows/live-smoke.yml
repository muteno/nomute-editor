# ═══════════════════════════════════════════════════════════════════════════════
# live-smoke.yml — 배포 직후 라이브 실물 검문 + 코드축 연속 실패 자가 롤백 (운영자 260802 승인 · 8인 평의회 260802 반영판)
# 왜: 260802 '상단만 렌더' 사고 축 — 로컬 게이트(check_refs·smoke_all)는 레포 사본만 보고, 상용이
#     실제로 내주는 바이트는 사람이 열기 전까지 무검문 사각이었다. 이 워크플로가 배포마다
#     apps.nomute.kr 실물을 레포 정본과 대조(절단·센티널·부속 바이트·articles 파싱 = shared/live_smoke.py 헤더가 정본 설명)
#     하고, 실패만 웹푸시(발송 정본 = push_send --notify 재사용) + 코드축 연속 2회 실패 = 자가 롤백
#     (액터·안전 레일 정본 설명 = .github/scripts/live_rollback.py 헤더 · 원장 = scraper/obs/livesmoke_state.json · 손편집 금지).
# 평의회 260802 핵심 반영:
#   · 대체(superseded) 판정 = 「$GITHUB_SHA..origin/main에 비봇 저자의 코드 표면 커밋 존재」로 협소화 — 구판 「tip 전진」은
#     도장·봇 커밋 상시 전진 탓에 상시 참 = 진짜 배포 실패(MISS)가 전부 침묵 스킵되던 사문 구조.
#   · MISS(미수렴) = 라이브 실물을 다시 보고 판단 — 라이브 녹색이면 「배포 지연」 알림만(카운터 무가산 · 건강 코드 오롤백 차단).
#   · 검문 마커(VERIFIED full/partial · CODEFAIL) → 앵커 자격·롤백 도화선을 코드축 전문 검증 런으로 한정.
#   · concurrency cancel-in-progress **false**(큐 직렬화) — cancel이 롤백·알림·녹색 리셋을 증발시키던 축 봉합.
#   · 전 스텝 set +e/가드 — 기본 bash -e가 검증 루프 첫 적색에서 스텝을 즉사시키던 축 봉합.
# 도장 수렴 = BUILD_STAMP(stamp-version이 트리거 SHA를 구움 — paths·SHA 원천을 이 워크플로와 동기화한 개정 동반).
#   롤백 커밋은 GITHUB_TOKEN 푸시 = 워크플로 연쇄 미발화(GitHub 설계) → 재도장·재검문 없음 = 루프 원천 봉쇄 ·
#   검증은 이 런이 인라인 수행(복원 index 안의 옛 도장 = 롤백 빌드 신원).
# 롤백 되돌리기 = git revert <롤백커밋> 한 줄 · 킬스위치 = repo variable LIVE_ROLLBACK=0(부재 = ON) · 파일 삭제 = 전체 정지(무해).
# ═══════════════════════════════════════════════════════════════════════════════
name: live-smoke
on:
  push:
    branches: [main]
    paths:                     # 코드 배포 표면(= stamp-version paths와 동기 개정 · live_rollback CODE_RX와 동일 의미론) — 봇 데이터 *.json 제외
      - 'viewer/*.html'
      - 'viewer/*.js'
      - 'viewer/*.css'
      - 'viewer/_headers'
      - 'functions/**'
  schedule:
    - cron: '40 19 * * *'      # 19:40 UTC = 04:40 KST(§📐 KST 환산 명기 · smoke-nightly 03:30 뒤 소강대 · 데이터축 일일 안전망)
  workflow_dispatch:
    inputs:
      rollback:
        description: '자가 롤백 — 0=이 런만 강제 OFF(카나리아·검증용 · 평시 킬스위치는 vars.LIVE_ROLLBACK)'
        default: ''
        required: false
permissions:
  contents: write              # 원장(livesmoke_state.json) + 자가 롤백 커밋 — 그 외 쓰기 0
concurrency:
  group: live-smoke
  cancel-in-progress: false    # 평의회 260802: cancel=true는 롤백 중단·알림 증발·녹색 리셋 유실(과계상→오롤백)의 3중 사고원 — 큐 직렬화(GitHub는 대기 1개만 유지 = 중간 푸시 런은 대기열에서 자연 대체 · 실행 중 런은 항상 완주)
jobs:
  probe:
    if: ${{ github.event_name != 'push' || github.event.head_commit.author.name != 'nomute-bot' }}   # 도장·롤백 커밋(nomute-bot) 재트리거 차단(stamp-version 검증된 작성자 가드)
    runs-on: ubuntu-latest
    timeout-minutes: 22        # 수렴 대기(≤6) + 검문 + 롤백·수렴 검증(≤6) + 여유
    steps:
      - uses: actions/checkout@v4   # push = 트리거 커밋(코드 정본) · schedule/dispatch = main 최신
        with:
          fetch-depth: 0            # 자가 롤백 = last_good 시점 파일 복원(ls-tree/restore)이라 전 히스토리 필요
      - name: 배포 수렴 대기(코드 푸시 한정 — 라이브 BUILD_STAMP = 이 커밋 SHA)
        if: ${{ github.event_name == 'push' }}
        run: |
          set +e
          EXPECT="${GITHUB_SHA::7}"
          echo "기대 도장 = $EXPECT"
          LIVE=""
          for i in $(seq 1 36); do   # 10s×36 = 최대 6분(CF Pages 빌드 실측 1~3분 + 여유)
            LIVE=$(curl -sS --max-time 20 "https://apps.nomute.kr/?nosw=1" | grep -o "BUILD_STAMP = '[0-9a-f]\{7\}" | grep -o "[0-9a-f]\{7\}$")
            [ "$LIVE" = "$EXPECT" ] && { echo "수렴(${i}0s 내) ✓"; echo "SHA=$EXPECT" >> "$GITHUB_ENV"; exit 0; }
            sleep 10
          done
          git fetch --quiet origin main
          # 대체 판정(평의회 260802) — 봇(도장·데이터) 전진은 대체가 아니다: 비봇 저자의 코드 표면 커밋이 뒤에 있을 때만 최신 런에 양보
          NEWER=$(git log --format='%an' "$GITHUB_SHA..origin/main" -- 'viewer/*.html' 'viewer/*.js' 'viewer/*.css' 'viewer/_headers' 'functions/**' | grep -cv '^nomute-bot$')
          if [ "${NEWER:-0}" -gt 0 ]; then
            echo "후속 코드 푸시로 대체됨(비봇 코드 커밋 ${NEWER}건) — 중립 스킵(그 푸시의 런이 검문)"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          echo "MISS=배포 미수렴: 라이브 도장 ${LIVE:-?} ≠ 기대 ${EXPECT}(6분 초과 · 후속 코드 푸시 없음)" >> "$GITHUB_ENV"   # 검문 단계가 라이브 실물 재판정
          exit 0
      - name: 라이브 검문(live_smoke.py C1~C4 · MISS면 실물 재판정)
        if: ${{ env.SKIP != '1' }}
        run: |
          set +e
          if [ -n "${MISS:-}" ]; then
            # 미수렴 = 배포축 사건 — 라이브 실물이 녹색이면(직전판 정상 서빙) 「배포 지연」으로 분리(카운터 무가산 · 평의회 L3)
            python3 shared/live_smoke.py | tee live_smoke.log; PROBE_RC=${PIPESTATUS[0]}
            RC=1   # 런 자체는 적색(배포 미수렴은 실패 이력)
            if [ "$PROBE_RC" = "0" ]; then
              echo "DEPLOYMISS=1" >> "$GITHUB_ENV"
              echo "$MISS · 라이브는 직전판 정상 서빙 중(빌드/전파 지연·실패 의심)" > smoke_fail.txt
            else
              grep '^요약:' live_smoke.log | sed 's/^요약: //' > smoke_fail.txt
            fi
          else
            python3 shared/live_smoke.py ${SHA:+--sha "$SHA"} | tee live_smoke.log; RC=${PIPESTATUS[0]}
            grep '^요약:' live_smoke.log | sed 's/^요약: //' > smoke_fail.txt
          fi
          MARKS=$(grep '^MARK ' live_smoke.log | tail -1 | sed 's/^MARK //')   # VERIFIED=full|partial CODEFAIL=0|1
          for kv in $MARKS; do echo "$kv" >> "$GITHUB_ENV"; done
          echo "RC=$RC" >> "$GITHUB_ENV"
          exit 0
      - name: 연속성 원장 + 자가 롤백 판정(live_rollback.py — 레일 = 코드축 연속2·1회 래치·킬스위치·full 앵커·tip 재구축)
        if: ${{ env.SKIP != '1' && env.DEPLOYMISS != '1' }}
        env:
          LIVE_ROLLBACK: ${{ inputs.rollback || vars.LIVE_ROLLBACK || '1' }}   # dispatch 입력 > repo variable > 기본 ON · '0'만 OFF
        run: |
          set +e
          python3 .github/scripts/live_rollback.py --rc "${RC:-1}" \
            --verified "${VERIFIED:-partial}" --codefail "${CODEFAIL:-0}" \
            ${SHA:+--sha "$SHA"} --enabled "$LIVE_ROLLBACK" | tee rb.out
          grep -E '^(ACTION|GOOD|NOTE)=' rb.out >> "$GITHUB_ENV"
          exit 0
      - name: 롤백 수렴 검증(rolled_back 한정 — 복원 셸 서빙 확인 후 전문 재검문)
        if: ${{ env.SKIP != '1' && env.ACTION == 'rolled_back' }}
        run: |
          set +e   # 평의회 260802: 기본 -e면 첫 적색 프로브(CF 재빌드 전)에서 스텝 즉사 → 알림 전멸
          WANT=$(grep -o "BUILD_STAMP = '[0-9a-f]\{7\}" viewer/index.html | grep -o "[0-9a-f]\{7\}$")   # 복원된 index 안의 옛 도장 = 롤백 빌드 신원(GITHUB_TOKEN 푸시라 재도장 없음)
          echo "복원 도장 = ${WANT:-?}"
          VERIFY=red
          for i in $(seq 1 12); do
            sleep 30
            OUT=$(python3 shared/live_smoke.py 2>&1); RC2=$?
            echo "$OUT" | tail -2
            if [ "$RC2" = "0" ] && echo "$OUT" | grep -q "완전 일치"; then VERIFY=green; break; fi   # '완전 일치' 필수 = 전이 중 부분 통과를 회복으로 오판 않기
          done
          echo "VERIFY=$VERIFY" >> "$GITHUB_ENV"
          exit 0
      - name: 원장 커밋(비롤백 런 — 롤백 커밋엔 원장 동승 · watchdog 원장 문법 · fetch+rebase = detached 안전)
        if: ${{ always() && env.SKIP != '1' && env.ACTION != 'rolled_back' && env.DEPLOYMISS != '1' }}
        run: |
          set +e
          git config user.name "nomute-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scraper/obs/livesmoke_state.json 2>/dev/null
          git diff --cached --quiet && { echo "원장 변동 없음 — 커밋 생략"; exit 0; }
          git commit -m "live-smoke: 연속성 원장 도장 (bot)"
          for i in 1 2 3 4; do
            git fetch origin main && git rebase FETCH_HEAD || { git rebase --abort 2>/dev/null; echo "::warning::rebase 실패 — 재시도 계속"; }
            git push origin HEAD:main && exit 0 || { echo "원장 push 재시도 $i"; sleep $((2**i)); }
          done
          echo "::warning::원장 push 실패(재시도 소진) — 카운터 1회분 미기록(과소·과계상 양쪽 가능 = 다음 런이 재판정)"
          exit 0
      - name: 웹푸시(실패·롤백 결과·회복 — 발송 정본 push_send --notify · 비치명 fail-soft)
        if: ${{ always() && env.SKIP != '1' && (env.RC != '0' || env.ACTION == 'recovered') }}
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          set +e
          python3 -m pip install --quiet --break-system-packages pywebpush 2>/dev/null \
            || { echo "::warning::pywebpush 미설치 — 푸시 생략(비치명)"; exit 0; }
          SUM=$(python3 -c "print(open('smoke_fail.txt',encoding='utf-8',errors='replace').readline().strip()[:120])" 2>/dev/null)   # 문자 안전 절단(cut -c = 바이트 절단이라 한글 파손 · 평의회 L6)
          TAG="nomute-livesmoke"
          case "${ACTION}" in
            recovered)    T="라이브 회복 확인";        B="자가 롤백(${GOOD}) 이후 전문 검문 녹색 — 정상 서빙 중 · 되감긴 작업은 git revert로 재적용 가능"; TAG="nomute-rollback";;
            rolled_back)  TAG="nomute-rollback"
                          if [ "${VERIFY}" = "green" ]; then T="자가 롤백 완료 — 라이브 회복"; B="코드축 연속 실패 → ${GOOD} 코드 표면 복원·재검문 통과 · 되감긴 커밋 재적용 = git revert <롤백커밋>";
                          else T="자가 롤백 착지 — 수렴 미확인"; B="${GOOD} 복원 커밋은 main 착지 실측 완료 · 라이브 수렴은 6분 내 미확인(다음 검문이 확정) — 원인 커밋 추적 필요"; fi;;
            noop_surface|manual|push_failed) T="라이브 수동 개입 필요"; B="${NOTE}"; TAG="nomute-rollback";;
            alert_noncode) T="라이브 검문 실패(비코드축)"; B="${SUM:-원인 요약 없음} · ${NOTE}";;
            *)            if [ "${DEPLOYMISS}" = "1" ]; then T="배포 미수렴(라이브는 정상)"; B="${SUM:-배포 지연 의심} — CF Pages 빌드/전파 확인 필요";
                          else T="라이브 검문 실패"; B="${SUM:-원인 요약 없음} · ${NOTE}"; fi;;
          esac
          python3 .github/scripts/push_send.py --notify "$T" "$B" \
            --url "/" --tag "$TAG" --kind sys \
            || echo "::warning::검문 푸시 발송 실패(비치명)"
          exit 0
      - name: 판정 반영(실패 = 런 적색 — 이력 가시화 · 롤백 성공해도 '깨진 배포' 이력은 적색 유지)
        if: ${{ always() && env.SKIP != '1' }}
        run: |
          [ "${RC:-0}" = "0" ] && echo "라이브 검문 통과 ✓" || { echo "라이브 검문 실패(ACTION=${ACTION:-없음} · DEPLOYMISS=${DEPLOYMISS:-0}) — 위 로그·웹푸시 참조"; exit 1; }
