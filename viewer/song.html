<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>음원</title>
<link rel="stylesheet" href="tokens.css">   <!-- 공유 구조토큰(§🎨 STAGE3·index :root 파생·색 제외) — conv/ly/k/track 동일 계승. 인라인 :root가 팔레트 오버라이드 -->
<link rel="stylesheet" href="nm-cards.css">   <!-- 다운로드·결과/이전제작 카드 공용 CSS SSOT(전 앱 단일정본 · 운영자 260731 "하나 바꾸면 다 연동") — 색·플레이트·✓팝 계약은 여기서만 고친다(인라인 사본 금지 · 인라인이 뒤라 남기면 이 SSOT가 죽음) -->
<style>
  /* 팔레트·폼 = conv.html(영상 도구) 계승 verbatim · 구조토큰은 tokens.css
     음원 v1(운영자 260712) = 상황 → 스타일 옵션 10개 → {수노 프롬프팅(무료) | 구글 Lyria 3 곡 생성(유료)} */
  :root{ --well:#0e0f11;   /* 인셋 웰(입력·코드박스 배경 — 7뷰어 공유 raw 추출 = 동값·픽셀 0 · 평의회 260713 ⑨) */
    --bg:#121212; --pan:#16171a; --line:#2a2c31; --line2:rgba(255,255,255,.06);   /* line2 = index :root 정본값 계승(sb Q165 동문 — 폴백 없는 var() 미정의 = 선언 통무효 · 도크 하단 구분선 소비) */ --fg:#eef7f0; --mut:#8fa697;
    --accent:#00EED2; --accent-rgb:0,238,210;
    --accent-4:#FFE13D; --accent-4-rgb:255,225,61;   /* raw-ok: index :root 정본 동값 exact 계승(골드레몬) — 공용 nm-cards.css(다운로드 SSOT)가 참조하는 토큰이라 전 뷰어 정의 필수(미정의 = var() 댕글링 = 다운로드 색 죽음) · 이후 값 동기 = build_design_mirror STAGE4 자동 전파(운영자 260731) */ --accent-dim:rgba(var(--accent-rgb),.13); --on-accent:#032322;
    --danger:#e23b2a; --danger-rgb:226,59,42;
    --press-pico:.72; --press-xs:.82; --press-s:.85; --press-m:.9; --press-l:.95;
  }
  @media (prefers-reduced-motion:reduce){ :root{ --press-pico:1; --press-xs:1; --press-s:1; --press-m:1; --press-l:1; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* 스크롤바 표준 = 제작·합성(thumb) 이식(운영자 260713 "다 같게") · 실제 보이는 바 = cscroll.js 오버레이(네이티브는 no-JS 폴백 · 색 변경 = viewer/cscroll.js) */
  html { scrollbar-width:none; -ms-overflow-style:none; scrollbar-color:rgba(255,255,255,.05) transparent; }   /* 스크롤바 폭 0 = 문서 끝 cscroll.js(오버레이 바) 주입값과 **첫 페인트부터 동일** — index 115행 정본 계승(구 thin은 cscroll 실행 전까지 네이티브 바가 폭을 차지했다가 주입 순간 0으로 풀려, 스크롤이 생긴 화면에서 콘텐츠가 통째로 옆으로 밀렸다 · 운영자 260726 index 픽토 점프[Q579]와 같은 축 · 데스크톱 클래식 스크롤바 환경 전용 = 헤드리스는 오버레이라 재현 불가) · no-JS 폴백 = head 끝 noscript */
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; height:0; display:none; }   /* 위 scrollbar-width:none의 웹킷 짝(cscroll.js 주입 규칙 계승) — 아래 공통 10px은 모달·내부 스크롤 표면 전용으로 존치 */
  ::-webkit-scrollbar { width:5px; height:5px; }   /* 두께 = 구 10 의 50%(운영자 260801) — 알약 실폭 = 5 - 테두리 1×2 = 3px(구 6px 의 50%) */
  * { scrollbar-width:thin; }   /* 표준 짝(크로미엄은 scrollbar-color·width 가 지정되면 ::-webkit-scrollbar-* 를 무시 = 실화면은 이 줄이 담당) — thin = 실존값(.draft-scroll·no-JS 폴백 동문) · html 은 자기 규칙(scrollbar-width:none)이 특이도로 승 = 페이지 바 숨김 불변 */
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.05); border-radius:999px;
    border:1px solid var(--bg); background-clip:padding-box; }   /* 테두리(=바 여백)도 50%: 2→1 = 알약 실폭 3px 유지 */
  ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.08); background-clip:padding-box; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible, [role=button]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url(assets/fonts/pretendard.woff2) format('woff2-variations')}   /* 본문 폰트 = index 정본 이식(운영자 260719 승인 = Q160 잔여 4탭 폰트 확장 · thumb/edit 동문 — iframe이라 부모 index Pretendard 미상속) */
  body { margin:0; background:radial-gradient(125% 70% at 50% -8%, rgba(var(--accent-rgb),.06), transparent 55%) fixed, var(--bg); color:var(--fg); font:15px/1.6 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing:-.2px /* raw-ok: 자간 = index body 정본 exact 계승 */; -webkit-font-smoothing:antialiased; }   /* 폰트 = index body 정본 문자단위 exact 계승(M1 판례 — 구 시스템 스택 폐지 · 콘텐츠 폰트는 개별 명시라 무접촉) */
  button, input, textarea, select { font-family:inherit; letter-spacing:inherit; }   /* 폼 활자 상속 강제 = thumb:39 정본 계승(운영자 260727 "같은 형태에 있는 애들은 다 같아야함" · 점검 v2 ③ — UA 기본 스택으로 새던 입력칸·버튼 봉합) */
  html.inmodal, html.inmodal body { background:transparent; }
  .wrap { max-width:600px; margin:0 auto; padding:18px 16px 40px; }   /* 상단 18 = 도구 모달 첫 소머리 화면선(ly·k 기준 · §표기표준 나) */
  /* (구 .songsh Contents 자체 sticky 쉘 = 폐지 260725 — 상단 고정은 도크(.topdock 미리보기+요약+생성)가 전담 = 5탭 동일 골격[4-2] · Contents는 도크 아래 일반 섹션으로 이주해 edit .srcwrap 구조와 동형) */
  #story { display:block; resize:none; }   /* 라인박스 descender 제거(구 .songsh textarea 계승) + 리사이즈 핸들 제거 = sb·k textarea 정본 동일(운영자 260629 전역 · 5탭 입력칸 통일) */

  label { display:block; font-size:var(--fs-label); color:var(--fg); margin:16px 0 9px; }   /* 소머리 리듬 = thumb .csec(16/9) 계승 — 운영자 260713 이미지 기틀 정렬 */
  .wrap > .selwrap:first-child label { margin-top:0; }   /* 첫 소머리 = 화면선(ly·k label:first-of-type 문법) */
  label.fl { font-weight:var(--fw-x); color:var(--fg); }
  label.fl::before { content:'•'; margin-right:6px; color:var(--accent); font-weight:var(--fw-b); }   /* 블릿→글자 간격 6px = 이미지 탭 .csec(gap:6px) 시각 등가(운영자 260713 "블릿 간격 전부" — 공백식 '• '≈3.3px보다 넓음) */
  textarea, input[type=text] { width:100%; padding:12px; background:var(--well); border:1px solid var(--line); border-radius:var(--r-s); color:var(--fg); font:inherit; font-size:16px; }   /* raw-ok: iOS 자동줌 방지 하한(16px 미만 입력 포커스 = 강제 줌 · ly .ed-chip 16px 선례 · 감사3 §1) — font 축약 뒤 개별 선언이라 승리 */
  textarea { min-height:120px; resize:vertical; line-height:1.55; }
  textarea:focus, input:focus { border-color:rgba(var(--accent-rgb),.35); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08); outline:none; }
  textarea::placeholder, input::placeholder { color:var(--mut); }
  #optwrap[hidden], #out[hidden], #lout[hidden] { display:none; }
  .edfocus { animation:edfocus 2.2s ease both; border-radius:var(--r-m); }   /* 알림 ?done=<id> 착지 결과 강조(edit/thumb .thfocus 정본 계승 · radius=근접토큰) */
  @keyframes edfocus { 0%,100%{ box-shadow:0 0 0 0 rgba(var(--accent-rgb),0); } 18%,46%{ box-shadow:0 0 0 3px rgba(var(--accent-rgb),.55); } }
  @media (prefers-reduced-motion:reduce){ .edfocus { animation:none; } }

  /* 선택자 = 도형 나열 폐지 → 소머리 줄 인라인 텍스트 값 + 촤르륵 팝업(썸네일 .onoff/.platpop/.gpbtn 기틀 계승 · 운영자 260712) */
  /* ══ 상단 도크 = 편집(edit) #topDock 정본 100% 계승(운영자 260725 "편집 콘티 프롬프팅 음원 다 이거로 박아") — 미리보기 + 선택 요약 스트립(.optstrip) + 발사바(.firebar 생성) 한 sticky 블록([4-2] 강제 골격 ①) ══ */
  .topdock { position:sticky; top:0; z-index:6; margin:-16px -16px 0; padding:var(--sp-3) 16px var(--sp-4); background:rgba(18,18,18,1) /* raw-ok: 이미지 스튜디오 카드 제작 도크 정본 동값(thumb .topdock[data-lay="edit"] — 18,18,18 매트 · 알파 1 = 운영자 260802 4차 "미리보기 화면 항상 가려지게" 비침 차단 미러 · blur = 불투명 바탕 무효라 동반 제거) */; border-bottom:1px solid rgba(var(--accent-rgb),.35) /* 강조색1 반투명 구획(운영자 260802 6차) — 레퍼런스 = thumb .cpprev-box.dropping 알파 .35 그대로 */; --line:rgba(255,255,255,.15) /* raw-ok: thumb 편집 도크 정본 동값(운영자 260731 2차 선택값 알파 .15) · 도크 스코프 한정 */; }   /* 상단 -16 + 패딩 18 = 미리보기 프레임 y=20 통일(운영자 260731 22차 "모든 창 겹침에 튀는 곳 없게" — tr 260723 모달 정합 선례 동문 · thumb 편집 도크 상단 sp-3 동값) */   /* raw-ok: 전 값 = edit .topdock 정본 그대로(#121212 전폭{-16 = .wrap padding-x 상쇄}·padding 16/16/--sp-2·z6) */
  .topdock::after { content:none; }   /* 페이드 스커트 폐지(운영자 260802 5차 "딱 끊기게 + 직전 반투명 구분선" · thumb 동문 미러) — 경계 = border-bottom 1px var(--line2) 반투명 헤어라인 단독 */
  .optstrip { margin:0 0 var(--sp-2); padding:8px 13px /* raw-ok: 세로8·좌우13 = edit .optstrip 정본 동값 */; background:#000 /* raw-ok: 미리보기 스테이지 전경색 동값 */; border:1px solid var(--line); border-radius:var(--r-s); }
  .optstrip .gospec { margin:0; padding:0; font-size:11.25px /* raw-ok: edit .optstrip .gospec 명세 활자값 동값 */; line-height:1.9; text-align:left; color:var(--mut); white-space:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }   /* 간소화 1줄 가로 nav — 랩 금지·넘치면 가로 레일(edit 정본 동문) */
  .optstrip .gospec::-webkit-scrollbar { display:none; }   /* 레일 스크롤바 숨김(webkit 짝 · index 레일 관례) */
  .gospec .gs-lbl { color:var(--mut); font-weight:var(--fw-b); }
  .gospec .gs-v { color:var(--mut); }
  .gospec .gs-v.on { color:var(--accent); font-weight:var(--fw-b); }   /* 활성값(적용 중) = accent 점등(edit 정본) */
  .optstrip .gs-sep { color:var(--mut); opacity:.45; font-weight:400; margin:0 5px /* raw-ok: 구분자 좌우 5 = edit .gs-sep 정본 동값 */; }
  .firebar { position:static; padding:0; background:none; }   /* 도크 안 = 요약 스트립 바로 아래 발사바(edit .firebar 정본) */
  .firebar .inner { max-width:600px; margin:0 auto; }
  .firebar .go { margin:0; }   /* 스트립↔생성 간격 = 스트립 margin-bottom(--sp-2) 단독 = edit 정본 실측 12px(형제 .go의 상단 마진 상쇄 · [4-2] 5탭 동일 지오메트리) */
  .topdock #optGo, .topdock #go, .topdock .go { border-radius:var(--r-modal) /* 운영자 260731 "생성버튼 창 둥글기에 맞게" = thumb `.topdock[data-lay="edit"] #go` 정본 동값 사본(구 --r-m/--r-pill은 카드 제작과 갈림 · 실측 11px vs 기준 22px) */; border-color:rgba(255,255,255,.08) /* raw-ok: thumb `#go` 정본 동값(index --line 실측 동값 계승 · 구 도크 스코프 --line .15는 카드 제작보다 진했다) */; min-height:30px /* raw-ok: 카드 제작 발사 버튼 **실측 정본 높이**(thumb는 `.makerow{align-items:stretch}` 행 늘어남으로 30이 되는데, 영상 셸엔 그 행이 없어 27로 갈렸다 — 구조를 옮기는 대신 결과값을 그대로 계승 · 운영자 260803 2차 "아예 동일하게") */; }   /* 발사 버튼 = 카드 제작 정본 사본(운영자 260803 2차 "아예 동일하게") — 등록 셀렉터(.go/#go)의 _LAUNCH_SPEC 3속성은 무접촉 = 게이트 유지 */
  /* ── 미리보기 유닛 = 이미지 스튜디오 **카드 제작** 정본 값 사본(운영자 260803 "모든 메뉴의 미리보기 부분을 카드 제작 부분과 동일하게 · 네비게이션에 이미지 교체와 휴지통 픽토그램") ──
     구판 = 9:16 세로 액자 + 순흑 16:9 밴드 + 「Contents 입력·각색 대기」 문구 + 레일 값 칩 단독 = 카드 제작(1:1 창·중앙 사진 픽토·[교체][휴지통] 묶음)과 정면으로 갈렸다.
     레퍼런스 = viewer/thumb.html `.cpprev`/`.cpprev-box`/`.cpv-empty`(+ 별문서 사본 정본 = viewer/tr.html) · 창작 값 0 = 전부 그 두 파일의 실측 사본. */
  .pvsec { position:relative /* 레일 앵커 = 창 **밖** 우측 절대배치(thumb `.cpprev` 정본 동문 — 창은 overflow:hidden이라 밖에 못 선다) */; margin:0 0 var(--sp-2); --pvw:min(52%, 29svh, 300px) /* 폭 단일출처 = thumb 모달 도크 캡 exact 사본(카드 제작 탭과 같은 크기) — 창 폭·레일 x가 같은 식을 읽는다 */; }
  .topdock.dockzoom .pvsec { --pvw:min(100%, 58svh, 620px); }   /* 돋보기 ON = thumb 정본 동문 사본 */
  .cpprev-box { position:relative; width:var(--pvw); margin-inline:auto /* 캡이 걸린 폭의 좌우 대칭(thumb 정본 동문) */; height:auto; aspect-ratio:1/1 /* 폭 기준 1:1 고정비 = thumb `.topdock[data-lay="edit"] .cpprev-box` 정본 동값(운영자 260801 플레이그라운드 선택값) — 구 9/16은 카드 제작과 얼굴이 갈리던 축 */; contain:size /* 내용물 크기 무시 = 틀 불변(thumb 정본 동반 선언) */; min-height:0; background:#121212; border:1px solid transparent /* 테두리 '삭제' = 선 색만 투명(폭 1px 유지 = 산식 무변동) = thumb 카드 제작 도크 정본 동일 처방 · tr `.cpprev-box` 사본 문법 — 운영자 260803 2차 "아예 동일하게": 구 .15 실선은 영상 5탭에만 박스가 그려져 카드 제작과 얼굴이 갈렸다(실측 boxSty rgba(255,255,255,.15) vs 기준 rgba(0,0,0,0)) */; border-radius:var(--r-s); overflow:hidden; container-type:size /* 무대 폭 산식(100cqh)이 쉘 실높이를 읽는 근거 = tr 정본 동반 선언 */; }
  .cpv-empty { position:absolute; inset:0; display:grid; place-items:center; background-color:inherit /* 무대 필러 = 쉘 상속(thumb `.cpprev-box .cpprev-stage{background-color:inherit}` 정본 문법 — 구 순흑 밴드가 쉘과 2톤으로 갈라지던 것 통일) */; }
  .cpv-empty .cpv-stage { width:min(100%, calc(100cqh * 16 / 9)) /* 두 축 contain = tr `.cpprev-stage` 정본 동식(쉘 실높이 × 산출비) */; aspect-ratio:16/9; background-color:inherit; display:grid; place-items:center; }
  .cpv-photobtn { display:grid; place-items:center; width:var(--btn); height:var(--btn); padding:0; background:none; border:0; cursor:pointer; color:var(--accent); -webkit-tap-highlight-color:transparent; }   /* reuse-ok: thumb `.cpprev-stage .cpv-photobtn` 정본 통계승(빈 상태 진입 픽토 — 강조색 픽토만·플레이트 없음) */

  </div>

  <div class="hpop" id="hpop" hidden><!-- .wrap 내부 = absolute 앵커(트리거 .histbtn 동일 좌표계 · 감사3 no.7) -->
    <div class="hh"><div class="ht">만든 노래</div><button class="hx" id="hpopX" type="button" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button></div>
    <div class="hl" id="hlist"></div><!-- 빈 상태 = 조용한 공백(§디자인 e-가 — 필러 문구 금지) -->

<script src="nm-svg.js"></script><!-- 공유 아이콘 SSOT — COPY/CHECK/OK/ERR/WARN/DOWNLOAD_SVG -->
<script src="nm-loader.js"></script><!-- 로딩 표기 SSOT(orb + shimmer · 운영자 260723 Q460) -->
<script src="master.js"></script><!-- 완성곡 마스터링 엔진(nmMaster/nmMeasureLUFS/nmEncodeWAV · 브라우저 로컬 = 과금 0 · SUP3RMASS1VE/Suno-Song-Remaster ISC 이식) -->
<script src="upload.js"></script><!-- R2 직업로드 공용(nmUpArm/nmUpload · edit·conv·ly와 공유 — 보이스 소스 20MB 초과 경로 · 미가용 = 종전 20MB 캡 · 260722) -->
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PEND_KEY='nm_song_pend';
const API='/api/song';
const API_VOICE='/api/voice';
const BUDGET=1000;   // 폴 예산(초) — 하드 ×2 = 2000s ≥ 잡 캡 25분(1500s)+디스패치+Pages 배포(conv 문법 · 재개 게이트는 24h 별도)
const BUDGETS={voice:2600,'voice-train':5400};   // 클로닝 = Replicate 대기(apply 폴 ≤25분 · train ≤70분 + 잡 캡 85분) — 모드별 예산
let USER_ACT=false, _curStop=null, RES=null, OPTS=[], PICK=null, SONG_ID='';
const GAUGE={w:50,s:50,v:''};   // 고급 게이지(실험성·장르 충실·보컬) — 50 = 중립 = 안 만지면 종전 산출과 동일
const gaugeLive=()=>GAUGE.w<40||GAUGE.w>60||GAUGE.s<40||GAUGE.s>60||!!GAUGE.v;

const pendSet=o=>{ try{ localStorage.setItem(PEND_KEY, JSON.stringify(o)); }catch(e){} };
const pendGet=()=>{ try{ return JSON.parse(localStorage.getItem(PEND_KEY)||'null'); }catch(e){ return null; } };
const pendClear=()=>{ try{ localStorage.removeItem(PEND_KEY); }catch(e){} };

// ── 선택자 = 인라인 텍스트 값 + 촤르륵 팝업(썸네일 .onoff/.platpop 기틀 계승 — 도형 나열 폐지 · 운영자 260712) ──
function closeSelPops(except){ $$('.selpop').forEach(p=>{ if(p!==except) p.classList.add('none'); }); }
function selCtl(vId, popId, inId, def){
  const v=$(vId), pop=$(popId), inp=$(inId);
  let val=def;
  const set=x=>{ val=((x||'').trim()||def).slice(0,40);
    v.textContent=val; v.classList.toggle('on',val!==def);
    pop.querySelectorAll('.spbtn').forEach(b=>{ const on=b.dataset.v===val; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false'); });   // aria-pressed = k 칩 하우스 패턴(CII)
  };
  set(val);   // 초기 정규화(aria 포함)
  v.addEventListener('click',()=>{ const opening=pop.classList.contains('none'); closeSelPops(pop); pop.classList.toggle('none',!opening);
    if(opening&&inp){ const preset=[...pop.querySelectorAll('.spbtn')].some(b=>b.dataset.v===val); inp.value=(val!==def&&!preset)?val:''; } });
  pop.addEventListener('click',e=>{ const b=e.target.closest('.spbtn'); if(!b) return; set(b.dataset.v); pop.classList.add('none'); });
  if(inp) inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); set(inp.value); pop.classList.add('none'); } });
  return ()=>val;
}
const getGen=selCtl('#genV','#genPop','#genreIn','자동');
const getMood=selCtl('#moodV','#moodPop','#moodIn','자동');
const getTheme=selCtl('#themeV','#themePop','#themeIn','자동');
const getExp=selCtl('#expV','#expPop','#expIn','자동');
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.selpop')&&!e.target.closest('.selv')) closeSelPops(); },{capture:true});

// ── 버튼 상태(conv 게이지·에러 문법 계승 — 버튼 3개 공용화) ──
const fmtT=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function btnErr(g,m){
  if(!g) return;
  if(!g.dataset.label) g.dataset.label=g.textContent;
  clearTimeout(g._errT); clearTimeout(g._fT1); clearTimeout(g._fT2); clearTimeout(g._fT3);
  g.classList.remove('firing','okdone','checking'); g.removeAttribute('aria-busy');
  g.textContent=m; g.setAttribute('aria-live','assertive');
  g.classList.add('err'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
  g._errT=setTimeout(()=>{ g.classList.remove('err','shake'); g.textContent=g.dataset.label; },1700);
}
// 대기 표기 = 버튼 아닌 상태줄(썸네일 발사 상태머신 계승 260712 — 버튼 = 풀필→접수 ✓→라벨 원복 · 상주 라벨 폐지)
let _stTick=null;
function statusWait(on,t0,label){
  const st=$('#sstatus');
  clearInterval(_stTick); _stTick=null;
  if(on){
    st.classList.remove('err'); st.classList.add('wait');
    if(window.nmLoader){   // orb 로더(Solving · 운영자 260723 Q460) — orb는 1회만 생성(매초 재그리기 = 애니 리셋 방지) · 시간만 갱신
      st.innerHTML=nmLoader('solving','제작중…')+'<span class="gtime nm-shim"></span>';   // 경과시간도 빛 스윕(운영자 260731 "로딩 그래픽하고 붙어있는 글자들") = .nm-shim 도료만 부착(폰트·마진 종전)
      const gt=st.querySelector('.gtime');
      const eta=window.nmEta?nmEta.label(mode&&/voice/.test(mode)?'song-voice':'song'):'';   // 예상 = nmEta(보이스 축은 소요가 3배라 키 분리 · 시드 → 실측 평균 수렴)
      const paint=()=>{ if(gt) gt.textContent=fmtT((Date.now()-t0)/1000)+eta; };
      paint(); _stTick=setInterval(paint,1000);
    } else {   // 폴백 = 구 점3
      const paint=()=>{ st.innerHTML=esc(label||'생성 중')+'…<span class="gtime">'+fmtT((Date.now()-t0)/1000)+'</span>'; };   // 폴백(nmLoader 미로드 시만 — 상시 로드라 사문화) = 평문 · gdots 제거(로딩 SSOT 게이트)
      paint(); _stTick=setInterval(paint,1000);
    }
  } else { st.classList.remove('wait'); }
}
const WL={options:'옵션 생성 중',suno:'프롬프트 생성 중',lyria:'곡 만드는 중',voice:'보이스 입히는 중'};
// 발사 상태머신 = thumb goFire verbatim 계승('전송 중…' 풀필 → ✓ 스트로크 드로우 → '전송됨' → 라벨 원복 · 운영자 260713 "버튼도 다 계승")
function goFire(gb){
  if(!gb.dataset.label) gb.dataset.label=gb.textContent;
  clearTimeout(gb._fT1); clearTimeout(gb._fT2); clearTimeout(gb._fT3); clearTimeout(gb._errT);
  gb.classList.remove('firing','okdone','checking','err','shake'); void gb.offsetWidth;   // 리플로우 = 게이지 재시작
  gb.classList.add('firing'); gb.textContent='전송 중…'; gb.setAttribute('aria-busy','true');
  gb._fT1=setTimeout(()=>{
    gb.classList.remove('firing'); gb.classList.add('okdone','checking');
    gb.innerHTML='<svg class="gck" viewBox="0 0 24 24" role="img" aria-label="전송됨"><path d="M5 13l4 4L19 7"/></svg>';
    gb.removeAttribute('aria-busy');
    gb._fT2=setTimeout(()=>{
      gb.classList.remove('checking'); gb.textContent='전송됨';
      gb._fT3=setTimeout(()=>{ gb.classList.remove('okdone'); gb.textContent=gb.dataset.label||''; },850);
    },560);
  },900);
}
function goIdle(gb){ if(!gb) return; clearTimeout(gb._fT1); clearTimeout(gb._fT2); clearTimeout(gb._fT3); gb.classList.remove('firing','okdone','checking'); gb.removeAttribute('aria-busy'); if(gb.dataset.label) gb.textContent=gb.dataset.label; }   // 접수 실패 = 게이지 회수·라벨 원복(에러는 상태줄·btnErr가 표시)

// ── 발사(모드 공용 — POST+게이지 골격 = fireApi 1곳 · 음원/클로닝 공용) ──
async function fireApi(gb, url, payload, onAccept){
  USER_ACT=true;
  const status=$('#sstatus'); status.classList.remove('err','wait'); status.textContent='';
  const t0=Date.now();
  goFire(gb);   // thumb 문법 — 재발사 방어 = .firing pointer-events:none(+서버 rateGate)
  try{
    const res=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
    const j=await res.json();
    if(!res.ok||j.error){ goIdle(gb); status.innerHTML=WARN_SVG+' '+esc(String(j.error||('서버 오류 '+res.status+' — 잠시 후 다시'))); status.classList.add('err'); return; }
    onAccept(j, t0);   // 접수 성공 — 버튼은 goFire 시퀀스가 ✓→전송됨→원복 · 대기는 상태줄(statusWait — 폴이 켬)
  }catch(e){ goIdle(gb); status.innerHTML=WARN_SVG+' 요청 실패 — 잠시 후 다시 ('+esc(e.message)+')'; status.classList.add('err'); }
}
function fire(mode, gb){
  const story=$('#story').value.trim();
  if(!story) return btnErr(gb,'스토리(대사나 상황)를 적어줘');
  const payload={ mode, genre:getGen(), express:getExp(), mood:getMood(), theme:getTheme(), story:story.slice(0,1500) };
  if(mode!=='options'&&PICK) payload.pick=PICK;
  if(mode!=='options'&&gaugeLive()) payload.opts={w:GAUGE.w, s:GAUGE.s, v:GAUGE.v};   // 중립뿐이면 아예 안 싣는다(서버도 같은 판정 = 이중 방어)
  fireApi(gb, API, payload, (j,t0)=>{ pendSet({id:j.id, mode, t0, story:story.slice(0,1500)}); pollSong(j.id, mode, t0, t0-90000, gb); });
}
$('#optGo').addEventListener('click',()=>fire('options',$('#optGo')));
$('#sunoGo').addEventListener('click',()=>fire('suno',$('#sunoGo')));
$('#lyriaGo').addEventListener('click',()=>fire('lyria',$('#lyriaGo')));

// ── 폴(conv pollConv 문법 계승: error.log 즉시 보고 · SPA-HTML 가드 — 빌드 전 200을 완료로 오인 금지) ──
function pollSong(id, mode, t0, minTs, gb){
  if(_curStop)_curStop();
  SONG_ID=id;
  const status=$('#sstatus');   // ⚠️ 스코프 필수 — 없으면 window.status(문자열)로 새서 에러·타임아웃 표면화가 조용히 죽음(260712 회귀 실측·수리)
  statusWait(true, t0, WL[mode]||'생성 중');   // 대기 = 상태줄 정중앙(버튼 원복 = 썸네일 상태머신 계승)
  const outPath='song_out/'+id+'/'+(mode==='options'?'options.json':'song.json');
  const errPath='song_out/'+id+'/error.log';
  let live=true; const stop=()=>{ live=false; statusWait(false); }; _curStop=stop;
  const need=mode==='options'?'options':(mode==='voice'?'url':'lyrics');   // 완료 판정 필드(모드별) — 커버는 오디오(url)가 본질
  const budget=BUDGETS[mode]||BUDGET;
  const tick=async()=>{
    if(!live) return;
    if(Date.now()-t0>budget*2000){ stop(); status.innerHTML=ERR_SVG+' 시간 초과 — 완성되면 다음에 열 때 이어받아'; status.classList.add('err'); return; }
    try{
      const er=await fetch(errPath+'?t='+Date.now());
      if(!live) return;
      if(er.ok){
        const ect=(er.headers.get('content-type')||'').toLowerCase();
        const em=await er.text();
        if(!live) return;
        const eHtml=ect.includes('text/html')||/^\s*<!doctype/i.test(em)||/<html[\s>]/i.test(em.slice(0,300));
        if(em&&em.trim()&&!eHtml){ stop(); pendClear(); status.innerHTML=ERR_SVG+' '+esc(em.trim().slice(0,300)); status.classList.add('err'); return; }
      }
    }catch(e){ /* 재시도 */ }
    try{
      const r=await fetch(outPath+'?t='+Date.now());
      if(!live) return;
      if(r.ok){
        const ct=(r.headers.get('content-type')||'').toLowerCase();
        const tx=await r.text();
        if(!live) return;
        const isHtml=ct.includes('text/html')||/^\s*<!doctype/i.test(tx)||/<html[\s>]/i.test(tx.slice(0,300));
        if(tx&&tx.trim()&&!isHtml){
          let d=null; try{ d=JSON.parse(tx); }catch(e){}
          if(d&&d[need]){
            const ts=Date.parse(d.ts||'');
            if(!isNaN(ts)&&ts>=minTs){   // 원 디스패치 이후 산출만(과거 오인 차단 · ts=KST ISO)
              stop(); pendClear();
              if(window.nmEta) nmEta.done(mode&&/voice/.test(mode)?'song-voice':'song',(Date.now()-t0)/1000);   // 예상 학습 = 성공 완료만(sb·k 배선 그대로 · 실패·초과 경로엔 안 넣는다 = 평균 오염 차단)
              if(mode==='options') renderOptions(d, Math.round((Date.now()-t0)/1000));
              else if(d.engine==='lyria'||d.engine==='rvc'||d.url) showLyria(d, Math.round((Date.now()-t0)/1000));   // 오디오 있는 산출 = 완성곡 뷰(lyria·rvc 커버)
              else showSuno(d, Math.round((Date.now()-t0)/1000));
              return;
            }
          }
        }
      }
    }catch(e){ /* 재시도 */ }
    if(live) setTimeout(tick,5000);
  };
  tick();
}

// ── 렌더 ──
function updateGoSpec(){   // 결과물 명세 readout — 썸네일 goSpec 표기 관례(라벨 mut·값 점등·`|` 구분·대괄호 없음)
  const gs=$('#goSpec'); if(!gs) return;
  const v=(x,on)=>'<span class="gs-v'+(on?' on':'')+'">'+esc(x)+'</span>';
  const sep='<span class="gs-sep">|</span>';
  const mo=getMood(), th=getTheme();
  const L=x=>'<span class="gs-lbl">'+x+'</span> ';
  gs.innerHTML=L('스타일')+v(PICK?PICK.name:'자동',!!PICK)
    +sep+L('보컬')+v(PICK&&PICK.vocal?PICK.vocal:'자동',!!(PICK&&PICK.vocal))
    +(PICK&&PICK.bpm?(sep+L('BPM')+v(PICK.bpm,true)):'')
    +(mo!=='자동'?(sep+L('분위기')+v(mo,true)):'')
    +(th!=='자동'?(sep+L('테마')+v(th,true)):'')
    +(GAUGE.w!==50?(sep+L('실험성')+v(GAUGE.w+'%',true)):'')
    +(GAUGE.s!==50?(sep+L('장르 충실')+v(GAUGE.s+'%',true)):'')
    +(GAUGE.v?(sep+L('성별')+v(GAUGE.v==='male'?'남성':'여성',true)):'')   /* 라벨 '보컬' = PICK 보컬(male/female/duet)이 이미 쓰는 축 — 겹치면 같은 줄에 '보컬'이 두 번 나온다(실측) */
    +sep+L('길이')+v('60초 미만',true)
    +sep+L('훅')+v('15초 내',true);
}
updateGoSpec();   // 부팅 리드백 = 도크 스트립 상주(운영자 260725 5탭 통일 — 구 #optwrap 안 readout은 옵션 생성 후에만 채워져 빈 박스로 보였다 · 값 = 기본 선택(스타일·보컬 자동 · 길이·훅 고정))
function renderOptions(d, sec){
  OPTS=d.options||[]; PICK=null;
  $('#out').hidden=true; $('#lout').hidden=true;
  $('#sstatus').classList.remove('err');
  $('#sstatus').innerHTML=OK_SVG+' 옵션 '+OPTS.length+'개'+(sec?(' ('+sec+'s)'):'')+' — 골라서 아래 버튼으로';
  $('#optgrid').innerHTML=OPTS.map((o,i)=>'<button type="button" class="optcard" data-i="'+i+'"><div class="optname">'+esc(o.name||'')+'</div><div class="optwhy">'+esc(o.why||'')+'</div><div class="optmeta">'+esc(o.vocal||'')+(o.bpm?(' · '+o.bpm+' bpm'):'')+'</div></button>').join('');
  updateGoSpec();
  const ow=$('#optwrap'); ow.hidden=false;
  try{ ow.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){}
}
$('#optgrid').addEventListener('click',e=>{
  const b=e.target.closest('.optcard'); if(!b) return;
  const i=+b.dataset.i;
  const was=b.classList.contains('on');
  $$('#optgrid .optcard').forEach(x=>x.classList.remove('on'));
  if(was){ PICK=null; updateGoSpec(); return; }   // 재탭 = 해제(자동)
  b.classList.add('on'); PICK=OPTS[i]||null; updateGoSpec();
});
function showSuno(d, sec){
  RES=d;
  $('#lout').hidden=true;
  $('#sstatus').classList.remove('err');
  $('#sstatus').innerHTML=OK_SVG+' 완료'+(sec?(' ('+sec+'s)'):'')+' — 수노 커스텀 모드에 칸별로 붙여넣기';
  $('#rTitle').textContent=d.title||'';
  $('#rStyle').textContent=d.style||'';
  $('#rLyrics').textContent=d.lyrics||'';
  $('#rExcl').textContent=d.exclude||'';
  $('#rMeta').textContent=(d.genre||'자동')+' · '+(d.express||'자동')+' · 목표 '+(d.target||'60초 미만');
  vcRender();   // 텍스트 산출 = 오디오 없음 → [보이스 입히기] 숨김 동기화
  const out=$('#out'); out.hidden=false;
  try{ out.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){}
}
function showLyria(d, sec){
  RES=d;
  $('#out').hidden=true;
  $('#sstatus').classList.remove('err');
  $('#sstatus').innerHTML=OK_SVG+' 완성곡'+(sec?(' ('+sec+'s)'):'');
  $('#lTitle').textContent=d.title||'';
  const aud=$('#lAud'); aud.src=d.url||'';
  $('#lLyr').textContent=d.sung||d.lyrics||'';

    ?('보이스 커버'+(d.voice_name?(' · '+d.voice_name):''))
    :('Lyria 3'+(d.model?(' · '+d.model):'')))+(d.sung&&d.lyrics&&d.sung!==d.lyrics?' · 실제 부른 가사 기준':'');
  $('#lDl').classList.remove('dl-done');
  vcRender();   // 보이스 선택 + 오디오 有 = [보이스 입히기] 노출 갱신
  const lo=$('#lout'); lo.hidden=false;
  try{ lo.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){}
}

$$('.cpy').forEach(b=>{ b.innerHTML=COPY_SVG; });

//    흐름 = R2 곡(api/dl 프록시 = same-origin) → decodeAudioData → nmMaster(2패스 정규화+리미터) → WAV Blob → <audio> 교체·저장
const MA=nmMaDefaults(), MA_DEF=nmMaDefaults();
let MA_SRCURL='', MA_BUF=null, MA_OUTBUF=null, MA_URL='', MA_ORIGSRC='';
const MA_FMT={ maLufs:v=>v.toFixed(1), maCeil:v=>v.toFixed(1), maWid:v=>v+'%', maGain:v=>(v>0?'+':'')+v.toFixed(1) };
const MA_KEY={ maLufs:'targetLufs', maCeil:'ceilingDb', maWid:'width', maGain:'gainDb' };
const MA_UNIT={ maLufs:'LUFS', maCeil:'dBTP', maWid:'퍼센트', maGain:'데시벨' };
function maPaint(el,out,key,txt,unit){   // aria-valuetext = 리드아웃과 등가(숫자만 읽히면 단위·기본 여부가 안 들린다) · readout은 aria-hidden으로 이중낭독 차단
  out.textContent=txt;
  const dflt = key==null ? false : (typeof MA_DEF[key]==='number' ? +el.value===MA_DEF[key] : false);
  out.classList.toggle('on', !dflt);
  el.setAttribute('aria-valuetext', txt+(unit?(' '+unit):'')+(dflt?' · 기본':''));
}
function maBind(id){
  const el=$('#'+id), out=$('#'+id+'V'), key=MA_KEY[id];
  const paint=()=>{ const v=+el.value; MA[key]=v; maPaint(el,out,key,MA_FMT[id](v),MA_UNIT[id]); };
  el.addEventListener('input',paint); paint();
}
Object.keys(MA_KEY).forEach(maBind);

async function maLoad(){
  const u=(RES&&RES.url)||'';
  if(!u) throw new Error('완성곡이 있어야 다듬어');
  if(MA_SRCURL===u&&MA_BUF) return MA_BUF;
  const src=/^https:\/\//i.test(u)?('api/dl?u='+encodeURIComponent(u)+'&n=src'):u;   // 교차출처 R2 = 다운로드와 같은 프록시(same-origin이라 decodeAudioData 가능)
  const r=await fetch(src);
  if(!r.ok) throw new Error('곡을 못 불러왔어 ('+r.status+')');
  const ab=await r.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext;
  const ctx=new AC();
  try{ MA_BUF=await ctx.decodeAudioData(ab); } finally { try{ ctx.close(); }catch(e){} }
  MA_SRCURL=u; return MA_BUF;
}
const maDb=v=>(isFinite(v)?v.toFixed(1):'—');
$('#maGo').addEventListener('click',async()=>{
  const gb=$('#maGo');
  if(!(RES&&RES.url)) return btnErr(gb,'완성곡이 있어야 다듬어');
  if(!gb.dataset.label) gb.dataset.label=gb.textContent;
  gb.disabled=true; $('#maDl').disabled=true; gb.setAttribute('aria-busy','true');
  const met=$('#maMet');
  try{
    const step=m=>{ gb.innerHTML=window.nmLoader?nmLoader('solving',m,{size:15}):esc(m)+'…'; };   // 진행 표기 = orb 로더 SSOT(버튼 안팎 공통 · 평문 직접 표기 금지)
    step('곡 읽는 중'); met.textContent='';
    const buf=await maLoad();
    const res=await nmMaster(buf, MA, step);
    MA_OUTBUF=res.buffer;
    if(MA_URL) URL.revokeObjectURL(MA_URL);
    MA_URL=URL.createObjectURL(nmEncodeWAV(res.buffer, MA.bitDepth));
    const aud=$('#lAud');
    if(!MA_ORIGSRC) MA_ORIGSRC=aud.src;
    aud.src=MA_URL; try{ await aud.play(); }catch(e){ /* 자동재생 차단 = 플레이어 노출로 갈음 */ }
    met.innerHTML='다듬기 전 <b>'+maDb(res.before.integratedLUFS)+'</b> LUFS · 후 <b>'+maDb(res.after.integratedLUFS)+'</b> LUFS'
      +' · 트루피크 <b>'+maDb(res.truePeakDB)+'</b> dBTP · '+(MA.sampleRate/1000)+'kHz '+MA.bitDepth+'bit';
    $('#maDl').disabled=false;
  }catch(err){ met.innerHTML=WARN_SVG+' '+esc(err.message||'다듬기 실패'); btnErr(gb, '다듬기 실패'); }
  finally{ gb.disabled=false; gb.removeAttribute('aria-busy'); if(!gb.classList.contains('err')) gb.textContent=gb.dataset.label; }
});
$('#maDl').addEventListener('click',()=>{
  if(!MA_URL) return;
  const a=document.createElement('a');
  a.href=MA_URL; a.download='song_'+(SONG_ID||Date.now())+'_master.wav';
  document.body.appendChild(a); a.click(); a.remove();
});

// ── 만든 노래(플레이리스트) — 메시지함(msgpop) 계승 팝업 · index.json = 빌드 산출(운영자 260712) ──
//    행 탭 = 그 곡 로드+재생 · 곡 끝 = 다음 곡 자동(마지막 = 정지) · 빈 상태 = 조용한 공백(§디자인 e-가)
let PLIST=[], PIDX=-1;
const hpop=$('#hpop');
function hRow(s,i){
  const d=(s.ts||'').slice(5,16).replace('T',' ');
  return '<button class="hrow'+(i===PIDX?' on':'')+'" data-i="'+i+'" type="button"><span class="t">'+esc(s.title||'(무제)')+'</span>'+(i===PIDX?'<span class="eq">재생 중</span>':'<span></span>')+'<span class="m">'+esc(d)+' · '+esc(s.engine==='lyria'?'구글':(s.engine==='rvc'?'보이스':(s.engine||'')))+(s.genre?(' · '+esc(s.genre)):'')+'</span></button>';
}
function renderList(){ $('#hlist').innerHTML=PLIST.map((s,i)=>hRow(s,i)).join(''); }
async function openHist(){
  hpop.hidden=false; renderList();
  let ok=false;
  try{
    const r=await fetch('song_out/index.json?t='+Date.now());
    if(r.ok){ const ct=(r.headers.get('content-type')||'').toLowerCase(); const tx=await r.text();
      if(tx&&!ct.includes('text/html')&&!/^\s*</.test(tx)){ const j=JSON.parse(tx); if(Array.isArray(j)){ PLIST=j; renderList(); ok=true; _hSig=tx; } } }   // _hSig 동기 = 직후 10s 폴이 동일 목록을 헛-재렌더 안 하게(아래 pollHist 게이트와 한 쌍 · 260731)
  }catch(e){ /* 미배포·오프라인·빌드실패 = 아래 실패 신호 */ }
  if(!ok && !PLIST.length) $('#hlist').innerHTML='<button class="hrow" type="button" data-retry="1"><span class="t">목록을 못 불러왔어</span><span></span><span class="m">다시 시도</span></button>';   // 로드 실패만 구분 신호(빈 목록 성공 = 침묵 유지 · §디자인 e-가 존중 · 운영자 260723 한수)
}
$('#histBtn').addEventListener('click',()=>{ if(hpop.hidden) openHist(); else hpop.hidden=true; });
let _hSig='';   // 이력 무변경 감지 시그니처(10s 폴 재렌더 억제 = 깜빡임 0 · edit _jlSig 미러)
async function pollHist(){   // 이력 재fetch(무변경 skip) — 수동 새로고침·10s 자동 폴 공용
  try{
    const r=await fetch('song_out/index.json?t='+Date.now()); if(!r.ok) return;
    const ct=(r.headers.get('content-type')||'').toLowerCase(); const tx=await r.text();
    if(!tx||ct.includes('text/html')||/^\s*</.test(tx)||tx===_hSig) return;
    _hSig=tx; const j=JSON.parse(tx); if(Array.isArray(j)){ PLIST=j; renderList(); }
  }catch(e){}
}
window.nmRefresh=()=>{ if(!hpop.hidden) return pollHist(); };   // 부모 셸 헤더 새로고침(#toolRf · 운영자 260731) 훅 — 이력 팝업 열림 중만 재fetch(닫힘 = openHist가 열 때마다 재fetch라 스테일 0)
setInterval(()=>{ if(!document.hidden&&!hpop.hidden) pollHist(); },10000);   // raw-ok: 폴 주기(ms — 지속시간 토큰 아님) · 10s 자동 폴(운영자 260731 "동기화가 십초 단위로") — 팝업 열림 중만(닫힘 = 열 때 재fetch가 신선도 전담) · sig 게이트 = 무변경 재렌더 0
$('#hpopX').addEventListener('click',()=>{ hpop.hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!hpop.hidden){ e.stopImmediatePropagation(); hpop.hidden=true; } closeSelPops(); } });   // 이력 팝업 열림 = ESC 소비(부모 브릿지 차단 · 평의회 260713 ③ — selpop 축은 보수 유지)
document.addEventListener('pointerdown',e=>{ if(!hpop.hidden&&!e.target.closest('.hpop')&&!e.target.closest('.histbtn')) hpop.hidden=true; },{capture:true});
async function playIdx(i,autoplay){
  const s=PLIST[i]; if(!s) return;
  PIDX=i; renderList();
  let d=null;
  try{ const r=await fetch('song_out/'+encodeURIComponent(s.id)+'/song.json?t='+Date.now()); if(r.ok){ const tx=await r.text(); if(!/^\s*</.test(tx)) d=JSON.parse(tx); } }catch(e){}
  if(!d||!d.url) d={title:s.title,url:s.url,engine:s.engine,lyrics:''};   // 폴백 = 인덱스 값만으로 재생(가사 없이)
  SONG_ID=s.id; showLyria(d,0);
  if(autoplay){ try{ await $('#lAud').play(); }catch(e){ /* 자동재생 차단 = 플레이어 노출로 갈음 */ } }
}
$('#hlist').addEventListener('click',e=>{ const b=e.target.closest('.hrow'); if(!b) return; if(b.dataset.retry){ openHist(); return; } playIdx(+b.dataset.i,true); });
$('#lAud').addEventListener('ended',()=>{ if(PIDX>=0&&PIDX+1<PLIST.length) playIdx(PIDX+1,true); });

// ── 음성 클로닝(운영자 260712 · Replicate RVC — svc-bench 판정: Seed-VC CPU 탈락 → 전환 승인) ──
//    train: 소스(1~5분)+동의 → /api/voice → voice_out/<vid>/voice.json 폴 · apply: 완성곡+보이스 → 커버 = pollSong 'voice'

let VOICES=[], VSEL=null, VFILE=null, VFNAME='';

async function vcLoad(){

    const r=await fetch('voice_out/index.json?t='+Date.now());

  if(!ok && !VOICES.length) $('#vcPop').innerHTML='<button type="button" class="spbtn" data-retry="1">목록을 못 불러왔어 · 다시 시도</button>';   // 로드 실패만 구분(빈 목록 = 침묵) · 운영자 260723 한수
}
$('#vcV').addEventListener('click',()=>{ const pop=$('#vcPop'); const opening=pop.classList.contains('none'); closeSelPops(pop); pop.classList.toggle('none',!opening); if(opening) vcLoad(); });
$('#vcPop').addEventListener('click',e=>{ const b=e.target.closest('.spbtn'); if(!b) return; if(b.dataset.retry){ vcLoad(); return; } VSEL=b.dataset.v||null; vcRender(); $('#vcPop').classList.add('none'); });
$('#consBtn').addEventListener('click',e=>{ const b=e.currentTarget; const on=!b.classList.contains('on'); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false'); });
$('#vFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  if(VR2&&window.nmUpDrop) nmUpDrop(VR2);   // 이전 R2 키 고아 정리(대체 선택 · edit 평의회7 F2 계승)
  VR2=''; VRAW=null;
  if(f.size>2*1024*1024*1024){ e.target.value=''; return btnErr($('#trainGo'),'파일은 2GB까지'); }   // api/upload 계약 절대캡
  const r2on=window.nmUpArm&&await nmUpArm();   // R2 직업로드 1순위(전 크기 · edit 동문 "작은 파일도 R2, b64 = 예비역" · 운영자 260722 단일화) — 미가용 = 종전 20MB 캡 폴백
  if(!r2on&&f.size>20*1024*1024){ e.target.value=''; return btnErr($('#trainGo'),'파일은 ≤20MB — 1~5분 mp3/m4a'); }
  if(r2on){
    VRAW=f;
    try{
      const up=await nmUpload(f,p=>{ if(VRAW===f) $('#vfName').textContent=f.name+' · '+p+'%'; });
      if(VRAW!==f){ nmUpDrop(up.key); return; }   // 업로드 중 다른 파일 선택 = 낡은 완료 무시 + 고아 키 정리(edit 평의회7 F2 계승)
      VR2=up.key; VFILE=null; VFNAME=f.name; $('#vfName').textContent=f.name; $('#vfLab').classList.add('has');
      return;
    }catch(err){
      if(f.size>20*1024*1024){ VRAW=null; VR2=''; VFNAME=''; $('#vfName').textContent=''; $('#vfLab').classList.remove('has'); e.target.value=''; return btnErr($('#trainGo'),'업로드 실패 — 다시'); }
      VRAW=null;   // 20MB 이하 = 아래 종전 b64 폴백으로 계속(가용성 우선 · edit 동문)
    }
  }
  try{
    await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ VFILE=r.result; res(); }; r.onerror=()=>rej(r.error||new Error('읽기 실패')); r.readAsDataURL(f); });
    VFNAME=f.name; $('#vfName').textContent=f.name; $('#vfLab').classList.add('has');
  }catch(err){ VFILE=null; VFNAME=''; $('#vfName').textContent=''; $('#vfLab').classList.remove('has'); btnErr($('#trainGo'),'파일 읽기 실패 — 다시'); }
});
$('#trainGo').addEventListener('click',async ()=>{
  const gb=$('#trainGo');
  if(!VFILE&&!VR2&&!VRAW) return btnErr(gb,'보이스 소스(1~5분)를 올려줘');
  if(!$('#consBtn').classList.contains('on')) return btnErr(gb,'동의 먼저 — 본인·권리 보유 음성만');
  if(!VFILE&&!VR2&&VRAW){   // 소진된 R2 키 재업로드(러너가 잡 끝 원본 삭제 = 일회용 · 파일은 브라우저에 남아 재선택 불필요 — edit 관례 · 260722)
    const f=VRAW;
    try{ const up=await nmUpload(f,p=>{ if(VRAW===f) $('#vfName').textContent=f.name+' · '+p+'%'; }); if(VRAW!==f){ nmUpDrop(up.key); return; } VR2=up.key; $('#vfName').textContent=f.name; }
    catch(err){ return btnErr(gb,'업로드 실패 — 파일 다시 선택'); }
  }
  const pay={mode:'train', name:$('#vName').value.trim().slice(0,24), consent:true, fname:VFNAME};
  if(VR2) pay.r2key=VR2; else pay.fileB64=VFILE;   // 20MB 초과 = R2 키(b64 미탑재 · 260722)
  await fireApi(gb, API_VOICE, pay,
    (j,t0)=>{ pendSet({id:j.id, mode:'voice-train', t0}); pollVoice(j.id, t0, t0-90000); });
  if(pay.r2key) VR2='';   // 발사 시도 = 키 수명 종료(성공 = 러너 소진 · 실패 = 죽은 키 재사용 루프 차단 — 다음 발사는 VRAW 재업로드 · edit 평의회7 계승)
});
$('#vApply').addEventListener('click',()=>{
  const gb=$('#vApply');
  if(!(VSEL&&SONG_ID&&RES&&RES.url)) return;
  fireApi(gb, API_VOICE, {mode:'apply', src:SONG_ID, vid:VSEL},
    (j,t0)=>{ pendSet({id:j.id, mode:'voice', t0}); pollSong(j.id, 'voice', t0, t0-90000, gb); });
});
function pollVoice(id, t0, minTs){   // 학습 폴 — pollSong 미러(voice_out 루트 · 완료 = model_url · 학습은 길어서 10s 간격)
  if(_curStop)_curStop();
  const status=$('#sstatus');
  statusWait(true, t0, '보이스 학습 중');
  const outPath='voice_out/'+id+'/voice.json', errPath='voice_out/'+id+'/error.log';
  let live=true; const stop=()=>{ live=false; statusWait(false); }; _curStop=stop;
  const budget=BUDGETS['voice-train'];
  const tick=async()=>{
    if(!live) return;
    if(Date.now()-t0>budget*2000){ stop(); status.innerHTML=ERR_SVG+' 시간 초과 — 완성되면 다음에 열 때 이어받아'; status.classList.add('err'); return; }
    try{
      const er=await fetch(errPath+'?t='+Date.now());
      if(!live) return;
      if(er.ok){
        const ect=(er.headers.get('content-type')||'').toLowerCase();
        const em=await er.text();
        if(!live) return;
        const eHtml=ect.includes('text/html')||/^\s*<!doctype/i.test(em)||/<html[\s>]/i.test(em.slice(0,300));
        if(em&&em.trim()&&!eHtml){ stop(); pendClear(); status.innerHTML=ERR_SVG+' '+esc(em.trim().slice(0,300)); status.classList.add('err'); return; }
      }
    }catch(e){ /* 재시도 */ }
    try{
      const r=await fetch(outPath+'?t='+Date.now());
      if(!live) return;
      if(r.ok){
        const ct=(r.headers.get('content-type')||'').toLowerCase();
        const tx=await r.text();
        if(!live) return;
        const isHtml=ct.includes('text/html')||/^\s*<!doctype/i.test(tx)||/<html[\s>]/i.test(tx.slice(0,300));
        if(tx&&tx.trim()&&!isHtml){
          let d=null; try{ d=JSON.parse(tx); }catch(e){}
          if(d&&d.model_url){
            const ts=Date.parse(d.ts||'');
            if(!isNaN(ts)&&ts>=minTs){   // 원 디스패치 이후 산출만(과거 오인 차단)
              stop(); pendClear();
              if(window.nmEta) nmEta.done('song-voice',(Date.now()-t0)/1000);   // 예상 학습 = 성공 완료만(sb·k 배선 그대로 · 실패·초과 경로엔 안 넣는다 = 평균 오염 차단)
              status.classList.remove('err');
              status.innerHTML=OK_SVG+' 보이스 학습 완료 — '+esc(d.name||'보이스');
              VSEL=id; vcLoad();   // 새 보이스 자동 선택 + 목록 갱신([보이스 입히기] 활성)
              return;
            }
          }
        }
      }
    }catch(e){ /* 재시도 */ }
    if(live) setTimeout(tick,10000);
  };
  tick();
}
vcLoad();   // 부팅 로드 — 플레이리스트 재생만 해도 [보이스 입히기]가 뜨게

// ── 완료 푸시 딥링크(?done=<id> · Access 재로그인 하드 리다이렉트서 해시 유실·쿼리 생존 · #done 호환) — 그 곡 결과로 직행+강조(edit/thumb 정본 계승 · voice 커버도 song_out 공용) ──
function edFocus(sel){ const el=$(sel); if(!el||el.hidden) return; try{ el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'center'}); }catch(e){} el.classList.add('edfocus'); setTimeout(()=>el.classList.remove('edfocus'),2200); }
(function(){
  const id=(location.search.match(/[?&]done=([\w-]+)\b/)||[])[1]||(location.hash.match(/^#done=([\w-]+)$/)||[])[1];   // 패턴 = thumb doneReq [\w-] 통일(Q176 — id 형식 변경 내성·경로 주입 동일 차단)
  if(!id) return;
  USER_ACT=true; pendClear();   // 딥링크 = pend 재개보다 우선(그 작업 확정 랜딩)
  (async()=>{
    try{
      const r=await fetch('song_out/'+id+'/song.json?t='+Date.now());
      if(r.ok){ const tx=await r.text(); if(tx&&!/^\s*</.test(tx)){ let d=null; try{ d=JSON.parse(tx); }catch(e){}
        if(d&&d.url){ SONG_ID=id; showLyria(d,0); edFocus('#lout'); return; } } }   // 곡·보이스커버 결과 = showLyria 공용(engine rvc/lyria 분기 내장)
      const er=await fetch('song_out/'+id+'/error.log?t='+Date.now());
      if(er.ok){ const em=await er.text(); if(em&&em.trim()&&!/^\s*</.test(em)){ $('#sstatus').innerHTML=ERR_SVG+' '+esc(em.trim().slice(0,160)); $('#sstatus').classList.add('err'); } }
    }catch(e){}   // 학습(train) 등 곡 없는 잡 = song.json 부재 → 조용히 통상 오픈(pend/이력이 커버)
  })();
})();

// ── 재개(pend) — 리로드/재진입 시 진행 중 생성 폴 이어받기(conv 문법 · 24h 게이트) ──
(function(){
  const p=pendGet(); if(!p||!p.id||USER_ACT) return;
  if(Date.now()-(p.t0||0)>24*3600e3){ pendClear(); return; }
  if(p.story&&!$('#story').value) $('#story').value=p.story;   // 후속 발사 재료 복원(칩은 기본 유지 — 옵션/가사엔 story+pick이 본질)
  if(p.mode==='voice-train'){ const t0c=Math.max(p.t0||0, Date.now()-BUDGETS['voice-train']*1000); pollVoice(p.id, t0c, (p.t0||0)-90000); return; }
  if(p.mode!=='options'&&p.mode!=='voice'){ $('#optwrap').hidden=false; updateGoSpec(); }   // 엔진 진행 표시 위해 행 노출(커버 재개는 폼 노이즈 없이)
  const t0c=Math.max(p.t0||0, Date.now()-(BUDGETS[p.mode]||BUDGET)*1000);   // 경과·타임아웃 기점 클램프 = 재개마다 폴 창 확보 · 신선도는 원 t0 기준(분리)
  pollSong(p.id, p.mode||'suno', t0c, (p.t0||0)-90000, null);
})();
// ── 미리보기 확대(돋보기) = viewer/tr.html `PVZOOM` 정본 동문 사본(운영자 260803 "카드 제작 부분과 동일하게") · 저장 차단 환경은 무저장 = 상시 축소(종전 동작) ──
const PVZOOM = { K: 'nm.pvzoom',
  get() { try { return localStorage.getItem(this.K) === '1'; } catch (_) { return false; } },
  set(on) { try { on ? localStorage.setItem(this.K, '1') : localStorage.removeItem(this.K); } catch (_) {} } };
(function () {
  const td = document.getElementById('topDock'), b = document.getElementById('cpZoom'); if (!td || !b) return;
  const paint = on => { td.classList.toggle('dockzoom', on); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.setAttribute('aria-label', on ? '미리보기 원상복귀' : '미리보기 확대'); b.title = on ? '탭=원상복귀' : '탭=미리보기 확대 · 다시 탭=원상복귀'; };
  paint(PVZOOM.get());
  b.addEventListener('click', () => { const on = !td.classList.contains('dockzoom'); paint(on); PVZOOM.set(on); });
})();

</script>
