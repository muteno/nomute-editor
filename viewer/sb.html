<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- 전역 버튼 탭 햅틱 = 폐지(운영자 260706 5차) --><!-- 부모(index)와 color-scheme 일치 필수 — k.html:7 계승 -->
<title>스토리보드</title>
<link rel="stylesheet" href="tokens.css">   <!-- 공유 구조토큰(§🎨 STAGE3·index :root 파생·색 제외). 인라인 :root가 팔레트 오버라이드 -->
<link rel="stylesheet" href="nm-cards.css">   <!-- 다운로드·결과/이전제작 카드 공용 CSS SSOT(전 앱 단일정본 · 운영자 260731 "하나 바꾸면 다 연동") — 색·플레이트·✓팝 계약은 여기서만 고친다(인라인 사본 금지 · 인라인이 뒤라 남기면 이 SSOT가 죽음) -->
<style>
  /* ⚠️ 기틀 계승 원본 = viewer/k.html(영상 프롬프트) — 공유 블록은 바이트 동일 유지(운영자 260714 "그대로 기틀 참고·맘대로 생성 금지"). 여기만 고치면 드리프트 — 공용 수정은 k.html과 양쪽 동시.
     ※ **의도 divergence(공유 블록 예외 · 260730)**: `textarea{min-height}` = sb 단독 64px(운영자 Q1159 "높이 2/3" 지정 실값 · k/tr/lucy는 96px 유지 = 이 한 줄만 갈라지고 나머지 전 규칙은 바이트 동일). 선례 문법 = CII 「단어칩 편집기」 의도 divergence 표기. */
  :root { --well:#0e0f11;   /* 인셋 웰(입력·코드박스 배경 — 7뷰어 공유 raw 추출 = 동값·픽셀 0 · 평의회 260713 ⑨) */ --bg:#121212;   /* 스포티파이 블랙(중립)·운영자 260623 */ --pan:#16171a; --line:#2a2c31; --fg:#eef7f0; --mut:#8fa697; --accent:#00EED2; --accent-rgb:0,238,210;
    --accent-4:#FFE13D; --accent-4-rgb:255,225,61;   /* raw-ok: index :root 정본 동값 exact 계승(골드레몬) — 공용 nm-cards.css(다운로드 SSOT)가 참조하는 토큰이라 전 뷰어 정의 필수(미정의 = var() 댕글링 = 다운로드 색 죽음) · 이후 값 동기 = build_design_mirror STAGE4 자동 전파(운영자 260731) */
    --danger:#e23b2a; --danger-rgb:226,59,42;   /* 역할색 danger = 브랜드 유일 레드(index 동일·감사 260704) */ --warn:#FFE13D;   /* 역할색 warn = 골드레몬(k:12 계승) */ --accent-dim:rgba(var(--accent-rgb),.13); --on-accent:#032322; --line2:rgba(255,255,255,.06); }   /* --press-* = tokens.css 상속(k:12 계승) · line2 = index :root 정본값 계승(평의회 Q165 — .geni-sechead 소머리 밑줄이 폴백 없는 var() 미정의로 무효였던 수리 · sb 전용 소비라 k 동시수정 비대상) */
  @media (prefers-reduced-motion:reduce){ :root{ --press-pico:1; --press-xs:1; --press-s:1; --press-m:1; --press-l:1; } }   /* 눌림 토큰 무효화 = 로컬(k:13 계승) */
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }   /* k:14 계승 */
  [hidden] { display:none !important; }   /* hidden 기저 가드(k:15 계승) */
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible, [role=button]:focus-visible, label.file:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }   /* 포커스 링(k:17 계승) */
  html { scrollbar-width:none; -ms-overflow-style:none; scrollbar-color:rgba(255,255,255,.05) transparent; }   /* 스크롤바 폭 0 = 문서 끝 cscroll.js(오버레이 바) 주입값과 **첫 페인트부터 동일** — index 115행 정본 계승(구 thin은 cscroll 실행 전까지 네이티브 바가 폭을 차지했다가 주입 순간 0으로 풀려, 스크롤이 생긴 화면에서 콘텐츠가 통째로 옆으로 밀렸다 · 운영자 260726 index 픽토 점프[Q579]와 같은 축 · 데스크톱 클래식 스크롤바 환경 전용 = 헤드리스는 오버레이라 재현 불가) · no-JS 폴백 = head 끝 noscript */
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; height:0; display:none; }   /* 위 scrollbar-width:none의 웹킷 짝(cscroll.js 주입 규칙 계승) — 아래 공통 10px은 모달·내부 스크롤 표면 전용으로 존치 */   /* 스크롤바 = 반투명 흰색(k:19 계승 · 260801) */
  ::-webkit-scrollbar { width:5px; height:5px; }   /* 두께 = 구 10 의 50%(운영자 260801) — 알약 실폭 = 5 - 테두리 1×2 = 3px(구 6px 의 50%) */
  * { scrollbar-width:thin; }   /* 표준 짝(크로미엄은 scrollbar-color·width 가 지정되면 ::-webkit-scrollbar-* 를 무시 = 실화면은 이 줄이 담당) — thin = 실존값(.draft-scroll·no-JS 폴백 동문) · html 은 자기 규칙(scrollbar-width:none)이 특이도로 승 = 페이지 바 숨김 불변 */
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.05); border-radius:var(--r-pill);
    border:1px solid var(--bg); background-clip:padding-box; }   /* 테두리(=바 여백)도 50%: 2→1 = 알약 실폭 3px 유지 */
  ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.08); background-clip:padding-box; }
  @font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url(assets/fonts/pretendard.woff2) format('woff2-variations')}   /* 본문 폰트 = index 정본 이식(운영자 260719 승인 = Q160 잔여 4탭 폰트 확장 · thumb/edit 동문 — iframe이라 부모 index Pretendard 미상속) */
  body { margin:0; background:radial-gradient(125% 70% at 50% -8%, rgba(var(--accent-rgb),.06), transparent 55%) fixed, var(--bg); color:var(--fg); font:15px/1.6 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing:-.2px /* raw-ok: 자간 = index body 정본 exact 계승 */; -webkit-font-smoothing:antialiased; }   /* 폰트 = index body 정본 문자단위 exact 계승(M1 판례 — 구 시스템 스택 폐지 · 콘텐츠 폰트[코드박스 모노]는 개별 명시라 무접촉) */
  button, input, textarea, select { font-family:inherit; letter-spacing:inherit; }   /* 폼 활자 상속 강제 = thumb:39 정본 계승(운영자 260727 "같은 형태에 있는 애들은 다 같아야함" · 점검 v2 ③ — UA 기본 스택으로 새던 입력칸·버튼 봉합) */
  .wrap { max-width:600px; margin:0 auto; padding:var(--sp-3) 16px 70px; }   /* raw-ok: k.html .wrap 동일값 계승(좌우 16·하단 70 = rfab 엄지존 여백 — 픽셀 패리티) */
  label { display:block; font-size:var(--fs-label); color:var(--fg); margin:14px 0 var(--sp-1); }   /* 비-소머리 라벨 베이스(k:29 계승) · raw-ok: k.html label 동일값 계승(상단 14 행 리듬) */
  label.fl { font-weight:var(--fw-x); color:var(--fg); }   /* 소머리 = 흰색·800(k:30 계승 — 뉴스 .cref-lbl 표준 형광통일) */
  label.fl::before { content:'• '; color:var(--accent); font-weight:var(--fw-b); }   /* 블릿 = 형광(k:31 계승) */
  label:first-of-type { margin-top:0; }
  textarea { width:100%; min-height:64px /* raw-ok: 종전 96의 2/3 = 운영자 Q1159 "콘텐츠 입력 높이 2/3으로" 지정 실값 */; padding:var(--sp-2); background:var(--well); border:1px solid var(--line); border-radius:var(--r-s); color:var(--fg); font:inherit; font-size:16px; resize:none; }   /* k:33 계승 · raw-ok: 16px = iOS 자동줌 방지 하한(font 축약 뒤 개별 선언이라 승리 · 감사3 §1) */
  textarea:focus, input:focus { border-color:rgba(var(--accent-rgb),.35); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08); outline:none; }
  textarea::placeholder, input::placeholder { color:var(--mut); }
  /* 입력칸 [복사][붙여넣기][지우개] 3버튼 = k.html .scnclip 블록 바이트 계승(운영자 260714 "텍스트 입력창엔 항상 토글 버튼 3개") */
  .scnwrap { position:relative; }
  .scnclip { position:absolute; top:0; right:14px; transform:translateY(-50%); display:grid; place-items:center; width:26px; height:26px; padding:0; z-index:5; opacity:.6;
    border-radius:50%; border:1px solid rgba(255,255,255,.17); background:rgba(26,28,26,.3); color:var(--mut); cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
    /* 오버레이 backdrop-filter 없음 = 입력칸 위에 떠서 타이핑·포커스마다 그 밑 텍스트를 재샘플하며 번쩍이던 것(260701 판례) 차단 — index .askclip 정본 동문 계승 · 배경 링(.3)+border+inset로 버튼 형태 유지(운영자 260725 "콘텐츠 입력 누르면 번쩍거리는데 없애주라") */ -webkit-tap-highlight-color:transparent; transition:transform var(--dur-fast), color var(--dur), border-color var(--dur); }   /* G1 글래스모피즘(260625) · raw-ok: k.html .scnclip 동일값 계승(blur13 — 픽셀 패리티) */
  .scnclip svg { display:block; width:13px; height:13px; }
  .scnclip::before { content:""; position:absolute; inset:-8px; }
  .scnclip:hover { color:var(--fg); border-color:rgba(255,255,255,.27); }
  .scnclip:active { transform:translateY(-50%) scale(var(--press-s,.85)); color:var(--accent); border-color:rgba(var(--accent-rgb),.6); }
  .scnclip.ok { color:var(--accent); border-color:rgba(255,255,255,.14); }
  .scnclip.scn-pp { right:46px; }                       /* 붙여넣기 = 지우개 좌측·항상 노출 · 운영자 260627 */
  .scn-copy { right:78px; }                             /* 복사 = 내용 있을 때만 좌측 별도 노출(운영자 260628 3버튼 분리) */
  .scn-hide { display:none; }                           /* 내용 비면 복사 숨김 */
  .scn-erase { right:14px; }                            /* 지우개 = 최우측 · 비움→~10초 되돌리기 */
  .scn-erase.scn-off { opacity:.3; pointer-events:none; }
  .scn-erase.scn-undo { color:var(--fg); border-color:rgba(255,255,255,.34); }
  /* 생성 버튼 = 글래스 고스트(.mkbtn 정합 — k.html .go 바이트 계승) */
  .go { width:100%; margin-top:2px; padding:var(--sp-1); background:rgba(255,255,255,.02); color:var(--accent); border:1px solid var(--line); border-radius:var(--r-m); font-weight:800; font-size:var(--fs-label); font-family:inherit; line-height:1; cursor:pointer; position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; transition:transform var(--dur-fast) ease, background var(--dur) ease, border-color var(--dur) ease; }   /* raw-ok: index .geni-go(asksend·pub-go 합성) 동일 문법 계승 — 모서리 r-m·글자 accent(운영자 260714 4차 Image Studio 기틀) · padding·font = geni-go 정본값(--sp-1 6·--fs-label 13)으로 정정(페이블/스튜디오감사: 구 9px6px·14px = 260713·260718 통일 미역류 stale = Image Studio 6px/13px과 어긋난 제3형태 → 계승 선언대로 실현) · margin 2 = geni-sum 리듬 */
  .go:active { transform:scale(.955); background:rgba(var(--accent-rgb),.08); border-color:rgba(var(--accent-rgb),.35); }
  .go:disabled { opacity:.5; cursor:default; transform:none; }
  .go.shake { animation:edshake .42s; }
  @media (prefers-reduced-motion:reduce) { .go.shake { animation:none; } }
  .go.err { background:rgba(var(--danger-rgb),.14); color:var(--danger); border-color:var(--danger); }
  @keyframes edshake { 0%,100%{transform:translateX(0)} 18%{transform:translateX(-4px)} 38%{transform:translateX(4px)} 58%{transform:translateX(-3px)} 78%{transform:translateX(2px)} }
  .go.firing { color:var(--on-accent); pointer-events:none; opacity:1;
    background:linear-gradient(var(--accent),var(--accent)) left/0% 100% no-repeat, linear-gradient(var(--accent-dim),var(--accent-dim));
    animation:goFill .72s var(--gauge-ease) forwards; }
  @keyframes goFill { from { background-size:0% 100%, 100% 100%; } to { background-size:100% 100%, 100% 100%; } }
  @media (prefers-reduced-motion:reduce) { .go.firing { animation-duration:.2s; } }
  /* ── Image Studio(#genidlg) 폼 문법 이식 — 운영자 260714 4차 "이미지 제작부분 그대로 가져와 항목만 교체 · 만드는 화면 전부 이 기틀 계승". 값 = viewer/index.html #genidlg 블록 동일값 복제(재설계 0) · 공용 수정은 index와 양쪽 동시 ── */
  .cref-lbl { font-size:var(--fs-label); font-weight:var(--fw-x); color:var(--fg); }   /* 소머리 라벨 = 뉴스 .cref-lbl 정본 계승 */
  .geni-sechead { display:flex; align-items:center; gap:8px; width:100%; padding:var(--sp-2) 0 var(--sp-1); background:none; border:none; border-bottom:1px solid var(--line2); text-align:left; -webkit-tap-highlight-color:transparent; }   /* raw-ok: index .geni-sechead 동일값 계승(gap8 — 소머리 밑줄 = 구분선 전담) */
  .geni-sechead .cref-lbl::before { content:'• '; color:var(--accent); font-weight:var(--fw-b); }   /* 소머리 블릿 = 뉴스 정본 동일 문법 */
  .geni-row { display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-2); padding:8px 0; }   /* raw-ok: index .geni-row 동일값 계승(padding 8 — 라벨 좌·값 우 baseline) */
  .pub-l { font-size:var(--fs-label); font-weight:var(--fw-b); color:var(--fg); white-space:nowrap; }   /* 항목 라벨 = index .pub-l 동일값 */
  .geni-opts { display:flex; flex-wrap:wrap; gap:3px 4px; justify-content:flex-end; min-width:0; }   /* raw-ok: index .geni-opts 동일값 계승(gap 3·4 — 우측 정렬 워드칩) */
  .geni-opt { background:none; border:none; padding:6px 7px; font-family:inherit; font-size:var(--fs-label); font-weight:var(--fw-b); color:var(--mut); cursor:pointer; white-space:nowrap; transition:color var(--dur); -webkit-tap-highlight-color:transparent; }   /* raw-ok: index .geni-opt 동일값 계승(padding 6·7) · font 축약형→명시 분해 = 'inherit' 혼입 축약이 무효화돼 15px 상속되던 것 교정(폰트 단일 크기 통일 — 운영자 260714 6차 실측) */
  .geni-opt:active { transform:scale(var(--press-m)); }
  /* 비율 직접 = 「직접」 칩 그 자리 인라인 전환(index #geniArWrap 정본 미러 · 260727 전 탭 통일) */
  #sbArWrap { display:none; }
  #sbArWrap.open { display:inline-flex; }
  .geni-ar { display:flex; align-items:center; gap:0 /* 0 = 숫자칩 자체 좌우 패딩(7)이 「1 : 1」 사이 여백을 만든다 */; justify-content:flex-end; flex:0 0 auto; min-width:0; }
  /* 숫자칩 = 켜진 워드칩(.geni-opt.on) 값 100% 계승 — 입력칸이되 생김새는 칩 */
  .geni-ar-in { box-sizing:content-box; width:1ch /* 실폭 = sbArFit이 값 길이(1~2ch)로 동기 */; background:none; border:none; outline:none; border-radius:0; -webkit-appearance:none; appearance:none;
    padding:6px 7px /* raw-ok: .geni-opt 워드칩 정본 동값 */; font-family:inherit; font-size:var(--fs-label); font-weight:var(--fw-x); color:var(--accent) /* = .geni-opt.on 정본 동값 */;
    line-height:normal; text-align:center; font-variant-numeric:tabular-nums; -webkit-tap-highlight-color:transparent; }
  .geni-ar-in:focus { border-color:transparent; box-shadow:none; }   /* 전역 input:focus 링(강조색 3px) 재승리 = 칩엔 링이 없다 */
  .geni-ar-in::selection { background:rgba(var(--accent-rgb),.26); color:var(--accent); }
  .geni-ar-c { color:var(--mut); font-weight:var(--fw-x); font-size:var(--fs-label); }
  .geni-opt.on { color:var(--accent); font-weight:var(--fw-x); }
  .geni-opt[data-num] { font-variant-numeric:tabular-nums; }

  .ogrid { display:flex; flex-direction:column; gap:8px /* raw-ok: 카드 스택 세로간격 8 = thumb .optcards·index .geni-cards 정본 동값 */; }   /* **1열 세로 스택**(운영자 260729 "이거 가로로 다른곳 처럼 배치해줄래?") — 구 2열 그리드는 260725에 「편집 탭 옵션 칸 배치 계승」으로 적었으나 실측하면 편집(thumb `.optcards`)·카드 생성·번역·AI 생성(`.geni-cards`) **전부 1열 full-width flex column**이라 콘티만 2열로 갈라져 있었다(반폭이라 칩 3~4개가 매번 2줄로 꺾임 = 스샷 '감독/비율/길이'). 그릇 문법까지 정본으로 회수 */

  .topdock { position:sticky; top:0; z-index:6; margin:-16px -16px 0 /* 상단 -16 = 모달 정합(k·song·edit 정본 동값) — 구 `0 -16px`은 이 탭만 도크 top이 16px 처져 미리보기 창 y가 36(기준 20)이었다(실측 260803 2차) */; padding:var(--sp-3) 16px var(--sp-4); background:rgba(18,18,18,1) /* raw-ok: 이미지 스튜디오 카드 제작 도크 정본 동값(thumb .topdock[data-lay="edit"] — 18,18,18 매트 · 알파 1 = 운영자 260802 4차 "미리보기 화면 항상 가려지게" 비침 차단 미러 · blur = 불투명 바탕 무효라 동반 제거) */; border-bottom:1px solid rgba(var(--accent-rgb),.35) /* 강조색1 반투명 구획(운영자 260802 6차) — 레퍼런스 = thumb .cpprev-box.dropping 알파 .35 그대로 */; --line:rgba(255,255,255,.15) /* raw-ok: thumb 편집 도크 정본 동값(운영자 260731 2차 선택값 알파 .15) · 도크 스코프 한정 */; }   /* raw-ok: 전 값 = edit .topdock 정본 그대로(#121212 전폭{-16 = .wrap padding-x 상쇄}·padding 16/16/--sp-2·z6) */

// 최소 마크다운 렌더 — k.html renderMd 바이트 계승(펜스 코드블록·헤딩·표/굵게 누출 폴백)
function renderMd(md) {
  const parts = md.split('```');
  const unbal = parts.length % 2 === 0;   // 펜스 홀수 = 마지막 세그먼트 텍스트 강등(k 계승)
  let html = '';
  parts.forEach((part, i) => {
    if (i % 2 === 1 && !(unbal && i === parts.length - 1)) {                    // 코드블록
      let code = part;
      const nl = code.indexOf('\n');
      const first = nl >= 0 ? code.slice(0, nl).trim() : '';
      if (nl >= 0 && (first === '' || (first.length <= 24 && /^[a-zA-Z][a-zA-Z0-9 .:+_-]*$/.test(first)))) code = code.slice(nl + 1);   // 인포스트링 줄 제거(k 계승)
      code = code.replace(/\s+$/, '');
      const enc = encodeURIComponent(code);
      html += `<div class="code"><button data-c="${enc}" aria-label="복사" title="복사">${COPY_SVG}</button><pre>${esc(code)}</pre></div>`;
    } else {
      part.split('\n').forEach(line => {
        const t = line.trim();
        if (!t) return;
        if (t.startsWith('### ')) html += `<h3>${esc(t.slice(4))}</h3>`;
        else if (t.startsWith('## ')) html += `<h2>${esc(t.slice(3))}</h2>`;
        else if (t.startsWith('# ')) html += `<h1 class="t">${esc(t.slice(2))}</h1>`;
        else if (t.startsWith('@ 순서')) html += `<p class="legend">${esc(t)}</p>`;   // 범례 계약(k 계승 — sb 산출엔 통상 미등장·무해)
        else {
          let txt = t;   // 금지 문법 누출 폴백(k 계승 — 표·굵게 강등)
          if (/^\|.*\|$/.test(txt)) txt = txt.replace(/^\||\|$/g, '').split('|').map(s => s.trim()).filter(Boolean).join(' · ');
          txt = txt.replace(/\*\*([^*]+)\*\*/g, '$1');
          html += `<p>${esc(txt)}</p>`;
        }
      });
    }
  });
  return html;
}

// 복사 표식 영속 — k.html CKEY 기틀 계승(키 = 블록 원문 해시·새 생성 시 리셋)
const CKEY = 'sb_copied';
const ckHash = s => { let x = 5381; for (let i = 0; i < s.length; i++) x = (x * 33 ^ s.charCodeAt(i)) >>> 0; return x.toString(36); };
const ckLoad = () => { try { return new Set(JSON.parse(localStorage.getItem(CKEY) || '[]')); } catch (e) { return new Set(); } };
const ckAdd = k => { try { const s = ckLoad(); s.add(k); localStorage.setItem(CKEY, JSON.stringify([...s])); } catch (e) {} };
function wireCopy() {
  const seen = ckLoad();
  document.querySelectorAll('.code button').forEach(b => {
    const txt = decodeURIComponent(b.dataset.c), key = ckHash(txt);
    if (seen.has(key)) b.classList.add('copied');
    b.onclick = () => {
      const ok = () => { b.innerHTML = CHECK_SVG; b.classList.add('done', 'copied'); ckAdd(key);
        setTimeout(() => { b.innerHTML = COPY_SVG; b.classList.remove('done'); }, 1500); };
      navigator.clipboard.writeText(txt).then(ok).catch(() => {   // 폴백도 실패 = 무표식(거짓 체크 금지 · k 계승)
        try { const t = document.createElement('textarea'); t.value = txt; t.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(t); t.focus(); t.select();
          const done = document.execCommand('copy'); t.remove(); if (done) ok(); } catch (e) {}
      });
    };
  });
}

async function renderOut(md, outEl, outPath) {   // 결과 렌더 공통(폴 성공·재열람 재사용) — 텍스트 콘티 + (촬영=seedance면) 레퍼런스 이미지. AI 표기 오버레이는 k 레인 전담(콘티는 영상 산출물 아님)
  let html = renderMd(md);
  // 레퍼런스: R2 URL(ref.json — urls 배열 = 다장·url 단수 = 하위호환) 우선 · 없으면 git 폴백(ref.jpg). k.html renderOut 문법 계승(공용 수정 양쪽 동시)
  // 없으면(=kling 레인·GEMINI 키 미등록·생성 실패) 아무것도 안 붙는다 = 종전 동작 그대로(무회귀)
  if (outPath) {
    const base = outPath.replace(/board\.md$/, '');
    // 모션그래픽 산출(촬영=motion): 같은 폴더의 motion.mp4 = 렌더 완료물. 없으면(=다른 레인·렌더 실패) 아무것도 안 붙는다 = 무회귀.
    // 실존 확인 = HEAD + content-type 가드(SPA 폴백이 HTML을 200으로 주는 함정 — 아래 ref.jpg 폴백과 동일 축).
    try {
      const mr = await fetch(base + 'motion.mp4?t=' + Date.now(), { method: 'HEAD' });
      if (mr.ok && !(mr.headers.get('content-type') || '').includes('text/html')) {
        html = '<div class="ref"><video src="' + (base + 'motion.mp4').replace(/"/g, '%22') + '" controls playsinline preload="metadata"></video>'
          + '<div class="cap">모션그래픽 렌더 — 사내 렌더러(외부 API 0)</div></div>' + html;
      }
    } catch (e) { /* 폴백 = 미부착 */ }
    let srcs = null;
    try { const jr = await fetch(base + 'ref.json?t=' + Date.now()); if (jr.ok) { const j = await jr.json(); if (j && Array.isArray(j.urls) && j.urls.length) srcs = j.urls; else if (j && j.url) srcs = [j.url]; } } catch (e) { /* 폴백 */ }
    if (!srcs) { try { const hr = await fetch(base + 'ref.jpg?t=' + Date.now(), { method: 'HEAD' }); if (hr.ok && !(hr.headers.get('content-type') || '').includes('text/html')) srcs = [base + 'ref.jpg']; } catch (e) {} }   // git 폴백 = 실존 확인 후에만(SPA 폴백이 HTML을 200으로 주는 함정 = poll 가드와 동일 축)
    if (srcs && srcs.length) {
      // 대표 1장 = 상단 도크 미리보기 스테이지(이미지 스튜디오 정본 문법 · 운영자 260730) — 아래 결과부 .ref는 전량(다장·실패 슬롯) 담당 = 도크는 대표·결과부는 전량 역할 분리(edit·thumb 구조와 동일 축)
      const first = srcs.find(Boolean);
      const pv = document.getElementById('pvImg'), pe = document.getElementById('pvEmpty');
      if (pv && first) { pv.src = first + (first.includes('?') ? '' : '?t=' + Date.now()); pv.hidden = false; if (pe) pe.classList.add('has'); }
      if (pv) pv.addEventListener('error', () => { pv.hidden = true; if (pe) pe.classList.remove('has'); }, { once: true });   // 로드 실패 = 대기 문구 복귀(빈 액자 방지)
      const cells = srcs.map((u, ix) => {
        if (!u) return '<div class="refmiss">레퍼런스 ' + (ix + 1) + '번 생성/업로드 실패 — 참조 순서는 유지(이 장만 빼고 주입)</div>';   // null 슬롯 = 번호 보존(압축 금지 · k 검증1 계승)
        const bust = u.includes('?') ? '' : '?t=' + Date.now();
        return '<img src="' + (u + bust).replace(/"/g, '%22') + '" data-ix="' + (ix + 1) + '">';   // 속성 인젝션 싱크 봉합(k 계승)
      }).join('');
      const okN = srcs.filter(Boolean).length;   // 결손 시 "전장" 단언 금지 — 정직 캡션(k 검증7 계승)
      html = '<div class="ref' + (srcs.length > 1 ? ' multi' : '') + '">' + cells
        + '<div class="cap">레퍼런스 이미지'   /* 아이콘 없음 = 의도 — k.html PHOTO_SVG는 그 파일 인라인 지역 상수라 여기 복제하면 아이콘 드리프트(공유 승격 = nm-svg.js SSOT 편입이 정문 · 후속) */
        + (srcs.length > 1 ? (okN === srcs.length ? ' ×' + srcs.length + ' — 시댄스 주입 순서 = 콘티 참조 순' : ' ' + okN + '/' + srcs.length + '장 — 실패 슬롯 자리 표시(번호 기준·수동 보충)') : '')
        + '</div></div>' + html;
    }
  }
  outEl.innerHTML = html;
  wireCopy();
  // 이미지 로드 실패 = 그 장 자리에 경고 칩(공유 캡션 오염 금지 · k 검증4 계승 · innerHTML 직후 동일 틱 부착 = 레이스 없음)
