<style>
  /* ⚠️ 기틀 계승 원본 = viewer/sb.html(콘티) 1~216행 **바이트 계승**(그 위 원본 = viewer/k.html) — 공용 수정은 sb.html과 양쪽 동시.
     원 주석 = 기틀 계승 원본 = viewer/k.html(영상 프롬프트) — 공유 블록은 바이트 동일 유지(운영자 260714 "그대로 기틀 참고·맘대로 생성 금지"). 여기만 고치면 드리프트 — 공용 수정은 k.html과 양쪽 동시.
     ※ **의도 divergence(공유 블록 예외 · 260730)**: `textarea{min-height}` = sb 단독 64px(운영자 Q1159 "높이 2/3" 지정 실값 · k/tr/lucy는 96px 유지 = 이 한 줄만 갈라지고 나머지 전 규칙은 바이트 동일). 선례 문법 = CII 「단어칩 편집기」 의도 divergence 표기. */
  :root { --well:#0e0f11;   /* 인셋 웰(입력·코드박스 배경 — 7뷰어 공유 raw 추출 = 동값·픽셀 0 · 평의회 260713 ⑨) */ --bg:#121212;   /* 스포티파이 블랙(중립)·운영자 260623 */ --pan:#16171a; --line:#2a2c31; --fg:#eef7f0; --mut:#8fa697; --accent:#00EED2; --accent-rgb:0,238,210;
    --accent-4:#FFE13D; --accent-4-rgb:255,225,61;   /* raw-ok: index :root 정본 동값 exact 계승(골드레몬) — 공용 nm-cards.css(다운로드 SSOT)가 참조하는 토큰이라 전 뷰어 정의 필수(미정의 = var() 댕글링 = 다운로드 색 죽음) · 이후 값 동기 = build_design_mirror STAGE4 자동 전파(운영자 260731) */
    --danger:#e23b2a; --danger-rgb:226,59,42;   /* 역할색 danger = 브랜드 유일 레드(index 동일·감사 260704) */ --warn:#FFE13D;   /* 역할색 warn = 골드레몬(k:12 계승) */ --accent-dim:rgba(var(--accent-rgb),.13); --on-accent:#032322; --line2:rgba(255,255,255,.06);
    --modal-glass-anchor:rgba(17,18,20,.42); --modal-head-bg:rgba(24,25,28,.85); --modal-tabs-bg:rgba(24,25,28,.5); }   /* raw-ok: 앵커팝 셸 2종 + 탭 띠 = index :root 정본값 계승(tabs-bg 합류 = 메뉴바 유리 · STAGE4 공유 팔레트 등재키라 값 동기 자동) — ly.html:16 선례와 동일 함정(폴백 없는 var()를 로컬 미정의로 참조하면 배경·헤더 띠 선언이 통째 IACVT 무효 = 유리가 죽는다. 실측 260802: 드롭다운 배경 rgba(0,0,0,0)). 이후 값 동기 = build_design_mirror STAGE4 */   /* --press-* = tokens.css 상속(k:12 계승) · line2 = index :root 정본값 계승(평의회 Q165 — .geni-sechead 소머리 밑줄이 폴백 없는 var() 미정의로 무효였던 수리 · sb 전용 소비라 k 동시수정 비대상) */
  @media (prefers-reduced-motion:reduce){ :root{ --press-pico:1; --press-xs:1; --press-s:1; --press-m:1; --press-l:1; } }   /* 눌림 토큰 무효화 = 로컬(k:13 계승) */
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }   /* k:14 계승 */
  [hidden] { display:none !important; }   /* hidden 기저 가드(k:15 계승) */
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible, [role=button]:focus-visible, label.file:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }   /* 포커스 링(k:17 계승) */
  html .cscroll { display:none !important; }   /* 스크롤바 표시 제거(운영자 260716 "이미지·영상 스튜디오 둘다 스크롤 없애" · thumb:31 정본 계승 — 260803 "모든 이미지·영상 스튜디오에서 없애" 재지시로 영상 셸 동반) — 오버레이 썸만 숨김·스크롤 동작/네이티브 숨김은 종전 · !important = 주입 <style>이 소스순 뒤라 재승리 필수(.a2hide 선례) · 공유 cscroll.js 무접촉(타 뷰어 표준 보존) · 복원 = 이 행 삭제 */
  html { scrollbar-width:none; -ms-overflow-style:none; scrollbar-color:rgba(255,255,255,.05) transparent; }   /* 스크롤바 폭 0 = 문서 끝 cscroll.js(오버레이 바) 주입값과 **첫 페인트부터 동일** — index 115행 정본 계승(구 thin은 cscroll 실행 전까지 네이티브 바가 폭을 차지했다가 주입 순간 0으로 풀려, 스크롤이 생긴 화면에서 콘텐츠가 통째로 옆으로 밀렸다 · 운영자 260726 index 픽토 점프[Q579]와 같은 축 · 데스크톱 클래식 스크롤바 환경 전용 = 헤드리스는 오버레이라 재현 불가) · no-JS 폴백 = head 끝 noscript */
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; height:0; display:none; }   /* 위 scrollbar-width:none의 웹킷 짝(cscroll.js 주입 규칙 계승) — 아래 공통 10px은 모달·내부 스크롤 표면 전용으로 존치 */   /* 스크롤바 = 반투명 흰색(k:19 계승 · 260801) */
  ::-webkit-scrollbar { width:5px; height:5px; }   /* 두께 = 구 10 의 50%(운영자 260801) — 알약 실폭 = 5 - 테두리 1×2 = 3px(구 6px 의 50%) */
  * { scrollbar-width:none; }   /* 전면 소거(운영자 260803 5차 "이미지 스튜디오에 스크롤 없애줘 그냥" — 문서 바에 이어 **내부 표면(모달 목록·입력칸)까지** · 스크롤 동작은 유지·표시만 소거 = 260716 원지시 「이미지·영상 스튜디오 둘다」라 7표면 동반) — 크로미엄은 표준 프로퍼티가 지정되면 ::-webkit-scrollbar-* 를 무시 = 실화면은 이 줄이 담당 · no-JS 폴백(noscript)·타 뷰어 불변 */
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.05); border-radius:var(--r-pill);
    border:1px solid var(--bg); background-clip:padding-box; }   /* 테두리(=바 여백)도 50%: 2→1 = 알약 실폭 3px 유지 */
  ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.08); background-clip:padding-box; }
  @font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url(assets/fonts/pretendard.woff2) format('woff2-variations')}   /* 본문 폰트 = index 정본 이식(운영자 260719 승인 = Q160 잔여 4탭 폰트 확장 · thumb/edit 동문 — iframe이라 부모 index Pretendard 미상속) */
  body { margin:0; background:radial-gradient(125% 70% at 50% -8%, rgba(var(--accent-rgb),.06), transparent 55%) fixed, var(--bg); color:var(--fg); font:15px/1.6 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing:-.2px /* raw-ok: 자간 = index body 정본 exact 계승 */; -webkit-font-smoothing:antialiased; }   /* 폰트 = index body 정본 문자단위 exact 계승(M1 판례 — 구 시스템 스택 폐지 · 콘텐츠 폰트[코드박스 모노]는 개별 명시라 무접촉) */
  button, input, textarea, select { font-family:inherit; letter-spacing:inherit; }   /* 폼 활자 상속 강제 = thumb:39 정본 계승(운영자 260727 "같은 형태에 있는 애들은 다 같아야함" · 점검 v2 ③ — UA 기본 스택으로 새던 입력칸·버튼 봉합) */
  .wrap { max-width:600px; margin:0 auto; padding:var(--sp-3) 16px 70px; }   /* raw-ok: k.html .wrap 동일값 계승(좌우 16·하단 70 = rfab 엄지존 여백 — 픽셀 패리티) */
  label { display:block; font-size:var(--fs-label); color:var(--fg); margin:14px 0 var(--sp-1); }   /* 비-소머리 라벨 베이스(k:29 계승) · raw-ok: k.html label 동일값 계승(상단 14 행 리듬) */
  label.fl { font-weight:var(--fw-x); color:var(--fg); }   /* 소머리 = 흰색·800(k:30 계승 — 뉴스 .cref-lbl 표준 형광통일) */
  label.fl::before { content:'• '; color:var(--accent); font-weight:var(--fw-b); }   /* 블릿 = 형광(k:31 계승) */
  label:first-of-type { margin-top:0; }
  textarea { width:100%; min-height:64px /* raw-ok: 종전 96의 2/3 = 운영자 Q1159 "콘텐츠 입력 높이 2/3으로" 지정 실값 */; padding:var(--sp-2); background:var(--well); border:1px solid var(--line); border-radius:var(--r-s); color:var(--fg); font:inherit; font-size:16px; resize:none; }   /* k:33 계승 · raw-ok: 16px = iOS 자동줌 방지 하한(font 축약 뒤 개별 선언이라 승리 · 감사3 §1) */
  textarea:focus, input:focus { border-color:rgba(var(--accent-rgb),.35); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08); outline:none; }
  textarea::placeholder, input::placeholder { color:var(--mut); }
  /* 입력칸 [복사][붙여넣기][지우개] 3버튼 = k.html .scnclip 블록 바이트 계승(운영자 260714 "텍스트 입력창엔 항상 토글 버튼 3개") */
  .scnwrap { position:relative; }
  .scnclip { position:absolute; top:0; right:14px; transform:translateY(-50%); display:grid; place-items:center; width:26px; height:26px; padding:0; z-index:5; opacity:.6;
    border-radius:50%; border:1px solid rgba(255,255,255,.17); background:rgba(26,28,26,.3); color:var(--mut); cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
    /* 오버레이 backdrop-filter 없음 = 입력칸 위에 떠서 타이핑·포커스마다 그 밑 텍스트를 재샘플하며 번쩍이던 것(260701 판례) 차단 — index .askclip 정본 동문 계승 · 배경 링(.3)+border+inset로 버튼 형태 유지(운영자 260725 "콘텐츠 입력 누르면 번쩍거리는데 없애주라") */ -webkit-tap-highlight-color:transparent; transition:transform var(--dur-fast), color var(--dur), border-color var(--dur); }   /* G1 글래스모피즘(260625) · raw-ok: k.html .scnclip 동일값 계승(blur13 — 픽셀 패리티) */
  .scnclip svg { display:block; width:13px; height:13px; }
  .scnclip::before { content:""; position:absolute; inset:-8px; }
  .scnclip:hover { color:var(--fg); border-color:rgba(255,255,255,.27); }
  .scnclip:active { transform:translateY(-50%) scale(var(--press-s,.85)); color:var(--accent); border-color:rgba(var(--accent-rgb),.6); }
  .scnclip.ok { color:var(--accent); border-color:rgba(255,255,255,.14); }
  .scnclip.scn-pp { right:46px; }                       /* 붙여넣기 = 지우개 좌측·항상 노출 · 운영자 260627 */
  .scn-copy { right:78px; }                             /* 복사 = 내용 있을 때만 좌측 별도 노출(운영자 260628 3버튼 분리) */
  .scn-hide { display:none; }                           /* 내용 비면 복사 숨김 */
  .scn-erase { right:14px; }                            /* 지우개 = 최우측 · 비움→~10초 되돌리기 */
  .scn-erase.scn-off { opacity:.3; pointer-events:none; }
  .scn-erase.scn-undo { color:var(--fg); border-color:rgba(255,255,255,.34); }
  /* 생성 버튼 = 글래스 고스트(.mkbtn 정합 — k.html .go 바이트 계승) */
  .go { width:100%; margin-top:2px; padding:var(--sp-1); background:rgba(255,255,255,.02); color:var(--accent); border:1px solid var(--line); border-radius:var(--r-m); font-weight:800; font-size:var(--fs-label); font-family:inherit; line-height:1; cursor:pointer; position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; transition:transform var(--dur-fast) ease, background var(--dur) ease, border-color var(--dur) ease; }   /* raw-ok: index .geni-go(asksend·pub-go 합성) 동일 문법 계승 — 모서리 r-m·글자 accent(운영자 260714 4차 Image Studio 기틀) · padding·font = geni-go 정본값(--sp-1 6·--fs-label 13)으로 정정(페이블/스튜디오감사: 구 9px6px·14px = 260713·260718 통일 미역류 stale = Image Studio 6px/13px과 어긋난 제3형태 → 계승 선언대로 실현) · margin 2 = geni-sum 리듬 */
  .go:active { transform:scale(.955); background:rgba(var(--accent-rgb),.08); border-color:rgba(var(--accent-rgb),.35); }
  .go:disabled { opacity:.5; cursor:default; transform:none; }
  .go.shake { animation:edshake .42s; }
  @media (prefers-reduced-motion:reduce) { .go.shake { animation:none; } }
  .go.err { background:rgba(var(--danger-rgb),.14); color:var(--danger); border-color:var(--danger); }
  @keyframes edshake { 0%,100%{transform:translateX(0)} 18%{transform:translateX(-4px)} 38%{transform:translateX(4px)} 58%{transform:translateX(-3px)} 78%{transform:translateX(2px)} }
  .go.firing { color:var(--on-accent); pointer-events:none; opacity:1;
    background:linear-gradient(var(--accent),var(--accent)) left/0% 100% no-repeat, linear-gradient(var(--accent-dim),var(--accent-dim));
    animation:goFill .72s var(--gauge-ease) forwards; }
  @keyframes goFill { from { background-size:0% 100%, 100% 100%; } to { background-size:100% 100%, 100% 100%; } }
  @media (prefers-reduced-motion:reduce) { .go.firing { animation-duration:.2s; } }
  /* ── Image Studio(#genidlg) 폼 문법 이식 — 운영자 260714 4차 "이미지 제작부분 그대로 가져와 항목만 교체 · 만드는 화면 전부 이 기틀 계승". 값 = viewer/index.html #genidlg 블록 동일값 복제(재설계 0) · 공용 수정은 index와 양쪽 동시 ── */
  .cref-lbl { font-size:var(--fs-label); font-weight:var(--fw-x); color:var(--fg); }   /* 소머리 라벨 = 뉴스 .cref-lbl 정본 계승 */
  .geni-sechead { display:flex; align-items:center; gap:8px; width:100%; padding:var(--sp-2) 0 var(--sp-1); background:none; border:none; border-bottom:1px solid var(--line2); text-align:left; -webkit-tap-highlight-color:transparent; }   /* raw-ok: index .geni-sechead 동일값 계승(gap8 — 소머리 밑줄 = 구분선 전담) */
  .geni-sechead .cref-lbl::before { content:'• '; color:var(--accent); font-weight:var(--fw-b); }   /* 소머리 블릿 = 뉴스 정본 동일 문법 */
  .geni-row { display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-2); padding:8px 0; }   /* raw-ok: index .geni-row 동일값 계승(padding 8 — 라벨 좌·값 우 baseline) */
  .pub-l { font-size:var(--fs-label); font-weight:var(--fw-b); color:var(--fg); white-space:nowrap; }   /* 항목 라벨 = index .pub-l 동일값 */
  .geni-opts { display:flex; flex-wrap:wrap; gap:3px 4px; justify-content:flex-end; min-width:0; }   /* raw-ok: index .geni-opts 동일값 계승(gap 3·4 — 우측 정렬 워드칩) */
  .geni-opt { background:none; border:none; padding:6px 7px; font-family:inherit; font-size:var(--fs-label); font-weight:var(--fw-b); color:var(--mut); cursor:pointer; white-space:nowrap; transition:color var(--dur); -webkit-tap-highlight-color:transparent; }   /* raw-ok: index .geni-opt 동일값 계승(padding 6·7) · font 축약형→명시 분해 = 'inherit' 혼입 축약이 무효화돼 15px 상속되던 것 교정(폰트 단일 크기 통일 — 운영자 260714 6차 실측) */
  .geni-opt:active { transform:scale(var(--press-m)); }
  /* 비율 직접 = 「직접」 칩 그 자리 인라인 전환(index #geniArWrap 정본 미러 · 260727 전 탭 통일) */

  /* ── 상단 메뉴바 + 드롭다운 = 프리미어 메뉴 문법 ──
     메뉴 항목 = .tooltab 세그 타이포 계승(13/600 · on = accent + 글로우) ·
     드롭다운 = **앵커 팝업 정본**(ly .lypop = index .qpop 원문 계승) 바이트 계승:
     --modal-glass-anchor + blur(--blur-l) saturate(1.05) · --line2 테두리 · 그림자 0 18px 40px rgba(0,0,0,.45) ·
     radius --r-l · padding 11/11/11/16 · 등장 .26s var(--gauge-ease)(msgUnfold 가족 커브). */
  /* ⚠ z-index 7 = 스크림(6)보다 위여야 한다(실측 260802 수리): position:relative+z-index 가 .vnav 에 쌓임 맥락을
     만들기 때문에 자식 .vpop 의 z-index:7 은 **맥락 안에서만** 유효 — 바깥에서 겨루는 건 .vnav 자신의 값이다.
     구 5 에선 스크림(6)이 nav 통째를 덮어 드롭다운 안 클릭이 전부 스크림에 먹혔다(축 칩·기사 행·종료행 = 메뉴 여닫기 말곤 전멸 · elementFromPoint 전건 'vscrim' 실측).
     바깥 탭 닫힘은 그대로 — 스크림이 나머지 화면을 덮는 건 변함없다. */
  .vnav { flex:none; position:relative; z-index:7; display:flex; gap:0 /* 세그 붙임 = index `.tooltab + .tooltab{border-left:none}` 정본 문법(구 gap:2 칩 띄움은 붙임 세그와 양립 불가 = 구획선이 두 줄로 갈린다) */; padding:0 var(--sp-2) var(--sp-1) /* 세로 = 종전 무접촉(운영자 260803 4차 "높낮이 60%" 실측값 보존) · 가로 --sp-2 = 탭 띠 정본 13px 근접 토큰 계승 = 띠 안에 앉은 한 덩이 바(첨부2 느낌) · n등분은 그 안에서 그대로 */;
    background:var(--modal-tabs-bg); backdrop-filter:blur(var(--blur-l)) saturate(1.05); -webkit-backdrop-filter:blur(var(--blur-l)) saturate(1.05);   /* 글래스(운영자 260804 "글래스모피즘 적용") = .vpop 앵커팝 정본 동값 blur-l·saturate1.05 + 표면색은 **탭 띠 전용 토큰**(--modal-tabs-bg = :root 주석 "tabs-bg=탭 띠") — 신규 blur·색 창작 0 */
    border-bottom:1px solid var(--line2); }
  /* ⚠ overflow-x:auto 금지(실측 260802): 한 축이라도 visible이 아니면 나머지 축도 auto로 계산돼
     이 컨테이너가 스크롤 박스가 되고, 아래로 펼쳐지는 .vpop(absolute)이 통째로 잘려 안 보였다.
     좁은 폭 대응 = **칸 안 keep-all 단어 줄바꿈**(n등분 칸은 고정 · 260803 4차 「그래픽」 개명 후 전 라벨 1줄 = 메뉴 행 슬림
     · keep-all은 방어로 유지 — 구 flex-wrap 줄바꿈은 n등분과 양립 불가라 소거 · 운영자 260803 3차). */
  .vnav > button { flex:1 1 0; min-width:0 /* n등분 = 운영자 260803 3차 "가로 면적을 다 쓰고 n분할해서 메뉴를 나타내줘" — 6칸 균등(1fr 등가) · min-width:0 = 긴 라벨이 칸을 못 벌린다 */; appearance:none; background:transparent; border:0; font:inherit; font-size:var(--fs-label); font-weight:600;
    color:var(--mut); cursor:pointer; padding:3px 10px /* raw-ok: 세로 3 = 운영자 260803 4차 "높낮이 지금의 60%" 실측 역산(구 2줄 행 55.6 → 개명 1줄+패딩 7→3 = 행 33.8px = 60.8% · 잔여 축 = 글줄 20.8+행 하단 sp-1·헤어라인이라 더 못 줄임) · 가로 10 = 프리미어 원문 실측분 그대로(260802) */; border-radius:0;
    word-break:keep-all; -webkit-tap-highlight-color:transparent;
    transition:color var(--dur), background var(--dur); }
  /* ⚠ 구 `border:0 + border-radius:--r-s + border-left`(칸 사이만 좌테두리) = 그 좌테두리가 **칸의 둥근 모서리를 따라 휘어** 화면엔 `(` 괄호로 렌더됐다(운영자 260804 "저렇게 ( 로 하지말고 그냥 구획 나눠진 느낌으로").
     교정 = 구획 박스 세그 = index `.tooltab` 세그 정본 100% 계승: 칸마다 온전한 1px 박스 + `+ button{border-left:none}`으로 이웃과 한 줄 공유 + 양끝만 --r-s. 라운드가 **떠 있는 선분**이 아니라 박스 모서리에 걸리므로 괄호가 생길 수 없다. */
  .vnav > button { border:1px solid var(--line2); border-right-color:var(--mut); }   /* 박스 = 탭 띠 정본 --line2 · 칸 사이 세로선만 mut(운영자 260803 4차 "메뉴별로 구분선 mut으로" 선택값 보존 — 색은 유지, 모양만 괄호→구획) */
  .vnav > button + button { border-left:none; }                                       /* 세그 붙임 = index `.tooltab + .tooltab` 정본 동문(이웃끼리 선 1줄 공유 = 2px 겹선 0) */
  .vnav > button:first-of-type { border-radius:var(--r-s) 0 0 var(--r-s); }           /* index `.tooltab:first-child` 정본 동값 (of-type = 이 nav엔 버튼 뒤에 .vpop 형제가 붙어 :last-child가 팝업을 물기 때문) */
  .vnav > button:last-of-type { border-radius:0 var(--r-s) var(--r-s) 0; border-right-color:var(--line2); }   /* 바깥 우변 = 박스색 복귀(mut 구분선은 칸 사이 전용) */
  .vnav > button[aria-expanded="true"] { color:var(--accent); font-weight:800; background:rgba(var(--accent-rgb),.10);
    text-shadow:0 0 11px rgba(var(--accent-rgb),.55); }

    <div class="monwrap"><div class="mon" id="mon"><div class="cpv-empty"><div class="cpv-stage"><button type="button" class="cpv-photobtn" id="pvPick" disabled aria-label="이미지 첨부 — 이 탭은 아직 첨부 소스가 없다" title="이미지 첨부 — 이 탭은 아직 첨부 소스가 없다"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9.5" r="1.5"></circle><path d="M21 16l-5-5L5 20"></path></svg></button></div></div><!-- 발사 = 모니터 창 **안** 85% 오버레이(운영자 260806) — 구 거처 = 모니터 아래 · DOM·id·핸들러 원문 그대로(카드 제작 정본 사본) --></div><div class="trailwrap" id="cpRailWrap"><!-- 레일 = 미리보기 창 **밖 우측** · 캡슐 = [돋보기][옵션](thumb #cpRailWrap 정본 사본 · 운영자 260803) --><nav class="trail" id="cpZoomRail" aria-label="미리보기 확대"><button type="button" class="trail-i" id="cpZoom" aria-pressed="false" aria-label="미리보기 확대" title="탭=미리보기 확대 · 다시 탭=원상복귀"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M8 11h6"/><path class="cpz-v" d="M11 8v6"/></svg></button></nav><nav class="trail trail-opts" id="cpRail" aria-label="미리보기 옵션"><span class="trail-g"><!-- 픽토 묶음 = [이미지 교체][휴지통](운영자 260803 "네비게이션에 이미지 교체와 휴지통 픽토그램 (기본)") = thumb #cpImgSwap/#cpImgDel 정본 SVG 그대로 · 이 탭은 붙일 소스 축이 아직 없어 **비활성**(자리 유지 = thumb 휴지통 무사진 정본 문법) --><button type="button" class="cpv-tool" id="pvSwap" disabled aria-label="이미지 교체" title="이미지 교체"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button><button type="button" class="cpv-tool" id="pvDel" disabled aria-label="이미지 삭제" title="이미지 삭제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button></span><span class="trail-div"></span><div class="gospec trail-v" id="spec" aria-live="polite"></div></nav></div><!-- 발사 = 모니터 창 위 85% 오버레이(운영자 260806) — 거처 = 창(.mon) **밖** 래퍼(.monwrap) = 레일과 같은 앵커: `renderMon()`의 `mon.innerHTML=`이 창 안을 통째로 지우므로 창 안에 두면 노드가 소멸한다(239행 주석의 260802 실측 사고 재판 · 실측 재현 = #go null) · 좌우식도 레일 정본(--pvw 반폭) 동문 --><button class="go pvfire" id="go" type="button">영상 만들기</button></div>
    <!-- (구 모니터 아래 선택 요약 = 코너 레일로 이주 · 운영자 260802 — id·핸들러(syncSpec) 불변) -->
  </div>
  <div class="vscrim" id="vscrim"></div>

  <!-- 본문 = 현재 시퀀스 소스(고른 기사) — 빈 영역 없이 캔버스를 채운다 -->
  <div class="src">
    <div class="phead">현재 시퀀스 소스<span class="sp" id="srcHint"></span></div>
    <div id="srcList"></div>
  </div>

  </div>

</div>

<script src="nm-svg.js"></script><!-- 공유 아이콘 SSOT -->
<script src="nm-rail.js" data-scope="cap" data-dlname="video.mp4" data-anchor="#srcList"></script><!-- 결과·이전 제작 레일 부품 SSOT -->

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>';   /* ✓ = SVG(§🎨 3-1 문자 렌더 금지) */
const DL_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>';
const SPIN_SVG = '<svg class="jspin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>';
const DONE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>';
const MAX = 12;   // 한 잡 상한 = api/vd.js MAX_FILES와 동값

/* ── 효과 컨트롤 축 = 전부 hyperframes render CLI 플래그로 실제 전달되는 것만.
      값 집합은 CLI 소스 실측(quality = draft|standard|high · resolution = portrait|portrait-4k · format = mp4|mov|webm|gif). ── */
/* ⚠ 축 부연(구 `opt` 문자열 = 「투명 MOV는 ProRes(용량 큼)」·「4K = MP4 전용 · 렌더 시간 3~4배」·「draft = 확인용 빠른 렌더」·「대본·자막·샷 프롬프트 .md 동봉」)은 전량 소거 —
   운영자 260804 "설명같은거는 세부메뉴에서 빼고 오로지 기능만". 4K 결합 제약은 설명 대신 **동작**이 진다(칩 disabled + title "MP4에서만" · paintAxes의 blocked 분기 무접촉). */
const AXES = [
  { k:'format', nm:'내보내기 형식', d:'mp4',
    vals:[['mp4','MP4'],['gif','GIF'],['mov','투명 MOV'],['webm','WebM']] },
  { k:'res', nm:'해상도', d:'portrait',
    vals:[['portrait','1080×1920'],['portrait-4k','4K 세로']], only:{ format:'mp4', v:'portrait-4k' } },
  { k:'fps', nm:'프레임', d:'30',
    vals:[['24','24'],['30','30'],['60','60']] },
  { k:'quality', nm:'화질', d:'standard',
    vals:[['draft','초안'],['standard','표준'],['high','고화질']] },
  { k:'pack', nm:'숏폼 팩', d:'off',
    vals:[['off','안 함'],['on','동봉']] },   /* 5축 = 영상과 별개 산출(운영자 260802 "뷰어에 안 만들면 의미 없음 · 기존 큐잉에 붙여라") — 러너가 apps/shorts/make_shorts_pack.py 를 같은 큐 파일로 돌려 mp4 옆에 .md 를 얹는다 = 렌더 플래그가 아니라 동봉 스위치(구 fxNote 주석의 4축 구분 명시는 260804 산문 소거로 폐지 — 칩 라벨 「안 함/동봉」이 그 축을 진다) */
];
let opts = Object.fromEntries(AXES.map(a => [a.k, a.d]));
let picked = [];
let ART = {};   // file → {title, media}

/* ── 상단 메뉴바 = 프리미어/포토샵 문법: 탭(또는 PC 호버)하면 그 아래로 펼침 · 하나만 열림 ──
   드롭다운 셸 = 앵커 팝업 정본(ly .lypop = index .qpop) 계승 · 바깥 탭·ESC 닫힘. */
let openM = null;
function closeMenu() {
  openM = null;
  document.querySelectorAll('#vnav > button').forEach(b => b.setAttribute('aria-expanded', 'false'));
  document.querySelectorAll('.vpop').forEach(p => { p.hidden = true; });
  $('#vscrim').classList.remove('on');
}
function openMenu(m) {
  if (openM === m) return closeMenu();
  openM = m;
  document.querySelectorAll('#vnav > button').forEach(b => b.setAttribute('aria-expanded', String(b.dataset.m === m)));
  document.querySelectorAll('.vpop').forEach(p => { p.hidden = (p.id !== 'pop-' + m); });
  $('#vscrim').classList.add('on');
}
$('#vnav').addEventListener('click', e => {
  const b = e.target.closest('#vnav > button'); if (!b) return;
  openMenu(b.dataset.m);
});
// PC 호버 = 프리미어 동작(메뉴 하나가 열려 있으면 옆 메뉴에 얹기만 해도 넘어간다 · 터치는 탭 전담)
if (window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
  $('#vnav').addEventListener('pointerover', e => {
    const b = e.target.closest('#vnav > button');
    if (b && openM && openM !== b.dataset.m) openMenu(b.dataset.m);
  });
}
$('#vscrim').addEventListener('click', closeMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openM) { e.stopPropagation(); closeMenu(); } }, true);

/* ── 편집 메뉴 동작(지금 실제로 되는 것만) ── */
function applyPick(n) {
  const rows = [...document.querySelectorAll('.vdrow')];
  picked = [];
  rows.forEach((el, i) => {
    const on = i < n;
    el.classList.toggle('on', on); el.setAttribute('aria-pressed', String(on));
    if (on) picked.push(el.dataset.file);
  });
  syncSpec(); paintMonitor();
}
document.querySelectorAll('.vpop .mrow[data-act]').forEach(r => r.addEventListener('click', () => {
  const a = r.dataset.act;
  if (a === 'clear') { applyPick(0); closeMenu(); }
  else if (a && a.startsWith('pick')) { applyPick(Number(a.replace('pick', ''))); closeMenu(); }
  else if (a === 'quit') { closeMenu(); try { parent.document.getElementById('tooldlg').close(); } catch (_) {} }
  else if (a === 'render') { closeMenu(); fire(); }
  else if (a === 'purge') { jsave([]); renderJobs(); closeMenu(); }
}));

/* ── 프로그램 모니터 = 완성본 있으면 재생, 없으면 선택 기사 카드 목업 ── */
function paintMonitor() {
  const mon = $('#mon');
  const done = jload().find(j => j.status === 'done' && j.files && j.files[0]);
  if (done) {
    mon.innerHTML = '<video src="' + esc(done.files[0]) + '" playsinline loop preload="metadata"></video>'   /* 네이티브 컨트롤 제거 = 점 세 개(⋮) 확실 소멸(운영자 260803 — controlsList·셰도우 셀렉터로는 버튼 껍데기가 남는 것 실측 · 재생 = 탭 토글 쇼츠 관례 · 무컨트롤 재생 문법 = track.html 선례 계승) */
      + '<button type="button" class="monplay" aria-label="재생 — 탭=재생/일시정지"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>'   /* ⚠배치 중앙 ▶ = 일시정지 상태 표시(신규 등장 · 픽토 = 표준 재생 삼각 SVG · 강조색 무플레이트 = .cpv-photobtn 문법 · 재생 중 숨김) */
      + '<a class="imgdl dlbtn" href="' + esc(done.files[0]) + '" download aria-label="영상 내려받기" title="영상 내려받기">' + DL_SVG + '</a>'   /* 우상단 다운로드 = 이미지 스튜디오 미리보기 정본(.imgdl 34px[nm-hist] + .dlbtn 색·✓팝[nm-cards]) 그대로 · 선례 = edit lyburn 오버레이(운영자 260731 "이미지 스튜디오처럼") */
      + '<span class="tc">완성본 · ' + esc(done.id) + '</span>';
    mon.insertAdjacentHTML('beforeend', '<div class="monseek" aria-label="진행 위치 — 탭·드래그=이동"><i></i></div>');
    const _v = mon.querySelector('video'), _pb = mon.querySelector('.monplay');
    const _sk = mon.querySelector('.monseek'), _fill = _sk.querySelector('i');
    _v.onclick = () => { if (_v.paused) _v.play(); else _v.pause(); };   /* 탭 = 재생/일시정지(쇼츠 관례 · 소리 포함 — 제스처라 자동재생 정책 무관) */
    _v.onplay = () => { _pb.hidden = true; }; _v.onpause = () => { _pb.hidden = false; };
    _v.ontimeupdate = () => { if (_v.duration) _fill.style.width = (_v.currentTime / _v.duration * 100) + '%'; };   /* 진행 추종(운영자 260803 아이디어 — 시크바 부재 해소) */
    const _seekTo = ev => { const r = _sk.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
      if (_v.duration) { _v.currentTime = p * _v.duration; _fill.style.width = (p * 100) + '%'; } };
    _sk.onpointerdown = ev => { ev.stopPropagation(); _seekTo(ev); try { _sk.setPointerCapture(ev.pointerId); } catch (_) {}
      _sk.onpointermove = e2 => _seekTo(e2);
      _sk.onpointerup = () => { _sk.onpointermove = null; _sk.onpointerup = null; }; };   /* 탭·드래그 시크(포인터 캡처 = 바 밖으로 나가도 추적) · stopPropagation = 재생 토글 오발 차단 */
    return;
  }
  const f = picked[0], a = f && ART[f];
  if (!a) { mon.innerHTML = '<div class="cpv-empty"><div class="cpv-stage"><button type="button" class="cpv-photobtn" id="pvPick" disabled aria-label="이미지 첨부 — 이 탭은 아직 첨부 소스가 없다" title="이미지 첨부 — 이 탭은 아직 첨부 소스가 없다"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9.5" r="1.5"></circle><path d="M21 16l-5-5L5 20"></path></svg></button></div></div>'; return; }   /* 빈 상태 = 카드 제작 정본(사진 픽토 단독 · 운영자 260803 통일) — 구 「기사를 고르면 여기에 나온다」 문구 폐지 */
  mon.innerHTML = '<div class="mock">'
    + '<div class="mk-meta"><span>' + esc(a.media || '') + '</span><span>' + esc(a.date || '') + '</span>'
    + (a.bias ? '<span class="mk-chip">' + esc(a.bias) + '</span>' : '') + '</div>'
    + '<div class="mk-rule"></div>'
    + '<div class="mk-hook">' + esc(a.hook || a.title) + '</div>'
    + '<div class="mk-title">' + esc(a.title) + '</div>'
    + '</div><span class="tc">미리보기(목업) · 실렌더 아님</span>';
}

/* ── 효과 컨트롤 렌더 ── */
function paintAxes() {
  $('#axes').innerHTML = AXES.map(a =>
    '<div class="axrow"><label class="fl">' + esc(a.nm) + '</label>'   /* 구 `.opt` 부연 스팬 = 소거(260804 "오로지 기능만") */
    + '<div class="axchips" data-k="' + a.k + '">'
    + a.vals.map(([v, lbl]) => {
        const blocked = a.only && a.only.v === v && opts[a.only.format ? 'format' : ''] !== a.only.format;
        return '<button class="axchip' + (opts[a.k] === v ? ' on' : '') + '" type="button" data-v="' + v + '"'
          + (blocked ? ' disabled aria-disabled="true" title="MP4에서만"' : '')
          + ' aria-pressed="' + (opts[a.k] === v) + '">' + esc(lbl) + '</button>';
      }).join('')
    + '</div></div>').join('');
  // 요약줄 = 켜진 값 조인. 숏폼 팩만 예외 — 끈 상태의 '안 함'은 무슨 축인지 안 보여 줄에서 뺀다(켜면 축 이름으로 뜬다)
  $('#fxSum').textContent = AXES.filter(a => !(a.k === 'pack' && opts.pack === 'off'))
    .map(a => a.k === 'pack' ? a.nm : (a.vals.find(v => v[0] === opts[a.k]) || [])[1]).join(' · ');
  // (구 #fxNote 산문 주석 = 소거 · 운영자 260804 "설명같은거는 세부메뉴에서 빼고 오로지 기능만" — 축 구분은 칩 라벨(안 함/동봉)이 그대로 진다)
}
$('#axes').addEventListener('click', e => {
  const b = e.target.closest('.axchip'); if (!b) return;
  opts[b.parentElement.dataset.k] = b.dataset.v;
  // ⚠ 실측 260802: --resolution 은 알파 경로(mov/webm/gif)와 결합 불가(CLI 컴파일 단계 거부) → MP4 아니면 4K 자동 해제.
  if (opts.format !== 'mp4' && opts.res === 'portrait-4k') opts.res = 'portrait';
  paintAxes(); syncSpec();
});

/* ── 기사 목록 ── */
function rowHtml(a) {
  const f = String(a.file).replace(/\.md$/, '');
  return '<div class="vdrow" data-file="' + esc(f) + '" role="button" tabindex="0" aria-pressed="false">'
    + '<span class="dl-cbox">' + CK_SVG + '</span>'
    + '<span class="vdt">' + esc(a.title) + '</span>'
    + '<span class="vdm">' + esc(a.media || '') + '</span></div>';
}
function toggle(el) {
  const f = el.dataset.file, i = picked.indexOf(f);
  if (i >= 0) { picked.splice(i, 1); el.classList.remove('on'); el.setAttribute('aria-pressed', 'false'); }
  else {
    if (picked.length >= MAX) { $('#go').classList.add('shake'); setTimeout(() => $('#go').classList.remove('shake'), 460); return; }
    picked.push(f); el.classList.add('on'); el.setAttribute('aria-pressed', 'true');
  }
  syncSpec(); paintMonitor();
}
const X_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18"/></svg>';   /* 닫기 X = §🎨 3-1 SVG 정본 */
function paintSrc() {
  const box = $('#srcList');
  $('#srcHint').textContent = picked.length ? picked.length + ' / ' + MAX + '건' : '';
  if (!picked.length) {
    box.innerHTML = '<div class="vdempty">위 <b>파일</b> 메뉴에서 기사를 고르면 여기에 쌓인다.</div>';
    return;
  }
  box.innerHTML = picked.map((f, i) => {
    const a = ART[f] || {};
    return '<div class="srcrow" data-file="' + esc(f) + '"><span class="n">' + (i + 1) + '</span>'
      + '<span class="t">' + esc(a.hook || a.title || f) + '</span>'
      + '<span class="m">' + esc(a.media || '') + '</span>'
      + '<button class="x" type="button" aria-label="빼기" title="빼기">' + X_SVG + '</button></div>';
  }).join('');
  box.querySelectorAll('.x').forEach(b => b.addEventListener('click', () => {
    const f = b.closest('.srcrow').dataset.file;
    const el = document.querySelector('.vdrow[data-file="' + CSS.escape(f) + '"]');
    if (el) toggle(el); else { picked = picked.filter(x => x !== f); syncSpec(); paintMonitor(); paintSrc(); }
  }));
}
function syncSpec() {
  const fmt = (AXES[0].vals.find(v => v[0] === opts.format) || [])[1];
  const res = opts.res === 'portrait-4k' ? '4K 세로' : '1080×1920';
  $('#spec').innerHTML = [   // 값 = 전부 `.gs-v` 칩(정본 리드백 문법 · 운영자 260802 코너 레일 이주 동반) — 구 맨 텍스트 ' · ' 조인은 세로 레일에서 한 줄로 삐져나온다(k 동일 교정)
    '<span class="gs-v' + (picked.length ? ' on' : '') + '">' + picked.length + '건</span>',
    '<span class="gs-v">' + esc(res) + '</span>', '<span class="gs-v">' + esc(fmt) + '</span>',
    '<span class="gs-v">' + esc(opts.fps) + 'fps</span>', '<span class="gs-v">6초</span>'
  ].concat(opts.pack === 'on' ? ['<span class="gs-v on">팩</span>'] : [])   // 숏폼 팩 켜짐 = 레일에도 리드백(메뉴 안 열고 상태 확인 · 값 칩 `.gs-v` 정본 그대로 · 켠 상태라 `.on`)
   .join('<span class="gs-sep">·</span>');
  $('#cntSel').textContent = picked.length ? ' ' + picked.length : '';
  $('#sumProj').textContent = picked.length ? picked.length + '건 선택' : '최대 ' + MAX + '건';
  const es = $('#editSum'); if (es) es.textContent = picked.length + '건 선택 중';
  paintSrc();
}
async function loadList() {
  let arts = [];
  try {
    const r = await fetch('articles.json?t=' + Date.now());
    const ct = r.headers.get('content-type') || '';
    if (!r.ok || ct.includes('text/html')) throw new Error('없음');
    arts = (await r.json()).articles || [];
  } catch (e) {
    $('#list').innerHTML = '<div class="vdempty">기사 목록을 못 불러왔어 — 새로고침해줘.</div>'; return;
  }
  const use = arts.filter(a => a.file && a.title).slice(0, 60);
  use.forEach(a => { ART[String(a.file).replace(/\.md$/, '')] = a; });
  $('#list').innerHTML = use.length ? use.map(rowHtml).join('') : '<div class="vdempty">큐가 비었어.</div>';
  $('#list').querySelectorAll('.vdrow').forEach(el => {
    el.addEventListener('click', () => toggle(el));
    el.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(el); } });
  });
  syncSpec();
}

/* ── 렌더 큐(작업 내역) = sb #jobs 문법 계승 ── */
const JKEY = 'vd_jobs';
const jload = () => { try { const a = JSON.parse(localStorage.getItem(JKEY) || '[]'); return Array.isArray(a) ? a.slice(0, 30) : []; } catch (e) { return []; } };
const jsave = a => { try { localStorage.setItem(JKEY, JSON.stringify(a.slice(0, 30))); } catch (e) {} };
function renderJobs() {
  const a = jload();
  $('#cntJob').textContent = a.length ? ' ' + a.length : '';
  $('#qHint').textContent = a.length ? '' : '';
  $('#jobs').innerHTML = a.length ? a.map(j => {
    const st = j.status === 'done' ? (DONE_SVG + '완료 ' + (j.n || 0) + '편')
      : j.status === 'err' ? '실패' : (SPIN_SVG + '만드는 중');
    // 숏폼 팩 동봉(5축) = 같은 잡 산출이라 같은 줄에 뜬다 — 영상 먼저·팩 뒤, 사이 구분은 기존 `.jvar` 텍스트칩 계승(새 버튼 변형 금지 = nm-cards.css §다운로드 표준 "색·효과 재설계 금지")
    const _all = (j.status === 'done' && j.files) || [];
    const _vid = _all.filter(u => !/\.md$/i.test(u)), _pak = _all.filter(u => /\.md$/i.test(u));
    const _dlb = (u, lb) => '<a class="dlbtn jdl" href="' + esc(u) + '" download aria-label="' + lb + '" title="' + lb + '">' + DL_SVG + '</a>';
    const dl = _vid.map(u => _dlb(u, '영상 내려받기')).join('')
      + (_pak.length ? '<span class="jvar">팩</span>' + _pak.map(u => _dlb(u, '숏폼 팩 내려받기')).join('') : '');
    return '<div class="job' + (j.status === 'err' ? ' err' : '') + '"><span class="jlab">' + esc(j.id) + '</span>'
      + '<span class="jvar">' + (j.n || 0) + '건</span>' + dl + '<span class="jst">' + st + '</span></div>';
  }).join('') : '<div class="vdempty">아직 만든 영상이 없다.</div>';
  paintMonitor();
}
async function poll(outPath, jid) {
  for (let i = 0; i < 240; i++) {
    await new Promise(r => setTimeout(r, 10000));
    let d = null;
    try {
      const r = await fetch(outPath + '?t=' + Date.now());
      const ct = r.headers.get('content-type') || '';
      if (!r.ok || ct.includes('text/html')) continue;   // SPA 폴백 가드
      d = await r.json();
    } catch (e) { continue; }
    if (!d) continue;
    const a = jload(), j = a.find(x => x.id === jid); if (!j) return;
    if (d.error) { j.status = 'err'; } else { j.status = 'done'; j.files = d.files || []; j.n = (d.files || []).filter(u => !/\.md$/i.test(u)).length; }   // 편수 = 영상만(숏폼 팩 .md 동봉 시 files가 2배 = "완료 N편"이 부풀던 것 차단)
    jsave(a); renderJobs(); return;
  }
}
async function fire() {
  if (!picked.length) {
    $('#go').classList.add('shake'); setTimeout(() => $('#go').classList.remove('shake'), 460);
    openMenu('file'); return;
  }
  $('#go').disabled = true;
  try {
    const res = await fetch('/api/vd', { method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ files: picked, opts }) });
    const j = await res.json();
    if (!res.ok || j.error) throw new Error(j.error || ('HTTP ' + res.status));
    const a = jload(); a.unshift({ id:j.id, out:j.out, n:picked.length, status:'run' }); jsave(a); renderJobs();
    poll(j.out, j.id);
    picked = [];
    $('#list').querySelectorAll('.vdrow.on').forEach(el => { el.classList.remove('on'); el.setAttribute('aria-pressed','false'); });
    syncSpec(); paintMonitor();
    openMenu('win');
  } catch (e) {
    $('#spec').textContent = '발사 실패 — ' + e.message;
  } finally { $('#go').disabled = false; }
}
$('#go').addEventListener('click', fire);
window.nmRefresh = renderJobs;   // 부모 셸 헤더 새로고침 훅(sb:568 계승)

paintAxes(); loadList(); renderJobs(); syncSpec();
const _run = jload().find(j => j.status === 'run'); if (_run) poll(_run.out, _run.id);
// ── 미리보기 확대(돋보기) = viewer/tr.html `PVZOOM` 정본 동문 사본(운영자 260803 "카드 제작 부분과 동일하게") · 이 표면의 도크 = .dock ──
const PVZOOM = { K: 'nm.pvzoom',
  get() { try { return localStorage.getItem(this.K) === '1'; } catch (_) { return false; } },
  set(on) { try { on ? localStorage.setItem(this.K, '1') : localStorage.removeItem(this.K); } catch (_) {} } };
(function () {
  const td = document.querySelector('.dock'), b = document.getElementById('cpZoom'); if (!td || !b) return;
  const paint = on => { td.classList.toggle('dockzoom', on); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.setAttribute('aria-label', on ? '미리보기 원상복귀' : '미리보기 확대'); b.title = on ? '탭=원상복귀' : '탭=미리보기 확대 · 다시 탭=원상복귀'; };
  paint(PVZOOM.get());
  b.addEventListener('click', () => { const on = !td.classList.contains('dockzoom'); paint(on); PVZOOM.set(on); });
})();

</script>
