<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- 부모(index)와 color-scheme 일치 필수 — k.html:7 계승 -->
<title>번역카드</title>
<link rel="stylesheet" href="tokens.css">   <!-- 공유 구조토큰(§🎨 STAGE3·index :root 파생·색 제외). 인라인 :root가 팔레트 오버라이드 -->
<link rel="stylesheet" href="nm-cards.css">   <!-- 다운로드·결과/이전제작 카드 공용 CSS SSOT(전 앱 단일정본 · 운영자 260731 "하나 바꾸면 다 연동") — 색·플레이트·✓팝 계약은 여기서만 고친다(인라인 사본 금지 · 인라인이 뒤라 남기면 이 SSOT가 죽음) -->
<link rel="stylesheet" href="nm-hist.css">   <!-- 이전 제작(공유 이력) 섹션 CSS SSOT — thumb 인라인 정본을 승격한 공동 링크(운영자 260802 "편집·번역·AI생성에도 결과·이전제작 일맥상통 공유") -->
<link rel="stylesheet" href="nm-input.css">   <!-- 이미지 스튜디오 텍스트 입력칸 SSOT(활자+박스 · 운영자 260804 "편집의 폰트 형태를 따라가는게 정석 · 딱 그부분만 다른 곳에 다 배선") — 정본 원천 = thumb.html 입력칸 블록 · 신규 칸 = class="nmin" 한 줄 -->
<style>
  /* ⚠️ 기틀 계승 원본 = viewer/sb.html(콘티 · 그 원본 = k.html) — 공유 블록은 바이트 동일 유지(운영자 260714 "그대로 기틀 참고·맘대로 생성 금지"). 공용 수정은 k/sb와 동시. */
  :root { --well:#0e0f11;   /* 인셋 웰(입력·코드박스 배경 — 7뷰어 공유 raw 추출 = 동값·픽셀 0 · 평의회 260713 ⑨) */ --bg:#121212;   /* 스포티파이 블랙(중립)·운영자 260623 */ --pan:#16171a; --line:#2a2c31; --fg:#eef7f0; --mut:#8fa697; --accent:#00EED2; --accent-rgb:0,238,210;
    --accent-4:#FFE13D; --accent-4-rgb:255,225,61;   /* raw-ok: index :root 정본 동값 exact 계승(골드레몬) — 공용 nm-cards.css(다운로드 SSOT)가 참조하는 토큰이라 전 뷰어 정의 필수(미정의 = var() 댕글링 = 다운로드 색 죽음) · 이후 값 동기 = build_design_mirror STAGE4 자동 전파(운영자 260731) */
    --danger:#e23b2a; --danger-rgb:226,59,42;   /* 역할색 danger = 브랜드 유일 레드(index 동일·감사 260704) */ --warn:#FFE13D;   /* 역할색 warn = 골드레몬(k:12 계승) */ --accent-dim:rgba(var(--accent-rgb),.13); --on-accent:#032322; --line2:rgba(255,255,255,.06);
    --hist-accent:#FFE13D; --hist-rgb:255,225,61; }   /* raw-ok: thumb.html :root 정본 동값 exact 계승(이력색 라임 — nm-hist.css 공유 섹션이 참조 · 미정의 = var() 댕글링) · --press-* = tokens.css 상속(k:12 계승) */
  @media (prefers-reduced-motion:reduce){ :root{ --press-pico:1; --press-xs:1; --press-s:1; --press-m:1; --press-l:1; } }   /* 눌림 토큰 무효화 = 로컬(k:13 계승) */
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }   /* k:14 계승 */
  [hidden] { display:none !important; }   /* hidden 기저 가드(k:15 계승) */
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible, [role=button]:focus-visible, label.file:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }   /* 포커스 링(k:17 계승) */
  /* ⚠️ 실제 화면에 보이는 스크롤바는 아래 네이티브가 아니라 cscroll.js 커스텀 오버레이다(cscroll이 네이티브를 display:none로 죽이고 자기 thumb를 그림). 색 바꾸려면 viewer/cscroll.js를 고쳐라 — 이 네이티브 규칙만 만지면 안 바뀜(260626 고질 교훈·검증 5인). */
  html .cscroll { display:none !important; }   /* 스크롤바 표시 제거(운영자 260716 "이미지·영상 스튜디오 둘다 스크롤 없애" · thumb:31 정본 계승 — 260803 "모든 이미지·영상 스튜디오에서 없애" 재지시 · 260721 이식 때 스크롤 스택 통째 누락됐던 표면) — 오버레이 썸만 숨김·스크롤 동작/네이티브 숨김은 종전 · !important = 주입 <style>이 소스순 뒤라 재승리 필수(.a2hide 선례) · 공유 cscroll.js 무접촉(타 뷰어 표준 보존) · 복원 = 이 행 삭제 */
  html { scrollbar-width:none; -ms-overflow-style:none; scrollbar-color:rgba(255,255,255,.05) transparent; }   /* 스크롤바 폭 0 = 문서 끝 cscroll.js(오버레이 바) 주입값과 **첫 페인트부터 동일** — index 115행 정본 계승(구 thin은 cscroll 실행 전까지 네이티브 바가 폭을 차지했다가 주입 순간 0으로 풀려, 스크롤이 생긴 화면에서 콘텐츠가 통째로 옆으로 밀렸다 · 운영자 260726 index 픽토 점프[Q579]와 같은 축 · 260803 "번역·AI 생성만 미리보기가 흔들려"의 번역 몫 = 이 두 줄이 tr만 빠져 클래식 스크롤바 환경에서 바 폭만큼 미리보기가 좌로 밀렸다 · 데스크톱 클래식 스크롤바 환경 전용 = 헤드리스는 오버레이라 재현 불가) · no-JS 폴백 = head 끝 noscript */
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; height:0; display:none; }   /* 위 scrollbar-width:none의 웹킷 짝(cscroll.js 주입 규칙 계승) — 아래 공통 10px은 모달·내부 스크롤 표면 전용으로 존치 */
  ::-webkit-scrollbar { width:5px; height:5px; }   /* 두께 = 구 10 의 50%(운영자 260801) — 알약 실폭 = 5 - 테두리 1×2 = 3px(구 6px 의 50%) */
  * { scrollbar-width:none; }   /* 전면 소거(운영자 260803 5차 "이미지 스튜디오에 스크롤 없애줘 그냥" — 문서 바에 이어 **내부 표면(모달 목록·입력칸)까지** · 스크롤 동작은 유지·표시만 소거 = 260716 원지시 「이미지·영상 스튜디오 둘다」라 7표면 동반) — 크로미엄은 표준 프로퍼티가 지정되면 ::-webkit-scrollbar-* 를 무시 = 실화면은 이 줄이 담당 · no-JS 폴백(noscript)·타 뷰어 불변 */
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.05); border-radius:var(--r-pill);
    border:1px solid var(--bg); background-clip:padding-box; }   /* 테두리(=바 여백)도 50%: 2→1 = 알약 실폭 3px 유지 */
  ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.08); background-clip:padding-box; }
  @font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url(assets/fonts/pretendard.woff2) format('woff2-variations')}   /* 본문 폰트 = index 정본 이식(sb:26 계승) */
  @font-face{font-family:'Noto Sans KR';font-weight:400;font-style:normal;font-display:swap;src:url(assets/fonts/noto-sans-kr-400.woff2) format('woff2')}   /* 카드 콘텐츠 폰트 = thumb.html 정본 그대로 미러(운영자 260714 Q03③·Q06) — PIL NotoSansCJK KR 웹 등가 · 자체호스팅 */
  @font-face{font-family:'Noto Sans KR';font-weight:700;font-style:normal;font-display:swap;src:url(assets/fonts/noto-sans-kr-700.woff2) format('woff2')}   /* 카드 제목·자막·번역칩 = Bold(운영자 260721 "폰트 박아" · thumb 정본 그대로 · 한글2350 서브셋) — 한자는 AI 규칙이 한글로 회피(운영자 "한자 쓰지마") · 불가피 한자 = font-family 체인('Noto Sans CJK KR'→sans-serif) 글리프 폴백 · src = url 단독(운영자 260805 — thumb 381 동문 · 기기 로컬 동명 폰트가 정본을 가리는 축 제거) */
  body { margin:0; background:radial-gradient(125% 70% at 50% -8%, rgba(var(--accent-rgb),.06), transparent 55%) fixed, var(--bg); color:var(--fg); font:15px/1.6 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing:-.2px /* raw-ok: 자간 = index body 정본 exact 계승 */; -webkit-font-smoothing:antialiased; }
  html.inmodal, html.inmodal body { background:transparent; }   /* 모달(iframe)에선 투명 → #tooldlg 글래스로 뒤 피드 자연스럽게 비침(타 메뉴와 통일) = thumb.html 정본 그대로 계승(운영자 260626 확립 · tr은 260721 이식 때 이 한 줄이 빠져 번역 탭만 순흑 매트로 남아 있었다 — 운영자 260729 "AI 생성만 글래스" 지적의 번역 탭 몫) · body 자체 radial-gradient도 이 선언이 함께 끈다(background 쇼트핸드 재선언) */

  /* 폼 요소 활자 계승 강제(운영자 260727 "같은 형태에 있는 애들은 다 같아야함") — button/input/textarea/select는 UA 기본이 font-family·letter-spacing 상속을 끊어, 같은 카드 안에서 라벨(span)은 자간 −.2px인데 칩(button)만 normal로 그려지던 잔여 편차의 진범. 값 신설 0 = 전부 상속 */
  button, input, textarea, select { font-family:inherit; letter-spacing:inherit; }
  .wrap { max-width:600px; margin:0 auto; padding:var(--sp-3) 16px 70px; }   /* raw-ok: k.html .wrap 동일값 계승 */
  /* (#resBody 결과 본문 여백 = nm-hist.css SSOT 별칭 행으로 이관 · 260803 6차 평의회2 "인라인 사본 금지") */
  .out { margin-top:18px; }   /* raw-ok: thumb `.out` 정본 문자 그대로 계승(운영자 260803 6차 "편집과 다 동일하게") — 번역만 0이라 결과 레일 머리가 형제 4탭보다 18px 위에서 시작했다(실측 1280: tr 130 vs thumb 148) */
  html.inmodal .wrap { max-width:none; }   /* 이미지 스튜디오 전체창 = thumb.html 정본 그대로 계승(운영자 260802 "좌우공백을 아예 없애줘") — 번역 탭만 600에 남으면 형제 3탭과 폭이 갈라진다(260721 이식 때 html.inmodal 투명화가 빠져 번역만 순흑으로 남았던 것과 같은 축) · 단독 열람은 종전 600 유지 */
  /* ── 탭 간 폭 통일(운영자 260802 "미리보기가 각 세부 메뉴마다 다 다르게 생겼는데, 기본값에 다 맞춰서 통일") ──
     번역 탭은 결과 블록(.out)이 없어 2단 그리드가 안 잡혀 혼자 창 전폭(실측 1280 vs 형제 631)이었다.
     → thumb 결과 레일 블록의 **트랙 정의만 동일 사본**(minmax(0,1fr) 2벌 · column-gap sp-3 · 도크 우변 회수)으로
     콘텐츠를 1번 칼럼에 앉힌다 = 미리보기·도크 기하가 카드 생성(기본)과 픽셀 동일 · 신규 값 0. */
  @media (min-width:900px) {
    html.inmodal .wrap { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); column-gap:var(--sp-3); align-items:start; }
    html.inmodal .wrap > * { grid-column:1; }
    html.inmodal .wrap > .out { grid-column:2; grid-row:1 / span 99; align-self:start;
      position:sticky; top:var(--sp-3) /* 좌측 도크와 같은 축 = 스크롤해도 결과가 항상 눈에 남는다(thumb `html.inmodal .wrap > .out` 정본 3선언 exact 계승 — 260803 6차 "편집과 다 동일하게" · 구 누락분: 번역만 결과 레일이 스크롤에 딸려 사라졌다) · 값 = .wrap padding-top 동값 토큰이라 정지↔고정 전환 시 튐 0 */;
      max-height:calc(100svh - var(--sp-3)); overflow-y:auto; overscroll-behavior:contain; }   /* 컨테이너 = .out(thumb 정본 셀렉터 그대로 · 260803 결과 섹션 합류로 래퍼 승격) */   /* 이전 제작(공유) = 우측 2번 칼럼 = thumb `.wrap > .out` 정본 동값 사본(운영자 260802 일맥상통 — 형제 4탭과 같은 골격: 좌 제작 / 우 이력) */
    html.inmodal .topdock { margin-right:0; }
    html.inmodal .cpprev { --pvw:min(29svh, 300px); }   /* 2단에선 폭 산식에서 **`52%` 항만 뺀다** = thumb 정본 동문 사본(:69 `html.inmodal .topdock[data-lay="edit"]` · index geni :2301과도 동값 · 신규 값 0) — 52%는 '칼럼 폭'을 읽는데 2단은 칼럼이 반이라 이 사본이 없으면 번역 창만 형제 4탭보다 좁아진다(실측 260803 940×1000: 형제 257.5 vs 번역 223.1 = 폭 −34.4·좌변 +17.3px) · 이 미러 누락이 900~1000폭대에서만 터져 1280·430 두 티어만 재던 구 게이트를 그냥 통과했다 */
    html.inmodal .topdock.dockzoom .cpprev { --pvw:min(58svh, 620px); }   /* 돋보기도 동일 처방(`100%` 항만 제외 = 칼럼 폭 의존 제거 · thumb :70 동문) — 안 걸면 확대 상태에서만 번역 폭이 다시 갈라진다 */
  }
  label { display:block; font-size:var(--fs-label); color:var(--fg); margin:14px 0 var(--sp-1); }   /* raw-ok: k.html label 동일값 계승 */
  label.fl { display:flex; align-items:center; gap:6px; font-weight:var(--fw-x); color:var(--fg); }   /* 소머리 = 흰색·800 · **flex 블릿 문법**(운영자 260729 "내용 블릿이 옵션 블릿처럼 좌측 정렬이 되어야함") — 구 블록 문법(`content:'• '` 공백 포함)은 공백 글자폭이 곧 들여쓰기라 형제 `.csec`(flex+gap 6)와 첫 글자 x가 갈렸다 → CII 소머리 규칙의 flex 갈래로 통일 = 같은 화면 두 소머리가 한 세로선 */
  label.fl::before { content:'•'; color:var(--accent); font-weight:var(--fw-b); }   /* 블릿 = 형광 · 공백 제거(간격은 위 gap:6px가 전담 = .csec 정본 동일) */
  label:first-of-type { margin-top:0; }
  textarea { width:100%; min-height:96px; padding:var(--sp-2); background:var(--well); border:1px solid var(--line); border-radius:var(--r-s); color:var(--fg); font:inherit; font-size:16px; resize:none; }   /* k:33 계승 · raw-ok: 16px = iOS 자동줌 방지 하한 */
  textarea:focus, input:focus { border-color:rgba(var(--accent-rgb),.6) /* raw-ok: nm-clip `.iobtn-edge:active` 테두리 동값 계승 — 기본이 .35로 올라온 만큼 포커스는 한 단 진하게(thumb :127 동문) */; box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08); outline:none; }
  textarea::placeholder, input::placeholder { color:var(--mut); }
  /* 입력칸 [복사][붙여넣기][지우개] 3버튼 = k.html .scnclip 블록 계승(운영자 260714 "텍스트 입력창엔 항상 토글 버튼 3개") */
  .scnwrap { position:relative; }
  .scnclip { position:absolute; top:0; right:14px; transform:translateY(-50%); display:grid; place-items:center; width:26px; height:26px; padding:0; z-index:5; opacity:.6;
    border-radius:50%; border:1px solid rgba(255,255,255,.17); background:rgba(26,28,26,.3); color:var(--mut); cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
    -webkit-backdrop-filter:blur(var(--blur-m)) saturate(1.3); backdrop-filter:blur(var(--blur-m)) saturate(1.3); -webkit-tap-highlight-color:transparent; transition:transform var(--dur-fast), color var(--dur), border-color var(--dur); }   /* G1 글래스모피즘 · raw-ok: k.html .scnclip 동일값 계승(blur13 — 픽셀 패리티) */
  .scnclip svg { display:block; width:13px; height:13px; }
  .scnclip::before { content:""; position:absolute; inset:-8px; }
  .scnclip:hover { color:var(--fg); border-color:rgba(255,255,255,.27); }
  .scnclip:active { transform:translateY(-50%) scale(var(--press-xs)); }   /* 픽토 소형 버튼 눌림 = press-xs 티어 계승 */
  .scnclip.scn-pp { right:46px; }
  .scn-copy { right:78px; }
  .scn-hide { display:none; }
  .scn-erase { right:14px; }

/* ── 밴드 텍스트 파서: *초록* [박스] (기존 그대로) ── */
function parseRuns(line){
  const runs = []; let m = 'n', buf = '';
  const flush = () => { if (buf) { runs.push({ tx: buf, m }); buf = ''; } };
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '*') { flush(); m = (m === 'g') ? 'n' : 'g'; }
    else if (ch === '[' && m === 'n') { flush(); m = 'b'; }
    else if (ch === ']' && m === 'b') { flush(); m = 'n'; }
    else buf += ch;
  }
  flush(); return runs;
}
function tokens(runs){
  const out = [];
  runs.forEach(r => {
    if (r.m !== 'n') { out.push({ tx: r.tx, m: r.m }); return; }   /* 강조 구간 = 통짜 토큰(줄바꿈으로 박스 두 동강 방지 — 운영자 260720 "결과물 이상" 보정) */
    let cur = '';
    const flush = () => { if (cur) { out.push({ tx: cur, m: r.m }); cur = ''; } };
    for (const ch of r.tx) {
      if (ch === ' ') { flush(); out.push({ tx: ' ', m: r.m }); }
      else if (ch.charCodeAt(0) > 0x2E7F) { flush(); out.push({ tx: ch, m: r.m }); }   /* CJK = 글자 단위 줄바꿈 */
      else cur += ch;
    }
    flush();
  });
  return out;
}

function layoutBand(b){

    const put = tk => {
      const tw = mc.measureText(tk.tx).width;
      if (w + tw > mx && line.length) { lines.push(line); line = []; w = 0; if (tk.tx === ' ') return; }
      if (tw > mx && tk.tx.length > 1) {   /* 한 줄보다 긴 통짜 강조 = 글자 단위 폴백(스타일 유지) */
        [...tk.tx].forEach(ch => put({ tx: ch, m: tk.m }));

  let ly = y + L.padY + Math.round(b.fs * 0.92);

    let x = PADX;
    line.forEach(tk => {   /* 강조 배경(박스·초록)부터 */
      if (tk.m === 'b') { ctx.fillStyle = dark ? TR_WHITE : TR_BLACK; ctx.fillRect(x - 2, ly - b.fs * 0.92, tk.w + 4, b.fs * 1.22); }

      x += tk.w;

function runNatRect(run, bmap){   /* 런의 자연좌표 bbox */
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = run.s; i <= run.e; i++) { const b = bmap.get(i); if (!b) continue; x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); }
  return x0 > x1 ? null : { x0, y0, x1, y1 };
}
function drawExcerpts(ctx, plan, ox, oy, g, regionH){   /* 형광펜 런 = 확대 발췌 리프트(흰 받침+그림자+형광펜) = 문서서 오려낸 볼록 느낌(뉴스 기법 · 운영자 260721) */
  const bmap = new Map(ocrLines.map(l => [l.i, l.b]));
  const runs = hlRuns(plan.hl);
  const ex = new Map();
  runs.forEach((run, ri) => {
    const R = runNatRect(run, bmap); if (!R) return;
    const pad = 8 / g;
    const sx = R.x0 - pad, sy = R.y0 - pad, sw = (R.x1 - R.x0) + pad * 2, sh = (R.y1 - R.y0) + pad * 2;
    const fw = sw * g, fh = sh * g;
    const cx = ox + (R.x0 + R.x1) / 2 * g, cy = oy + (R.y0 + R.y1) / 2 * g;
    const P = popScale(run), dwp = fw * P, dhp = fh * P;
    let dx = cx - dwp / 2; const dy = cy - dhp / 2;
    dx = Math.max(10, Math.min(dx, TR_W - dwp - 10));   /* 카드 밖 이탈 방지 */
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 7;   /* 볼록 튀어나온 그림자 */
    ctx.fillStyle = TR_WHITE; ctx.fillRect(dx - 6, dy - 4, dwp + 12, dhp + 8); ctx.restore();   /* 흰 받침(발췌 카드) */
    ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dwp, dhp);   /* 확대 슬라이스(원본 크롭) */
    ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = OV_MARK;   /* 형광펜 = 확대 슬라이스 안 각 라인 */
    for (let i = run.s; i <= run.e; i++) { const b = bmap.get(i); if (!b) continue;
      const lx = dx + (b.x - sx) * g * P, ly = dy + (b.y - sy) * g * P;
      ctx.fillRect(lx - 3, ly - 2, b.w * g * P + 6, b.h * g * P + 4); }
    ctx.restore();
    ex.set(ri, { left: dx, right: dx + dwp, top: dy, bottom: dy + dhp });
  });
  return { runs, ex };
}
function drawChips(ctx, plan, regionH, exData){   /* 칩 = 발췌 리프트 아래 앵커 : .85 검정 · 자간 · 4분할 중앙정렬 · x=발췌 좌단 추종(운영자 260721) */
  const runs = exData.runs, ex = exData.ex;
  const CHIP_FS = 30, padX = 12, padY = 9, maxW = 900;
  ctx.font = `700 ${CHIP_FS}px ${FONT_KO}`; ctx.letterSpacing = TRACK; ctx.textBaseline = 'middle';   /* 700 = 노토 Bold 번들 정합 */
  const placed = [];
  (plan.chips || []).forEach(c => {
    let ri = runs.findIndex(r => c.a >= r.s && c.a <= r.e);
    if (ri < 0 && runs.length) ri = runs.reduce((bi, r, i) => Math.abs((r.s + r.e) / 2 - c.a) < Math.abs((runs[bi].s + runs[bi].e) / 2 - c.a) ? i : bi, 0);
    const e = ex.get(ri);
    const L = chipLayout(ctx, String(c.t || ''), CHIP_FS, maxW);
    const bw = Math.min(L.w, maxW) + padX * 2, bh = L.lines.length * L.lh + padY * 2;
    let x = e ? Math.max(16, Math.min(Math.round(e.left), TR_W - bw - 16)) : 20;   /* 발췌 좌단 추종 */
    let y = e ? Math.round(e.bottom) + 10 : 24;   /* 발췌 리프트 바로 아래 */
    placed.forEach(r => { if (x < r.x + r.w && x + bw > r.x && y < r.y + r.h && y + bh > r.y) y = r.y + r.h + 7; });   /* 겹침 = 아래로 */
    if (y + bh > regionH - 6) y = Math.max(6, (e ? Math.round(e.top) : regionH) - bh - 10);   /* 바닥 넘침 = 발췌 위로 */
    placed.push({ x, y, w: bw, h: bh });
    ctx.fillStyle = OV_CHIP; ctx.fillRect(x, y, bw, bh);
    ctx.strokeStyle = OV_LINE; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, bw - 1, bh - 1);
    L.lines.forEach((ln, k) => { let tx2 = x + padX; const cy = y + padY + L.lh * (k + 0.5);   /* 4분할 중앙(높이) = middle 베이스라인 · lh 밴드 정중앙 */
      ln.forEach(tk => { ctx.fillStyle = tk.m === 'g' ? OV_EMPH : OV_TEXT; ctx.fillText(tk.tx, tx2, cy); tx2 += ctx.measureText(tk.tx).width; }); });
  });
  ctx.letterSpacing = '0px';
}
async function pollPlan(id){   /* 1순위 = api/trplan(main 직독 = 빌드 큐 절연 · 운영자 260805 "그간 다 씹혔다" 봉합) · 2순위 = Pages 정적(구판 그대로 = 악화 경로 0) · 6분 캡 */
  for (let k = 0; k < 60; k++) {
    await new Promise(r => setTimeout(r, 6000));
    try { const r = await fetch(`/api/trplan?id=${id}&t=${Date.now()}`, { cache: 'no-store' });   /* 구판은 tr_out 정적만 폴링 = 커밋돼도 Pages 빌드 큐(봇 커밋 유입 시 시간 단위)가 풀릴 때까지 안 보여 6분 캡 초과 = 번역 전건 「대기 시간 초과」였다 — 스튜디오 제작 레일 중 유일한 배포 인질 축(형제 = R2 직접·api/genihist) */
      if (r.ok) { const p = await r.json();
        if (p && p.fail) throw new Error('AI 생성 실패 — 잠시 후 다시 시도해줘');
        if (p && Array.isArray(p.hl) && Array.isArray(p.chips)) return p; } } catch (er) { if (String(er.message).startsWith('AI')) throw er; }
    try { const r = await fetch(`tr_out/${id}/plan.json?t=${Date.now()}`, { cache: 'no-store' });
      if (r.ok) return await r.json(); } catch (_) {}
    try { const e = await fetch(`tr_out/${id}/error.log?t=${Date.now()}`, { cache: 'no-store' });
      if (e.ok) throw new Error('AI 생성 실패 — 잠시 후 다시 시도해줘'); } catch (er) { if (String(er.message).startsWith('AI')) throw er; }
  }
  throw new Error('대기 시간 초과(6분) — 잠시 후 다시');
}

const THUMB_HKEY = 'nomute_thumb_hist', THUMB_HMS = 12 * 3600e3, THUMB_HMAX = 240;   // thumb.html 정본 동값

const baseUrl = u => String(u || '').split('?')[0];

let SRV_HIST = [], SRV_CLEAR = 0; const _deadUrls = new Set();   // thumb 동축(죽은 404 항목 = 세션 내 재표시 차단)

  const localF = local.filter(e => (e.ts || 0) > cut);
  const seen = new Set(localF.map(e => histKey(e.url)));
  const srv = (SRV_HIST || []).filter(e => e && e.url && !seen.has(histKey(e.url)) && (e.ts || 0) > SRV_CLEAR);
  srv.forEach(e => seen.add(histKey(e.url)));
  const r2 = TR_R2.filter(e => e && e.url && !seen.has(histKey(e.url)) && (e.ts || 0) > cut);   // R2 즉시 발견분 = 셋째 소스(로컬·정식 인덱스가 이미 가진 건 스킵 = 정식 도착 시 자연 교체 · 지우기 컷 동일 존중)
  const resK = new Set(TR_RES.concat(TR_NEWEST).map(e => histKey(e.url)));   // '결과'(세션분+최신 추종)에 뜬 항목 = 이전 제작서 제외(thumb renderHist CARSLIDES 제외 동문 · 결과+그리드 이중노출 차단 = 5탭 카운트 한 값)
