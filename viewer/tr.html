<title>번역카드</title>
<link rel="stylesheet" href="tokens.css">   <!-- 공유 구조토큰(§🎨 STAGE3·index :root 파생·색 제외). 인라인 :root가 팔레트 오버라이드 -->
<link rel="stylesheet" href="nm-cards.css">   <!-- 다운로드·결과/이전제작 카드 공용 CSS SSOT(전 앱 단일정본 · 운영자 260731 "하나 바꾸면 다 연동") — 색·플레이트·✓팝 계약은 여기서만 고친다(인라인 사본 금지 · 인라인이 뒤라 남기면 이 SSOT가 죽음) -->
<style>
  /* ⚠️ 기틀 계승 원본 = viewer/sb.html(콘티 · 그 원본 = k.html) — 공유 블록은 바이트 동일 유지(운영자 260714 "그대로 기틀 참고·맘대로 생성 금지"). 공용 수정은 k/sb와 동시. */
  :root { --well:#0e0f11;   /* 인셋 웰(입력·코드박스 배경 — 7뷰어 공유 raw 추출 = 동값·픽셀 0 · 평의회 260713 ⑨) */ --bg:#121212;   /* 스포티파이 블랙(중립)·운영자 260623 */ --pan:#16171a; --line:#2a2c31; --fg:#eef7f0; --mut:#8fa697; --accent:#00EED2; --accent-rgb:0,238,210;
    --accent-4:#FFE13D; --accent-4-rgb:255,225,61;   /* raw-ok: index :root 정본 동값 exact 계승(골드레몬) — 공용 nm-cards.css(다운로드 SSOT)가 참조하는 토큰이라 전 뷰어 정의 필수(미정의 = var() 댕글링 = 다운로드 색 죽음) · 이후 값 동기 = build_design_mirror STAGE4 자동 전파(운영자 260731) */
    --danger:#e23b2a; --danger-rgb:226,59,42;   /* 역할색 danger = 브랜드 유일 레드(index 동일·감사 260704) */ --warn:#FFE13D;   /* 역할색 warn = 골드레몬(k:12 계승) */ --accent-dim:rgba(var(--accent-rgb),.13); --on-accent:#032322; --line2:rgba(255,255,255,.06); }   /* --press-* = tokens.css 상속(k:12 계승) */
  @media (prefers-reduced-motion:reduce){ :root{ --press-pico:1; --press-xs:1; --press-s:1; --press-m:1; --press-l:1; } }   /* 눌림 토큰 무효화 = 로컬(k:13 계승) */
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }   /* k:14 계승 */
  [hidden] { display:none !important; }   /* hidden 기저 가드(k:15 계승) */
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible, [role=button]:focus-visible, label.file:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }   /* 포커스 링(k:17 계승) */
  html { scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.05) transparent; }   /* 스크롤바 = 반투명 흰색(k:19 계승 · 260801) */
  ::-webkit-scrollbar { width:5px; height:5px; }   /* 두께 = 구 10 의 50%(운영자 260801) — 알약 실폭 = 5 - 테두리 1×2 = 3px(구 6px 의 50%) */
  * { scrollbar-width:thin; }   /* 표준 짝(크로미엄은 scrollbar-color·width 가 지정되면 ::-webkit-scrollbar-* 를 무시 = 실화면은 이 줄이 담당) — thin = 실존값(.draft-scroll·no-JS 폴백 동문) · html 은 자기 규칙(scrollbar-width:none)이 특이도로 승 = 페이지 바 숨김 불변 */
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.05); border-radius:var(--r-pill);
    border:1px solid var(--bg); background-clip:padding-box; }   /* 테두리(=바 여백)도 50%: 2→1 = 알약 실폭 3px 유지 */
  ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.08); background-clip:padding-box; }
  @font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url(assets/fonts/pretendard.woff2) format('woff2-variations')}   /* 본문 폰트 = index 정본 이식(sb:26 계승) */
  @font-face{font-family:'Noto Sans KR';font-weight:400;font-style:normal;font-display:swap;src:local('Noto Sans KR'),url(assets/fonts/noto-sans-kr-400.woff2) format('woff2')}   /* 카드 콘텐츠 폰트 = thumb.html 정본 그대로 미러(운영자 260714 Q03③·Q06) — PIL NotoSansCJK KR 웹 등가 · 자체호스팅 */
  @font-face{font-family:'Noto Sans KR';font-weight:700;font-style:normal;font-display:swap;src:local('Noto Sans KR'),url(assets/fonts/noto-sans-kr-700.woff2) format('woff2')}   /* 카드 제목·자막·번역칩 = Bold(운영자 260721 "폰트 박아" · thumb 정본 그대로 · 한글2350 서브셋) — 한자는 AI 규칙이 한글로 회피(운영자 "한자 쓰지마") · 불가피 한자 = local() OS 폴백 */
  body { margin:0; background:radial-gradient(125% 70% at 50% -8%, rgba(var(--accent-rgb),.06), transparent 55%) fixed, var(--bg); color:var(--fg); font:15px/1.6 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing:-.2px /* raw-ok: 자간 = index body 정본 exact 계승 */; -webkit-font-smoothing:antialiased; }
  html.inmodal, html.inmodal body { background:transparent; }   /* 모달(iframe)에선 투명 → #tooldlg 글래스로 뒤 피드 자연스럽게 비침(타 메뉴와 통일) = thumb.html 정본 그대로 계승(운영자 260626 확립 · tr은 260721 이식 때 이 한 줄이 빠져 번역 탭만 순흑 매트로 남아 있었다 — 운영자 260729 "AI 생성만 글래스" 지적의 번역 탭 몫) · body 자체 radial-gradient도 이 선언이 함께 끈다(background 쇼트핸드 재선언) */

  /* 폼 요소 활자 계승 강제(운영자 260727 "같은 형태에 있는 애들은 다 같아야함") — button/input/textarea/select는 UA 기본이 font-family·letter-spacing 상속을 끊어, 같은 카드 안에서 라벨(span)은 자간 −.2px인데 칩(button)만 normal로 그려지던 잔여 편차의 진범. 값 신설 0 = 전부 상속 */
  button, input, textarea, select { font-family:inherit; letter-spacing:inherit; }
  .wrap { max-width:600px; margin:0 auto; padding:var(--sp-3) 16px 70px; }   /* raw-ok: k.html .wrap 동일값 계승 */
  html.inmodal .wrap { max-width:none; }   /* 이미지 스튜디오 전체창 = thumb.html 정본 그대로 계승(운영자 260802 "좌우공백을 아예 없애줘") — 번역 탭만 600에 남으면 형제 3탭과 폭이 갈라진다(260721 이식 때 html.inmodal 투명화가 빠져 번역만 순흑으로 남았던 것과 같은 축) · 단독 열람은 종전 600 유지 */
  /* ── 탭 간 폭 통일(운영자 260802 "미리보기가 각 세부 메뉴마다 다 다르게 생겼는데, 기본값에 다 맞춰서 통일") ──
     번역 탭은 결과 블록(.out)이 없어 2단 그리드가 안 잡혀 혼자 창 전폭(실측 1280 vs 형제 631)이었다.
     → thumb 결과 레일 블록의 **트랙 정의만 동일 사본**(minmax(0,1fr) 2벌 · column-gap sp-3 · 도크 우변 회수)으로
     콘텐츠를 1번 칼럼에 앉힌다 = 미리보기·도크 기하가 카드 생성(기본)과 픽셀 동일 · 신규 값 0. */
  @media (min-width:900px) {
    html.inmodal .wrap { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); column-gap:var(--sp-3); align-items:start; }
    html.inmodal .wrap > * { grid-column:1; }
    html.inmodal .topdock { margin-right:0; }
  }
  label { display:block; font-size:var(--fs-label); color:var(--fg); margin:14px 0 var(--sp-1); }   /* raw-ok: k.html label 동일값 계승 */
  label.fl { display:flex; align-items:center; gap:6px; font-weight:var(--fw-x); color:var(--fg); }   /* 소머리 = 흰색·800 · **flex 블릿 문법**(운영자 260729 "내용 블릿이 옵션 블릿처럼 좌측 정렬이 되어야함") — 구 블록 문법(`content:'• '` 공백 포함)은 공백 글자폭이 곧 들여쓰기라 형제 `.csec`(flex+gap 6)와 첫 글자 x가 갈렸다 → CII 소머리 규칙의 flex 갈래로 통일 = 같은 화면 두 소머리가 한 세로선 */
  label.fl::before { content:'•'; color:var(--accent); font-weight:var(--fw-b); }   /* 블릿 = 형광 · 공백 제거(간격은 위 gap:6px가 전담 = .csec 정본 동일) */
  label:first-of-type { margin-top:0; }
  textarea { width:100%; min-height:96px; padding:var(--sp-2); background:var(--well); border:1px solid var(--line); border-radius:var(--r-s); color:var(--fg); font:inherit; font-size:16px; resize:none; }   /* k:33 계승 · raw-ok: 16px = iOS 자동줌 방지 하한 */
  textarea:focus, input:focus { border-color:rgba(var(--accent-rgb),.35); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08); outline:none; }
  textarea::placeholder, input::placeholder { color:var(--mut); }
  /* 입력칸 [복사][붙여넣기][지우개] 3버튼 = k.html .scnclip 블록 계승(운영자 260714 "텍스트 입력창엔 항상 토글 버튼 3개") */
  .scnwrap { position:relative; }
  .scnclip { position:absolute; top:0; right:14px; transform:translateY(-50%); display:grid; place-items:center; width:26px; height:26px; padding:0; z-index:5; opacity:.6;
    border-radius:50%; border:1px solid rgba(255,255,255,.17); background:rgba(26,28,26,.3); color:var(--mut); cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
    -webkit-backdrop-filter:blur(var(--blur-m)) saturate(1.3); backdrop-filter:blur(var(--blur-m)) saturate(1.3); -webkit-tap-highlight-color:transparent; transition:transform var(--dur-fast), color var(--dur), border-color var(--dur); }   /* G1 글래스모피즘 · raw-ok: k.html .scnclip 동일값 계승(blur13 — 픽셀 패리티) */
  .scnclip svg { display:block; width:13px; height:13px; }
  .scnclip::before { content:""; position:absolute; inset:-8px; }
  .scnclip:hover { color:var(--fg); border-color:rgba(255,255,255,.27); }
  .scnclip:active { transform:translateY(-50%) scale(var(--press-xs)); }   /* 픽토 소형 버튼 눌림 = press-xs 티어 계승 */
  .scnclip.scn-pp { right:46px; }
  .scn-copy { right:78px; }
  .scn-hide { display:none; }
  .scn-erase { right:14px; }
  .scn-erase.scn-off { opacity:.3; pointer-events:none; }
  .scn-erase.scn-undo { color:var(--fg); border-color:rgba(255,255,255,.34); }
  /* ── 상단 도크 = thumb 카드 생성 정본 이식(운영자 260721 "미리보기 화면·생성 버튼까지 그대로 가져와" — 미리보기+발사 한 블록 상단 고정) ── */
  .topdock { position:sticky; top:0; z-index:6; margin:-16px -16px 0; padding:18px 16px var(--sp-2); background:#121212; }   /* 상단 패딩 16→18 = 미리보기 프레임 y=20 통일(운영자 260731 22차 · thumb 편집 도크 sp-3 동값) */   /* raw-ok: thumb .topdock 정본 exact(mat 액자 16/16/sp-2 · 좌우 -16 브레이크아웃 · 스포티파이 블랙 · z6) · 상단 -16 = 모달 정합(운영자 260723 "번역만 아래로 처짐" — thumb는 부모 브릿지가 .panel margin-top:-16 주입해 도크 top=2px인데 tr 전용 프레임엔 미주입이라 top=18px로 16px 처졌던 것 · tr은 .panel 없이 도크가 wrap 첫 자식 = 도크 자체에 -16으로 동일 top 2px 달성 · 실측 정합) */
  .topdock::after { content:''; position:absolute; top:100%; left:0; right:0; height:14px; pointer-events:none; background:linear-gradient(180deg, rgba(18,18,18,.7), rgba(18,18,18,0)); }   /* raw-ok: 하단 페이드 스커트 = thumb .topdock::after exact(h14 · mat RGB 알파변주) */
  .topdock .makerow { margin-top:0; }   /* 미리보기↔발사버튼 gap = .cpprev margin-bottom(sp-2) 전담(thumb 정본) */
  .cpprev { position:relative /* 레일 앵커(운영자 260802 2차 "네비게이션바를 우측으로") = thumb .cpprev 정본 동기 — 레일이 창 밖 우측에 서려면 창(overflow:hidden)이 아닌 부모가 기준 */; margin:0 0 var(--sp-2); }   /* thumb .cpprev 정본(하단 sp-2 = 발사버튼과 gap) */
  .cpprev-box { position:relative; width:var(--pvw); margin-inline:auto /* 창 = 상시 이 크기(운영자 260802 2차 "미리보기가 확대되는거 없애고 이정도를 항상 유지") — 값 52%·중앙정렬 = thumb 도크 정본 동값 사본(카드 생성 탭과 같은 얼굴) · 확대는 돋보기 버튼(.dockzoom)만 */ /* 전폭 = thumb 도크 정본 재동기(운영자 260802 "모든 페이지에 해당 미리보기 똑같이") — 구 calc(100% - 8.8em - 6px)는 thumb **2분할 시절** 우 옵션 컬럼 예약폭 사본인데, 그 컬럼이 260802 코너 레일로 들어가며 thumb 자체가 전폭 1단이 됐다 = 사본만 남으면 번역 탭 미리보기가 홀로 좁다 */; height:auto; aspect-ratio:1/1 /* 폭 기준 1:1 고정비 = thumb .cpprev-box 정본 동값(운영자 260801 플레이그라운드 선택값 · 구 9/16은 2분할 폭 전제) */; contain:size /* 내용물 크기 무시 = 틀 불변(thumb 정본 동반 선언) */; min-height:0; background:#121212; border:1px solid transparent /* 테두리 '삭제' = 선 색만 투명(폭 1px 유지 = 산식 무변동) = thumb 도크 정본 동일 처방 */; border-radius:var(--r-s); overflow:hidden; container-type:size; }   /* 통일 미리보기 프레임(운영자 260731 22차) — 정본 = thumb 편집 도크 · container-type:size = size 봉쇄 겸(스테이지 100cqh 산식 유지) */   /* raw-ok: thumb .cpprev-box 정본 exact(CII 「합성 미리보기 쉘」 · 높이캡 29svh/300 · 필러 스포티파이 블랙) */   /* container-type:size = AI 생성 .geni-prev .cpprev-box 정본 동일 추가분(260730) — 무대 폭 산식(100cqh)이 쉘 실높이를 읽는 근거 */
  .topdock.dockzoom .cpprev-box { width:var(--pvw); }   /* 돋보기 ON = 전폭(thumb 정본 동문) */
  .cpprev { --pvw:min(52%, 29svh, 300px); }   /* 폭 단일출처 = thumb 모달 도크 캡 exact 사본(카드 생성 탭과 같은 크기) */
  .topdock.dockzoom .cpprev { --pvw:min(100%, 58svh, 620px); }   /* 폭 단일출처 = 창 폭·레일 x가 같은 식(thumb 정본 동문) */
  .cpprev-box.dropping { border-color:rgba(var(--accent-rgb),.35); }   /* 드래그 오버 = 첨부 가능 힌트(thumb 정본 exact · 운영자 260716 "드롭 ㄱ") */
  /* ── 무대(스테이지) = AI 생성 `.geni-prev .cpprev-stage` 정본 exact 이식(운영자 260729 "AI 생성 이미지의 미리보기 부분과 같이 번역부분을 변경")
     ⚠ 구조 갭이었다: 번역엔 **스테이지가 없었다** — 빈 상태(.cpv-empty)가 무대를 겸하고, 사진이 들어오면 캔버스(#pv)가 *자기 비율로* 쉘을 채워 무대가 사라졌다.
     실측(260729 · 430px 도크): 1600×900 첨부 = #pv 396×288 → **비율 1.375**(원본 1.778) = 세로로 눌린 왜곡 + 선택 비율(4:5) 프레임이 화면에 아예 안 보임.

function trRatio() {   // 반환 = 세로/가로 배수(구 상수 CARD_RATIO 5/4의 자리) · 직접 = W:H 입력값
  if (arV === 'custom') { const w = +arW || 1, h = +arH || 1; return h / w; }
  const m = { '4:5': 5 / 4, '9:16': 16 / 9, '16:9': 9 / 16, '1:1': 1 };   // '1:1' = 프리셋 칩은 걷어냈지만(260727 공간확보) 옛 저장값이 들어와도 비율이 깨지지 않게 계산 맵엔 존치(폴백 || 5/4 앞단)
  return m[arV] || 5 / 4;
}
function trArCss() { const r = trRatio(); return (1 / r).toFixed(4) + ' / 1'; }   // aspect-ratio 문자열(가로/세로)
function trArApply() {   // 무대(빈 상태·결과 캔버스 컨테이너) 종횡비 반영 + 리드백·재합성
  const e = $('pvStage'); if (e) e.style.setProperty('--pv-ar', trArCss());   // 비율 소유자 = 무대의 커스텀 속성 1곳(--pv-ar · 260730) = CSS가 aspect-ratio와 무대 폭(두 축 contain 산식)을 이 값으로 동시 산출(AI 생성 geniApply 동문법) · 구 style.aspectRatio 직접대입은 폭을 못 물려 16:9 잘림이 남았다 — 무대(#pvStage · 260729 스테이지 신설분) — 구 소유자 #pvEmpty는 빈 상태 전용이라 사진 첨부 후엔 비율이 적용될 곳이 없었다(= AI 생성은 스테이지가 상주 소유 · geniApply 동문법)
  updSpec(); compose();
}

function setImage(file){
  if (!file || !file.type || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => { img = im; upd(); };
  im.src = url;
}

/* ── 옵션(밴드 스타일·글자 크기·폰트) — 편집 탭 .scard 워드칩 문법(운영자 260721) · 위임 핸들러 유지 · 변경 = 즉시 재합성 + 도크 요약 스트립 동기(thumb #editSpec 미러 문법) ── */
function updSpec(){   // 스트립 값 = 기본값이면 mut·비기본값(변경·적용)이면 accent 강조(thumb #editSpec updateGoSpec 정본 문법 계승 · 기본 = dark·40·참고 없음) — 부팅 무강조 = 첨부1 편집 탭 정합
  { const a = $('tsAr'); if (a) { a.textContent = arV === 'custom' ? ((+arW || '?') + ':' + (+arH || '?')) : arV; a.classList.toggle('on', arV !== '4:5'); } }   // 비율 = 기본 4:5면 mut · 바꾸면 accent(이 화면 리드백 문법 그대로)
  const st = $('tsStyle'); st.textContent = $('styleSeg').querySelector('.on')?.textContent || ''; st.classList.toggle('on', styleV !== 'dark');
  const fs = $('tsFs'); fs.textContent = String(fsV); fs.classList.toggle('on', fsV !== 40);
  const rf = $('tsRef'); rf.classList.toggle('on', !!ART); rf.setAttribute('aria-pressed', String(!!ART));   // 참고 자료 = 글자 자체가 토글(운영자 260729 "글자 자체를 온오프 토글로") — 값('없음'/'적용') 교체 폐지·라벨 점등이 상태 전담(카드 생성 #cnTog 문법 계승)   // 기사 불러왔는지 = 여기서 읽는다(운영자 260725) — 적용 accent / 미적용 mut
}
function seg(host, fn){
  host.addEventListener('click', e => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    host.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    fn(b.dataset.v);
  });
}
seg($('styleSeg'), v => { styleV = v; updSpec(); compose(); });
seg($('arSeg'), v => { arV = v; const w = $('arWrap'); if (w) w.classList.toggle('none', v !== 'custom'); trArApply(); });
$('arSeg').addEventListener('click', e => {   // 켜진 「직접」 재탭 = 프리셋 복귀(인라인 전환의 되돌아가기 정문 · 운영자 260727 "순간 바껴서"의 왕복 축)
  const b = e.target.closest('.ropt[data-v="custom"]'); if (!b || arV !== 'custom') return;
  e.stopPropagation();   // seg 버블 핸들러 차단 후 기본 비율 칩을 대신 눌러 상태·리드백을 한 경로로 되돌린다(값 로직 복제 0)
  const d = $('arSeg').querySelector('.ropt[data-v="4:5"]'); if (d) d.click();
}, true);   // 비율 세그 = 이 화면 세그 위임 정본 그대로(값 로직 복제 0)
function arFit(el) { if (el) el.style.width = Math.max(1, (el.value || '').length) + 'ch'; }   // 숫자칩 폭 = 값 길이 동기(index geniArFit 정본 미러) — 고정폭이면 「1 : 1」이 빈 상자처럼 벌어진다
['arW', 'arH'].forEach(id => { const el = $(id); if (!el) return; el.value = '1'; arFit(el);   // 값이 앉아 있는 상태로 시작(빈 placeholder 아님)
  el.addEventListener('input', () => { el.value = el.value.replace(/[^0-9]/g, '').slice(0, 2); arFit(el); if (id === 'arW') arW = el.value; else arH = el.value; if (arV === 'custom') trArApply(); });
  el.addEventListener('focus', () => el.select());   // 탭하면 그 자리가 비는 느낌 = 전체 선택 → 첫 타건이 덮어쓴다(운영자 260727)
  el.addEventListener('blur', () => { if (!el.value) { el.value = '1'; arFit(el); if (id === 'arW') arW = 1; else arH = 1; if (arV === 'custom') trArApply(); } }); });   // 직접 = 숫자 2자리(thumb 편집 탭 비율 직접입력 문법 계승)
(() => { const t = $('tsAr'); if (!t) return; const go = () => { const bs = [...$('arSeg').querySelectorAll('.ropt')]; const i = bs.findIndex(b => b.classList.contains('on')); (bs[(i + 1) % bs.length] || bs[0]).click(); };
  t.addEventListener('click', go); t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }); })();   // 스트립 값 = 그 자리 순환(정본 칩 대신 클릭 = tsStyle 문법 그대로)
// 스트립 값 = 그 자리 토글(운영자 260727 "글자 자체가 토글역할하게" · 레퍼런스 = thumb #editSpec 위임 문법 그대로) — 정본 칩(#styleSeg)을 대신 클릭 = 상태·발사 경로 1벌 유지(값 로직 복제 0)
(() => { const t = $('tsStyle'); if (!t) return; const go = () => { const bs = [...$('styleSeg').querySelectorAll('.ropt')]; const i = bs.findIndex(b => b.classList.contains('on')); (bs[(i + 1) % bs.length] || bs[0]).click(); };
  t.addEventListener('click', go); t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }); })();
$('bandFs').addEventListener('input', e => { fsV = +e.target.value; $('bandFsV').textContent = e.target.value; updSpec(); compose(); });
updSpec();   /* 부팅 표기 = 기본값(검정·40·참고 없음) — 스트립은 생성 전에 고정 노출(thumb 정본 축) */

/* ── 소머리 접이 = index #genidlg .geni-fold 배선 정본 exact 이식(운영자 260727 "두 탭 공통도 해결") — aria-expanded 토글 + aria-controls 지목 대상 inert 한 쌍(접힘 시 tab-order·SR 제거) ── */
document.querySelectorAll('.csec-fold').forEach(fold => fold.addEventListener('click', () => {
  const open = fold.getAttribute('aria-expanded') !== 'true';
  fold.setAttribute('aria-expanded', open ? 'true' : 'false');
  const sub = $(fold.getAttribute('aria-controls'));
  if (sub) { if (open) sub.removeAttribute('inert'); else sub.setAttribute('inert', ''); }
}));

/* ── 재생성 메시지 3버튼(k 문법: 붙여넣기·복사·지우개+되돌리기 — 구 밴드 입력 블록 계승) ── */
const noteTx = $('noteTx'), noteErase = $('noteErase'), noteCopy = $('noteCopy');
$('notePaste').innerHTML = PASTE_SVG; noteCopy.innerHTML = COPY_SVG; noteErase.innerHTML = ERASE_SVG;
let eraseBak = null, eraseTm = 0;
$('notePaste').addEventListener('click', async () => {
  try { const t = await navigator.clipboard.readText(); if (t) { noteTx.value = t; noteTx.dispatchEvent(new Event('input')); } } catch (_) { noteTx.focus(); }
});
noteCopy.addEventListener('click', () => { try { navigator.clipboard.writeText(noteTx.value); } catch (_) {} });
noteErase.addEventListener('click', () => {
  if (noteErase.classList.contains('scn-undo')) {
    noteTx.value = eraseBak || ''; noteErase.classList.remove('scn-undo'); noteErase.innerHTML = ERASE_SVG; clearTimeout(eraseTm);
  } else {
    eraseBak = noteTx.value; noteTx.value = '';
    noteErase.classList.add('scn-undo'); noteErase.innerHTML = UNDO_SVG;
    eraseTm = setTimeout(() => { noteErase.classList.remove('scn-undo'); noteErase.innerHTML = ERASE_SVG; noteTx.dispatchEvent(new Event('input')); }, 10000);
  }
  noteTx.dispatchEvent(new Event('input'));
});
noteTx.addEventListener('input', () => {
  const has = !!noteTx.value.trim();
  noteCopy.classList.toggle('scn-hide', !has);
  if (!noteErase.classList.contains('scn-undo')) noteErase.classList.toggle('scn-off', !has);
});

/* ── 참고 자료 — 번역 스탠스 근거(운영자 260721 "모델이 포커싱을 잡게 최신 수집 기사 또는 요약 자료 선택")
   목록 = 요약(articles.json 완성 요약 · 본문 = detail/<file>.json 지연 로드 = index 관례) + 수집(candidates.json 최신 수집 기사) 각 최신 6
   행 = thumb .job 정본(이미지 스튜디오 리스트 문법 — 구 ly 피커 피부 폐지) ── */
const artList = $('artList');
const artEntries = [$('pvRef'), $('refBtn')];   // 진입점 = 미리보기 좌반쪽(빈 상태) + 도구(사진 들어간 뒤) — 처음 = 고르기 · 두번째 = 변경(운영자 260725)
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plain = s => String(s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
async function openArts(){
  if (!artList.hidden) { artList.hidden = true; return; }   // 열려 있으면 접기(구 세그 버튼 토글 문법 그대로)
  artEntries.forEach(b => { b.disabled = true; });
  const rows = [];
  try {
    const r = await fetch('articles.json?_=' + Date.now());
    const raw = r.ok ? await r.text() : '[]';
    if (!/^\s*</.test(raw)) {   // SPA 폴백 HTML 가드(작업내역 로더 규약 정합)
      const j = JSON.parse(raw);
      (Array.isArray(j) ? j : (j.articles || [])).filter(a => a && a.title).slice(0, 6)
        .forEach(a => rows.push({ k: '요약', t: String(a.title), m: String(a.media || ''), file: a.file }));
    }
  } catch (_) {}
  try {
    const c = await (await fetch('candidates.json?_=' + Date.now())).json();   // 최신 수집 기사(수집함)
    (Array.isArray(c) ? c : []).filter(x => x && x.title)
      .sort((a, b) => String(b.published || '').localeCompare(String(a.published || ''))).slice(0, 6)
      .forEach(x => rows.push({ k: '수집', t: String(x.title), m: String(x.media || ''), u: /^https?:\/\//.test(String(x.url || '')) ? String(x.url) : '' }));   // 원문 URL 동봉 = 서버가 직접 읽어 본문 확보(운영자 260721 "서드파티 직접 읽기" · fetch_article 정본 축)
  } catch (_) {}
  artList.innerHTML = rows.length
    ? rows.map((r, i) => '<div class="job" role="button" tabindex="0" data-ref="' + i + '"><span class="jtxt"><span class="jt-tag">' + r.k + '</span>' + esc((r.m ? r.m + ' · ' : '') + r.t.slice(0, 52)) + '</span></div>').join('')
    : '<div class="geni-sum">불러올 자료가 아직 없어</div>';
  artList._rows = rows; artList.hidden = false;
  artEntries.forEach(b => { b.disabled = false; });
}
artEntries.forEach(b => b.addEventListener('click', openArts));
async function pickRef(el){
  const r = (artList._rows || [])[+el.dataset.ref]; if (!r) return;
  let body = '';
  if (r.file) { try { const d = await (await fetch('detail/' + encodeURIComponent(r.file) + '.json?_=' + Date.now())).json(); body = plain(d.body).slice(0, 900); } catch (_) {} }

    const L = chipLayout(ctx, String(c.t || ''), CHIP_FS, maxW);
    const bw = Math.min(L.w, maxW) + padX * 2, bh = L.lines.length * L.lh + padY * 2;
    let x = e ? Math.max(16, Math.min(Math.round(e.left), TR_W - bw - 16)) : 20;   /* 발췌 좌단 추종 */
    let y = e ? Math.round(e.bottom) + 10 : 24;   /* 발췌 리프트 바로 아래 */
    placed.forEach(r => { if (x < r.x + r.w && x + bw > r.x && y < r.y + r.h && y + bh > r.y) y = r.y + r.h + 7; });   /* 겹침 = 아래로 */
    if (y + bh > regionH - 6) y = Math.max(6, (e ? Math.round(e.top) : regionH) - bh - 10);   /* 바닥 넘침 = 발췌 위로 */
    placed.push({ x, y, w: bw, h: bh });
    ctx.fillStyle = OV_CHIP; ctx.fillRect(x, y, bw, bh);
    ctx.strokeStyle = OV_LINE; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, bw - 1, bh - 1);
    L.lines.forEach((ln, k) => { let tx2 = x + padX; const cy = y + padY + L.lh * (k + 0.5);   /* 4분할 중앙(높이) = middle 베이스라인 · lh 밴드 정중앙 */
      ln.forEach(tk => { ctx.fillStyle = tk.m === 'g' ? OV_EMPH : OV_TEXT; ctx.fillText(tk.tx, tx2, cy); tx2 += ctx.measureText(tk.tx).width; }); });
  });
  ctx.letterSpacing = '0px';
}
async function pollPlan(id){   /* k_out 폴링 문법 계승 — 커밋→Pages 배포 지연 포함 6분 캡 */
  for (let k = 0; k < 60; k++) {
    await new Promise(r => setTimeout(r, 6000));
    try { const r = await fetch(`tr_out/${id}/plan.json?t=${Date.now()}`, { cache: 'no-store' });
      if (r.ok) return await r.json(); } catch (_) {}
    try { const e = await fetch(`tr_out/${id}/error.log?t=${Date.now()}`, { cache: 'no-store' });
      if (e.ok) throw new Error('AI 생성 실패 — 잠시 후 다시 시도해줘'); } catch (er) { if (String(er.message).startsWith('AI')) throw er; }
  }
  throw new Error('대기 시간 초과(6분) — 잠시 후 다시');
}

/* ── 생성/재생성 발사 — 버튼 = thumb #go 정본 · 게이지 = conv/track glive 정본(gaugeStart/Done/Clear verbatim) ── */
const go = $('go'), autoSum = $('autoSum'), pvWait = $('pvWait'), pvSec = $('pvSec');
function gaugeStart(btn){ if (!btn) return; btn.classList.add('glive', 'firing'); requestAnimationFrame(() => requestAnimationFrame(() => btn.classList.add('grun'))); }
function gaugeDone(btn){ if (btn) btn.classList.add('gdone'); }
function gaugeClear(btn){ if (btn) btn.classList.remove('glive', 'firing', 'grun', 'gdone'); }
function aStat(t){ autoSum.hidden = !t; autoSum.textContent = t || ''; }
let goT0 = 0, goTick = 0;
const fmtT = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function goBusy(on){
  busy = on;
  if (on) {
    goT0 = Date.now();
    if (window.nmLoader) { go.innerHTML = nmLoader('solving','제작중…',{size:15,gap:7,fs:12.5}) + '<span class="gtime nm-shim"></span>'; }   // orb 1회 생성(매틱 재빌드 = 애니 리셋 방지 · 운영자 260723 Q463)
    const paint = () => { const t = fmtT((Date.now() - goT0) / 1000);
      if (window.nmLoader) { const gt = go.querySelector('.gtime'); if (gt) gt.textContent = t + (window.nmEta?nmEta.label('tr'):''); }   // 예상 = nmEta(시드 2분 → 실측 평균 수렴)   // orb 유지·시간만
      else go.innerHTML = '번역 중…<span class="gtime">' + t + '</span>';   /* 폴백(nmLoader 미로드 시만 — 상시 로드라 사문화) = 평문 · gdots 제거(로딩 SSOT 게이트) */
      pvSec.textContent = t; };
    paint(); goTick = setInterval(paint, 1000);
    gaugeStart(go); pvWait.hidden = false;
  } else {
    clearInterval(goTick); goTick = 0;
    go.textContent = fired ? '재생성' : '생성';   /* 2회차부터 = 재생성(운영자 260721 · thumb 문맥 라벨 전환 선례) */
    gaugeClear(go); pvWait.hidden = true;
  }
  upd();
}
go.addEventListener('click', async () => {
  if (busy) return;
  if (!img) { $('srcFile').click(); return; }   // 사진 없음 = 첨부 진입(thumb 편집 탭 #go !CIMG.b64→cFile.click 정본 문법 계승 · 버튼 상시 활성)
  goBusy(true); aStat('');
  try {
    if (ocrFor !== img) { ocrLines = await runOcr(); ocrFor = img; }   /* 같은 이미지 재생성 = OCR 재판독 생략 */
    if (ocrLines.length < 3) throw new Error('글자를 못 읽었어 — 더 선명한 문서 이미지로 시도해줘');
    const ctxPay = {};
    if (ART) ctxPay.art = ART;
    const note = noteTx.value.trim().slice(0, 500);
    if (fired) { ctxPay.redo = 1; if (note) ctxPay.note = note; }
    const r = await fetch('/api/tr', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ lines: ocrLines.map(l => ({ i: l.i, t: l.t })), ctx: ctxPay }), signal: AbortSignal.timeout(150000) })   /* 무응답 상한(운영자 260725) = 즉답 경로 최장(Opus 플랜 산출) 여유 · 초과 = 무한 대기 대신 실패 표기 */
      .catch(e => { throw new Error(e && e.name === 'TimeoutError' ? '서버 응답 지연 — 잠시 후 다시 시도해줘' : '네트워크 오류 — 연결 확인 후 다시'); });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) throw new Error(j.error || ('서버 오류 ' + r.status));
    const plan = j.plan ? j.plan : await pollPlan(j.id);   // 즉답 경로(유료 API 직결 · 운영자 260721 승인 — 수신 즉시 합성) · 없으면 워크플로 폴링 폴백(구독 무료)
    RESULT = { cut: composeOverlay(plan), band: String(plan.band || '').trim(), plan };   /* plan 보관 = compose에서 4:5 스케일로 칩 재합성 */
    if (window.nmEta) nmEta.done('tr', (Date.now() - goT0) / 1000);   // 예상 학습 = 성공 완료만(sb·k 배선 그대로 · 실패·초과 경로엔 안 넣는다 = 평균 오염 차단)
    fired = true;   // 내용칸은 처음부터 떠 있다(운영자 260727) = 여기서 열 것 없음 · fired는 버튼 라벨(생성→재생성)·payload.redo 분기 전담
    gaugeDone(go);
    await ensureCardFonts(); compose();   // 카드 폰트 지연 로드 완료 후 합성(캔버스 정본 서체 보장 · 구 document.fonts.ready = 미요청 폰트 누락으로 폴백 렌더되던 것 교정)
    aStat('✓ 완성 — 미리보기 확인 · 우상단 버튼 = PNG 저장');
  } catch (e) { aStat('✗ ' + e.message); }
  goBusy(false);
});

/* ── 저장(파일명 = KST 강제 · CLAUDE.md [12] — naive 로컬시각 금지) — 미리보기 우상단 도구(thumb .cpv-tool 문법) ── */
const dlBtn = $('dlBtn'); dlBtn.innerHTML = DOWNLOAD_SVG;
dlBtn.addEventListener('click', () => {
  if (!RESULT) return;
  const k = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Seoul' });   /* KST 강제 포맷 */
  const name = k.slice(0, 10).replace(/-/g, '') + '_' + k.slice(11, 19).replace(/:/g, '') + '_번역카드_v1.png';
  pv.toBlob(bl => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(bl); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
});

/* ── 갱신 ── */
function upd(){
  go.disabled = busy;   // 사진 유무로 비활성화 안 함 = thumb 편집 탭 정본(버튼 상시 활성·빈 상태 클릭=첨부) · busy(발사 중)만 잠금
  compose();
}
upd();
</script>
