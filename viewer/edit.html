<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>편집기</title>
<link rel="stylesheet" href="tokens.css">   <!-- 공유 구조토큰(§🎨 STAGE3·index :root 파생·색 제외) — ly/k/track/conv 동일 계승 -->
<link rel="stylesheet" href="nm-cards.css">   <!-- 다운로드·결과/이전제작 카드 공용 CSS SSOT(전 앱 단일정본 · 운영자 260731 "하나 바꾸면 다 연동") — 색·플레이트·✓팝 계약은 여기서만 고친다(인라인 사본 금지 · 인라인이 뒤라 남기면 이 SSOT가 죽음) -->
<link rel="stylesheet" href="nm-clip.css"><!-- 입력칸 클립 CSS SSOT(전 뷰어 공용) -->
<style>@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url(assets/fonts/pretendard.woff2) format('woff2-variations')}</style><!-- 본문 폰트 = index 정본 그대로 이식(운영자 260718 "이미지 스튜디오 통일 규격 → 비디오 스튜디오 정합" · thumb:10 이주 동문 — iframe이라 부모 index Pretendard 미상속 = 옵션 카드가 Image Studio와 글자부터 달랐던 원인 동일) · 자산·경로 = index @font-face 동일 · swap = 첫 페인트 무차단 -->
<style>
  /* 팔레트·폼 = conv/track(영상 도구) 계승 verbatim · 구조토큰은 tokens.css
     골격 B 지오메트리 = 운영자 260710 플레이그라운드 선택값{칩 라운드 --r-s(9) · 섹션 간격 --sp-3(18) · 스택 카드 간격 --sp-2(12)
     · 발사 40px(260711 2차) · 레시피 틴트 .04 · 비활성 흐림 .32 · 바텀시트 64% · 나머지 = 260711 선택값(작업이력 정본)} */
  :root{ --well:#0e0f11;   /* 인셋 웰(입력·코드박스 배경 — 7뷰어 공유 raw 추출 = 동값·픽셀 0 · 평의회 260713 ⑨) */
    --bg:#121212; --pan:#16171a; --line:#2a2c31; --line2:rgba(255,255,255,.06);   /* line2 = index :root 정본값 계승(sb Q165 동문 — 폴백 없는 var() 미정의 = 선언 통무효 · 도크 하단 구분선 소비) */ --fg:#eef7f0; --mut:#8fa697;
    --hist-accent:#FFE13D; --hist-rgb:255,225,61;   /* raw-ok: 골드레몬(index --accent-4 동값) — 260723 "전 웹앱 레몬 → 골드 통일"(운영자) · 구 라임 → 골드(index --accent-2 골드화 동조 · 4뷰어 색 비공유 인라인 정본 · 이 뷰어 --accent-4 미정의라 raw hex 계승) · 작업 내역 접기 마커 · 되돌림 = 구 라임값 복원 */
    --accent:#00EED2; --accent-rgb:0,238,210;
    --accent-4:#FFE13D; --accent-4-rgb:255,225,61;   /* raw-ok: index :root 정본 동값 exact 계승(골드레몬) — 공용 nm-cards.css(다운로드 SSOT)가 참조하는 토큰이라 전 뷰어 정의 필수(미정의 = var() 댕글링 = 다운로드 색 죽음) · 이후 값 동기 = build_design_mirror STAGE4 자동 전파(운영자 260731) */ --accent-dim:rgba(var(--accent-rgb),.13); --on-accent:#032322;
    --accent-2:#FFE13D; --accent-2-rgb:255,225,61;   /* 골드레몬 = index --accent-2 값 계승(260723 "전 웹앱 레몬→골드 통일" 동조 · 로컬 :root 인라인 = 뷰어 관례 · 팔레트 핀 게이트 대상) */
    --danger:#e23b2a; --danger-rgb:226,59,42; --warn:#FFE13D; --warn-rgb:255,225,61;   /* warn-rgb = index --accent-4-rgb 동값 계승(짝 토큰 · 맞춤법 교정 칩 = ly 정본 문법이 요구 · 260728 일원화) */
    --accent-5:#0FFD02; --accent-6:#FF5EC8; --bias-l2:#3a6ddb; --bias-l1:#38C6FF;   /* --bias-l1 = 260729 색 증설('스카이') 동반 로컬 계승 — 값 = index :root 정본 동값 */   /* 콘텐츠 산출물 색(index 값 계승 · ly/track 로컬 계승 관례 동형 · §핵심명령 3-b-1) = 자막 음영 색 선택지 견본·프리뷰 — :root 정본 정의는 게이트 미계수·컴포넌트는 var()만 */
    --press-pico:.72; --press-xs:.82; --press-s:.85; --press-m:.9; --press-l:.95;
  }
  @media (prefers-reduced-motion:reduce){ :root{ --press-pico:1; --press-xs:1; --press-s:1; --press-m:1; --press-l:1; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible, [role=button]:focus-visible, label.file:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing:-.2px /* raw-ok: 자간 = index body 정본 exact 계승(§디자인 letter-spacing WARN 통로) */; -webkit-font-smoothing:antialiased; }   /* 폰트 = index.html body 정본 문자단위 exact 계승(운영자 260718 이미지→비디오 스튜디오 정합 · thumb:33 동문 · 페이블 M1 판례: 구 시스템 스택[Segoe/Roboto 임의]+자간 누락 = 계승위반형) · 15px/1.6 유지 · 배경 = thumb body 정본 동문(구 radial 글로우 = 운영자 260722 "배경 투명도 다 다름" 이미지 스튜디오 통일로 회수 — 복원 = git 이력) */
  button, input, textarea, select { font-family:inherit; letter-spacing:inherit; }   /* 폼 활자 상속 강제 = thumb:39 정본 계승(운영자 260727 "같은 형태에 있는 애들은 다 같아야함" · 점검 v2 ③ — UA 기본 스택으로 새던 입력칸·버튼 봉합) */
  html.inmodal, html.inmodal body { background:transparent; }
  /* 스크롤바 표준 = 제작·합성(thumb) 이식(운영자 260713 "다 같게" — 구 260712 전면 숨김 대체) · 실제 보이는 바 = cscroll.js 오버레이(네이티브는 no-JS 폴백 · 색 변경 = viewer/cscroll.js) */
  html .cscroll, html .escroll { display:none !important; }   /* 스크롤바 표시 제거(운영자 260716 "이미지·영상 스튜디오 둘다 스크롤 없애") — 공유 cscroll 오버레이 + edit 전용 escroll(아래 사본 IIFE) 썸 둘 다 숨김·스크롤 동작/네이티브 숨김은 종전 · !important = 주입 <style>이 소스순 뒤라 재승리 필수(thumb 동문) · 복원 = 이 행 삭제 */
  html { scrollbar-width:none; -ms-overflow-style:none; scrollbar-color:rgba(255,255,255,.05) transparent; }   /* 스크롤바 폭 0 = 문서 끝 cscroll.js(오버레이 바) 주입값과 **첫 페인트부터 동일** — index 115행 정본 계승(구 thin은 cscroll 실행 전까지 네이티브 바가 폭을 차지했다가 주입 순간 0으로 풀려, 스크롤이 생긴 화면에서 콘텐츠가 통째로 옆으로 밀렸다 · 운영자 260726 index 픽토 점프[Q579]와 같은 축 · 데스크톱 클래식 스크롤바 환경 전용 = 헤드리스는 오버레이라 재현 불가) · no-JS 폴백 = head 끝 noscript */
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; height:0; display:none; }   /* 위 scrollbar-width:none의 웹킷 짝(cscroll.js 주입 규칙 계승) — 아래 공통 10px은 모달·내부 스크롤 표면 전용으로 존치 */
  ::-webkit-scrollbar { width:5px; height:5px; }   /* 두께 = 구 10 의 50%(운영자 260801) — 알약 실폭 = 5 - 테두리 1×2 = 3px(구 6px 의 50%) */
  * { scrollbar-width:none; }   /* 전면 소거(운영자 260803 5차 "이미지 스튜디오에 스크롤 없애줘 그냥" — 문서 바에 이어 **내부 표면(모달 목록·입력칸)까지** · 스크롤 동작은 유지·표시만 소거 = 260716 원지시 「이미지·영상 스튜디오 둘다」라 7표면 동반) — 크로미엄은 표준 프로퍼티가 지정되면 ::-webkit-scrollbar-* 를 무시 = 실화면은 이 줄이 담당 · no-JS 폴백(noscript)·타 뷰어 불변 */
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.05); border-radius:999px;
    border:1px solid var(--bg); background-clip:padding-box; }   /* 테두리(=바 여백)도 50%: 2→1 = 알약 실폭 3px 유지 */
  ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.08); background-clip:padding-box; }
  .wrap { max-width:600px; margin:0 auto; padding:18px max(16px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }   /* raw-ok: 좌우 16·상 18 = thumb/ly/k 3형제 계승(운영자 260712 "좌우 마진 붙은 것 수정" — 구 12/16은 영상 3탭 중 편집만 어긋남) · 발사 바 인라인이라 하단만 28 유지 · viewport-fit=cover 대응 = thumb .wrap env() 정본 계승(가로 노치 max 흡수·하단 가산 · 감사5 260718) */

  label.fl { display:block; font-size:var(--fs-label); color:var(--fg); font-weight:var(--fw-x); margin:16px 0 9px; }   /* 소머리 간격 = 이미지 모달 .csec 리듬 그대로(16/0/9 · 운영자 260712 6차 — 구 18/6) */
  label.fl::before { content:'• '; color:var(--accent); font-weight:var(--fw-b); }

  /* 소스 행 = 파일 픽토(좌·기존 .file 그대로 = 액티브 축소 포함) + URL(우) — 운영자 260710 "파일이 더 기본이니 좌측" */
  .srcwrap { padding-bottom:0; }   /* sticky 고정 해제(운영자 260712 "스크롤 내려도 위 파일 영역이 따라내려옴 해결" — 구 srcPin=pin(260711) 뒤집음 · 스크롤 비침 가림용 그라데 배경·z-index도 고정 전용이라 동반 제거) · 하단 여백 6→0(운영자 260712 5차 "소스 구간 마진 이상" — 섹션 간격은 .sech 상시 리듬(--sp-3+--sp-2)이 전담 = 이중 가산 제거) */
  .srcrow { display:flex; gap:10px; align-items:stretch; padding-top:2px; }
  .file { flex:0 0 84px; display:grid; place-items:center; padding:10px; border:1px dashed transparent; border-radius:var(--r-s); text-align:center; color:var(--accent); cursor:pointer; background:transparent; user-select:none; transition:transform var(--dur-fast) ease, background var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease; }
  .file svg { width:26px; height:26px; display:block; margin:0 auto; transition:transform var(--dur-fast) cubic-bezier(.2,.9,.3,1.25); }
  .file:active svg { transform:scale(var(--press-xs)); }
  .file.has { color:var(--fg); }
  .file .ftype { display:inline-grid; place-items:center; min-width:42px; height:22px; padding:0 7px; border-radius:6px; background:rgba(var(--accent-rgb),.14); color:var(--accent); font-size:11px; font-weight:var(--fw-x); letter-spacing:.4px; font-variant-numeric:tabular-nums; }   /* tabular+min-width 42 = 업로드 % 자릿수 지터 방지(평의회10) */
  .file .fname { font-size:11px; max-width:74px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; margin-top:3px; }
  .urlwrap { position:relative; flex:1; }
  input[type=url] { width:100%; height:100%; min-height:52px; padding:12px 40px 12px 12px; background:rgba(14,15,17,.55); border:1px solid var(--line); border-radius:var(--r-s); color:var(--fg); font:inherit; font-size:16px; }   /* raw-ok: iOS 자동줌 방지 하한(16px 미만 입력 포커스 = 강제 줌 · 감사2 260718) · 배경 = 이미지 모달 입력칸 정본(rgba .55 반투명 실크 · 운영자 260712 6차 — 구 var(--well) 불투명) */
  input:focus { border-color:rgba(var(--accent-rgb),.35); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08); outline:none; }
  input::placeholder { color:var(--mut); }
  .urlclip { position:absolute; top:50%; right:12px; transform:translateY(-50%); display:grid; place-items:center; width:26px; height:26px; padding:0; z-index:5; opacity:.6;
    border-radius:50%; border:1px solid rgba(255,255,255,.17); background:rgba(26,28,26,.3); color:var(--mut); cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
    /* 오버레이 backdrop-filter 없음 = 입력칸 위에 떠서 타이핑·포커스마다 그 밑 텍스트를 재샘플하며 번쩍이던 것(260701 판례) 차단 — index .askclip 정본 동문 계승 · 배경 링(.3)+border+inset로 버튼 형태 유지(운영자 260725 "콘텐츠 입력 누르면 번쩍거리는데 없애주라") */ transition:transform var(--dur-fast), color var(--dur), border-color var(--dur); }
  .urlclip::before { content:""; position:absolute; inset:-8px; }
  .urlclip svg { display:block; width:13px; height:13px; }
  .urlclip:active { transform:translateY(-50%) scale(var(--press-s)); color:var(--accent); border-color:rgba(var(--accent-rgb),.6); }

  /* 레시피 칩(원탭 프리셋 — ly '빠른' 행 승격 · 틴트 .10 = 운영자 선택값) */
  .recrow { display:grid; grid-template-columns:repeat(auto-fit, minmax(0,1fr)); gap:6px; margin:var(--sp-1) 0 var(--sp-2); }   /* 균등 N분할(운영자 260712 "4개면 4분할·글자폭 쏠림 금지" · auto-fit = 칩 수 변해도 등분·비고정) */   /* 칩 간격 6(--sp-1) · 레시피↔첫 섹션 하단 여백 12(--sp-2 · 운영자 260712 세로 리듬 — 구 무여백은 '1 리사이징'이 칩에 붙음) */
  .rec { height:var(--btn-sm); min-width:0; padding:0 4px; display:flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; border-radius:var(--r-s); border:1px solid rgba(var(--accent-rgb),.3); background:rgba(var(--accent-rgb),.04); color:var(--fg); font-weight:var(--fw-x); font-size:var(--fs-label); font-family:inherit; cursor:pointer; transition:transform var(--dur-fast); }   /* 그리드 셀 중앙(운영자 260712 균등 분할) */
  .rec:active { transform:scale(var(--press-m)); }
  .rec .st { color:var(--accent); }

  /* 처리 스택(골격 B 심장) — 카드 = 최외곽 아님(내부 중첩)·간격 --sp-2(12 · 운영자 선택값) */
  .stack { display:flex; flex-direction:column; gap:var(--sp-2); }
  .scard { border:1px solid rgba(255,255,255,.06); border-radius:var(--r-s); background:rgba(255,255,255,.015); }   /* raw-ok: 화이트알파 .06/.015 = thumb .scard 정본 동문 바이트("edit .scard 정본 미러" 상호 미러 축) */   /* 카드 톤 = thumb .scard 정본 복원(운영자 260722 "기본적인 인터페이스를 공유해야함" — 카드↔카드 실측 정합: 금일 오전 '입력칸 톤(14,15,17,.55)' 통일이 thumb 카드와 어긋나던 것 반전 · 입력칸 톤 복원 = git 이력) */   /* 카드 라운드 9 = --r-s(운영자 260711 cardR — 내부 중첩 카드라 최외곽 --r-l 기틀 비대상) */
  .scard .hd { display:flex; align-items:center; gap:9px; padding:8px 13px; cursor:pointer;   /* 세로 8 = 운영자 260711 cardPadY 선택값(시안 실측 10에서 −2 — 구 10px는 미달·평의회 260711 3차 정정) */ user-select:none; }
  .scard .no { color:var(--accent); font-weight:var(--fw-x); font-size:var(--fs-xs); min-width:13px; font-variant-numeric:tabular-nums; }
  .scard .nm { font-weight:var(--fw-b); font-size:var(--fs-label); flex:none; padding-block:6px /* raw-ok: 라벨 세로 6 = index .geni-row>.pub-l·thumb .scard .nm 등고 장치 정본 동값 */; line-height:normal; }   /* 라벨 굵기 = Image Studio 카드 라벨 정본(thumb .scard .nm = index .pub-l exact · fw-b 700) 계승 — 구 fw-x 800 편차 정합(운영자 260718 스튜디오 정합) · 등고 장치(padding 6 + 상속 행간 차단) = 운영자 260802 "이미지·영상 스튜디오 옵션 행 높이 일치" — 이 장치 없이는 행 40px(라벨 20.8 = 13×1.6 상속)로 이미지 스튜디오 행 43px보다 3px 낮았다(실측) · 행 높이 산정자를 라벨 27px로 통일 = thumb .scard>.csec 행과 등고 */
  .scard .sum { color:var(--mut); font-size:var(--fs-xs); margin-left:auto; text-align:right; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; opacity:.4; }   /* 요약 흐림(운영자 260711 sumA) */

  /* 라이브 미리보기(비율 카드 귀속 · 운영자 260711 3분류 pvPlace=rsz — 파일 첨부 + 비율 카드 펼침 시) — 프레임 = 아래 .vstage 정의에 콤마 편승(신규 raw 0 · 계승) · 크기는 pvSync가 캔버스 비율로 산출 */

  .pvsec .trail .cpv-tool { position:static; width:100%; height:22px; display:grid; place-items:center; padding:0; color:var(--accent); border:0 /* ⚠ 260803: 이 규칙엔 border 해제가 없어 레일 버튼에 **UA 기본 버튼 테두리**가 그려졌다(구 `.cpprev-box .cpv-tool{border:0}`은 창 안 스코프라 레일에 안 닿는다) — 빈 상태에서 버튼이 hidden이던 시절엔 안 보였을 뿐 · thumb `.cpprev .cpv-tool` 정본엔 border:0이 있다 */; background:none; border-radius:0; filter:none; }   /* 레일 흡수 = thumb 정본(`.cpprev .cpv-tool` 260802) **값 사본** — 이 파일은 레일 앵커가 `.pvsec`인데 흡수 규칙만 `.cpprev-box` 스코프로 복사돼 **한 번도 적용된 적이 없었다**(실측 260802: 레일 안 교체·삭제 버튼 높이 18px = 형제 22px과 불일치 · 구 절대좌표 `#pvSwap right:42px`도 그대로 살아 있었다) · id·핸들러·hidden 토글 불변 */

const _ocRGB={};
function ocRGB(k){   // 음영 색 키 → 'r,g,b'(계산 스타일 실측 = var 토큰값 이중관리 0 · 색당 1회 메모) · 실패 = 검정
  if(_ocRGB[k]) return _ocRGB[k];
  try{ const p=document.createElement('i'); p.style.color=OC_DEF[k]||OC_DEF.black; document.body.appendChild(p);
    const m=(getComputedStyle(p).color||'').match(/(\d+),\s*(\d+),\s*(\d+)/); p.remove();
    return _ocRGB[k]=m?(m[1]+','+m[2]+','+m[3]):'0,0,0';

}
let _gfPre=false;
function loadPvFont(k){   // 미리보기 폰트 지연 로드(기본 고딕 = 로드 0 · 선택 시 1회) — 구글 웹폰트(gf) 또는 레포 동봉 파일(lf) · 실패/오프라인 = 폴백 스택 표시(근사 · 번인은 러너 실폰트라 무해)
  const f=FONT_PV[k]; if(!f||!(f.gf||f.lf)||f._l) return; f._l=true;
  if(f.lf){ try{ const face=new FontFace(f.fam,'url('+f.lf+')',{weight:f.lw||'400',display:'swap'}); face.load().then(x=>document.fonts.add(x)).catch(()=>{}); }catch(e){} return; }   // 레포 동봉 축(페이퍼로지) = FontFace 직로드(외부요청 0 · 실패 fail-soft = 구글 축과 동일 계약 · 260805)
  if(!_gfPre){ _gfPre=true; [['https://fonts.googleapis.com',''],['https://fonts.gstatic.com','anonymous']].forEach(([h,co])=>{   // 첫 선택 시 preconnect = DNS+TLS 선행
    const p=document.createElement('link'); p.rel='preconnect'; p.href=h; if(co)p.crossOrigin=co; document.head.appendChild(p); }); }
  const l=document.createElement('link'); l.rel='stylesheet'; l.href='https://fonts.googleapis.com/css2?family='+f.gf+'&display=swap'; document.head.appendChild(l);
}

function pvBlurBg(vv){   // 여백(블러) 선택 시 = 현재 프레임 스냅샷을 블러 배경으로(이중 비디오 디코드 회피 = 폰 부담 0 · 실물은 움직이는 블러 — 질감·배치 연출 목적 · 운영자 260712)
  const bg=document.getElementById('pvBg'); if(!bg) return;
  if(!(ON.screen&&P.fit==='blur')||!FILE_URL||!vv||!vv.videoWidth){ bg.hidden=true; return; }
  try{
    const sc=Math.min(1, 96/Math.max(vv.videoWidth,vv.videoHeight));
    const c=document.createElement('canvas'); c.width=Math.max(2,Math.round(vv.videoWidth*sc)); c.height=Math.max(2,Math.round(vv.videoHeight*sc));
    c.getContext('2d').drawImage(vv,0,0,c.width,c.height);

    bg.hidden=false;
  }catch(e){ bg.hidden=true; }
}

(function(){   /* 커스텀 오버레이 스크롤바(운영자 260712 3차) — cscroll.js 패턴 계승 사본(edit 전용 · 공유 cscroll은 thumb 불투명 계약이라 미수정): 트랙 = 끝라인 1px 실선 · 썸 = 강조색 30%(운영자 지정 알파 변주) · 썸 길이 = 콘텐츠 비례하되 트랙 높이 50% 상한(운영자) · 위아래 삼각형 버튼 없음 · pointer-events:none(터치 무방해) */
  var st=document.createElement('style');
  st.textContent='.escroll{position:fixed;top:0;right:0;width:7px;height:100%;z-index:99999;pointer-events:none;opacity:0;transition:opacity .3s;}'
    +'.escroll.on{opacity:1;}'
    +'.escroll::before{content:"";position:absolute;right:3px;top:0;bottom:0;width:0.5px;background:rgba(255,255,255,.04);}'   /* 실선 = 2배 얇게·2배 투명(운영자 260712 4차 — 알파 변주) */
    +'.escroll i{position:absolute;right:2px;top:0;width:3px;min-height:18px;border-radius:999px;background:rgba(var(--accent-rgb),.3);will-change:transform;}';
  document.head.appendChild(st);
  var bar=document.createElement('div'); bar.className='escroll'; var eth=document.createElement('i'); bar.appendChild(eth); document.body.appendChild(bar);
  var root=document.documentElement;
  function upd(){

    bar.classList.add('on');

    eth.style.height=h+'px';
    eth.style.transform='translateY('+Math.round((sp/(sh-ch))*(ch-h))+'px)';
  }
  addEventListener('scroll',upd,{passive:true}); addEventListener('resize',upd);
  if(window.ResizeObserver) new ResizeObserver(upd).observe(document.body);   // 카드 펼침 등 콘텐츠 높이 변화 동기
  upd();
})();

/* base64 폴백 상한 = **서버 실한도와 동값**(평의회2 260731). api/edit·framethumb은 `fileB64.length > 40_000_000`으로 거절하는데
   base64 길이 = 4*ceil(n/3) → 원본 실한도는 30,000,000 B(= 28.6MiB)다. 구 클라 가드는 `30*1024*1024`(31,457,280 B)라

   그것도 "파일은 ≤30MB"라는 **모순 문구**(사용자 파일은 29MB)로 떨어져 원인 파악이 불가능했다. 두 층을 한 값으로 묶는다. */

function legacyRead(f, btn){   // R2 미가용·실패 폴백 = 종전 base64 경로 그대로(≤B64_MAX · 회귀 0) · _lastFile 신선도 가드 = 연속 선택 last-writer 꼬임 방지(평의회7 F3)

function fireSegs(){   // n구간 발사 정규화(운영자 260728) — 유효(끝>시작+0.2s)만 · 정렬 · 겹침 병합 · 2자리 반올림 · ≤SEG_MAX(api 재검증 = 이중 방어) · 끝 공란 = 영상 끝까지

function renderMd(md) {

  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      let code = part; const nl = code.indexOf('\n');
      const first = nl >= 0 ? code.slice(0, nl).trim() : '';
      if (/^[a-zA-Z]+$/.test(first)) code = code.slice(nl + 1);
      code = code.replace(/\s+$/, '');
      html += `<div class="code"><button data-c="${encodeURIComponent(code)}" aria-label="복사" title="복사">${COPY_SVG}</button><pre>${esc(code)}</pre></div>`;
    } else {

        html += '<table>' + rows.map(r => {

          return '<tr>' + cells.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>';

        tbl = [];

      lines.forEach(line => {
        const t = line.trim();
        if (t.startsWith('|')) { tbl.push(t); return; }
        flush();
        if (!t) return;
        if (t.startsWith('### ')) html += `<h3>${esc(t.slice(4))}</h3>`;
        else if (t.startsWith('## ')) html += `<h2>${esc(t.slice(3))}</h2>`;
        else if (t.startsWith('# ')) html += `<h1 class="t">${esc(t.slice(2))}</h1>`;
        else if (t === '---') html += '<hr class="divider">';
        else html += `<p>${esc(t)}</p>`;
      });
      flush();
    }
  });

}

/* 토큰 예상 소요비(운영자 260723 Q456 — 완료 시 '누적 시간·예상 토큰비' 병기) · client 추정(파이프라인 수집 아님)
   claude 사용 = 자막 의역(d.sub)·클리퍼만 = 토큰 있음 · 순수 ffmpeg(음량·비율·해상도·프레임·컷·트림) = 토큰 0.
   계수 = 실계측 앵커(metrics/usage src=ly · opus · n=38 · 콜당 중앙 $1.12·평균 $0.87 · 영상 길수록↑) → 영상 분당 ~$0.4 · 1USD≈1380KRW.
   ⚠ 총 소요시간이 아니라 *영상 길이(d.dur)*에 비례(토큰 = 전사·의역 분량 종속 · ffmpeg 시간은 토큰 무관). */
const TOK_USD_PER_VMIN=0.4, USD_KRW=1380;
function estTokenKRW(d){
  if(!(d && d.sub)) return 0;   // 자막 번인 없는 잡 = claude 0(정직)
  const vmin=Math.max(.2,(d.dur||0)/60);
  const usd=Math.min(4, Math.max(.15, vmin*TOK_USD_PER_VMIN));
  return Math.round(usd*USD_KRW/50)*50;   // ₩50 단위 반올림
}
function estTokenNote(d){   // (구) 완료 메시지 꼬리 — 260728 부기 줄 이관으로 본문에선 미사용(호출부 잔존 시 회귀 0 위해 유지)
  const k=estTokenKRW(d);
  return (d&&d.sub)? ' · 예상 토큰비 ~₩'+k.toLocaleString('ko-KR') : ' · 토큰 0';
}
// 경과시간 표기 정본(운영자 260728 "항상 0분 00초로 · 00분일 수도 있으니 00분 00초") — 항상 두 자리 제로패딩.
//   1시간 넘으면 시(HH)를 앞에 붙인다(자막 잡은 MAX_DUR 상 드물지만 표기가 깨지지 않게).
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec || 0));
  const h = (sec/3600)|0, m = ((sec%3600)/60)|0, ss = sec%60, p = n => String(n).padStart(2,'0');
  return (h? p(h)+'시간 ' : '') + p(m)+'분 '+p(ss)+'초';
}
// 완료 부기(경과시간 좌측 아래) — 토큰·예상비용. **완료 후에만** 채운다(진행 중엔 실제 사용량을 알 수 없다 = 운영자 지시).

function dlVerify(href, btn){   // 저장 실패를 드러낸다(평의회7 260731)

  const fail=m=>{ st.innerHTML=ERR_SVG+' '+esc(String(m)); st.classList.add('err'); b.disabled=false; b.textContent='베스트컷'; };
  if(url && FILE_R2){ nmUpDrop(FILE_R2); FILE_R2=''; }   // URL 발사 = 첨부 R2 키 미소비 → 고아 정리(메인 발사 관례 계승)
  if(!url && !FILE_B64 && !FILE_R2 && _lastFile){   // 소진된 R2 키 재업로드(메인 발사 동형 — 러너가 잡 끝 원본 삭제 = 일회용)
    const f=_lastFile;
    try{ fileSlotPct(f,0); const up=await nmUpload(f,p=>{ if(_lastFile===f) fileSlotPct(f,p); }); FILE_R2=up.key; fileSlotName(f); }
    catch(err){ return fail('업로드 실패 — 다시 눌러줘'); }
  }
  const FT_O={n:2,scale:2,ar:'4:5'};
  const payload = url? {url, opts:FT_O} : FILE_R2? {r2key:FILE_R2, name:FILE_NAME, opts:FT_O} : {fileB64:FILE_B64, name:FILE_NAME, opts:FT_O};
  // 접수 무응답 상한 = 메인 발사(#editGo) 정본 관용구 그대로 계승(260731 29298db) — ⚠ 이 fetch에만 상한이 없어서
  //   응답이 안 오면 `b.disabled=true` + '추출 중'이 **영구 고착**했다(.catch가 영영 안 불림 = 새로고침 말고는 복구 불가).
  //   먹통 백신 goHeal은 #editGo만 회수하므로 이 형제 버튼은 백신 사각지대였다(평의회2 260731 High).
  const _ftSig=(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)?AbortSignal.timeout(payload.fileB64?180000:60000):null;
  fetch('/api/framethumb',Object.assign({method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}, _ftSig?{signal:_ftSig}:{}))
    .then(async r=>({r, j:await r.json().catch(()=>null)}))
    .then(({r,j})=>{
      if(!r.ok||!j||!j.ok){
        const _m=(j&&j.error)||('발사 실패 '+r.status);
        if(FILE_R2 && /업로드 키|업로드 파일이 없어|업로드 미설정/.test(_m)){ nmUpDrop(FILE_R2); FILE_R2=''; }   // 죽은 키만 폐기(메인 발사와 동일 규칙) — 429·5xx는 키가 멀쩡하니 보존해 재업로드를 막는다
        return fail(_m);
      }
      if(!url) FILE_R2='';   // 성공 = 키 소진(러너가 잡 끝에 원본 삭제 = 일회용)
      const t0=Date.now();
      (function tick(){
        if(Date.now()-t0>8*60000) return fail('시간 초과 — 잠시 뒤 다시 눌러줘');
        fetch('ft_out/'+j.id+'/frames.json?t='+Date.now()).then(rr=>rr.ok?rr.text():'').then(tx=>{
          let d=null; if(tx&&!/^\s*</.test(tx)){ try{ d=JSON.parse(tx); }catch(_){} }
          if(d&&d.state==='done'){ ftRender(d); b.disabled=false; b.textContent='베스트컷'; return; }
          if(d&&d.state==='failed') return fail(d.error||'추출 실패');
          setTimeout(tick, 7000);
        }).catch(()=>setTimeout(tick, 7000));
      })();
    })
    .catch(err=>{ const _to=(err&&(err.name==='TimeoutError'||err.name==='AbortError')); fail(_to?'접수가 응답이 없어 — 회선 확인하고 다시':'네트워크 오류 — 다시 눌러줘'); });   // 키 보존(구 `FILE_R2=''`) = 네트워크 실패는 키가 죽은 게 아니라 재업로드만 강요했다 · 문구 = 메인 발사 타임아웃 계승
});
function ftRender(d){
  const res=$('#ftRes'); res.innerHTML='';
  (d.frames||[]).forEach((f,i)=>{
    const it=document.createElement('div'); it.className='ftit';
    const im=document.createElement('img'); im.alt='베스트컷 '+(i+1); im.loading='lazy'; im.src=f.url;
    const dl=document.createElement('button'); dl.type='button'; dl.className='dlbtn ftdl'; dl.setAttribute('aria-label','스틸 저장'); dl.innerHTML=DOWNLOAD_SVG;
    dl.addEventListener('click',()=>{
      const name='bestcut_'+d.id+'_'+(i+1)+'.png';
      const a=document.createElement('a');
      if(/^https:\/\//.test(f.url)) a.href='api/dl?u='+encodeURIComponent(f.url)+'&n='+encodeURIComponent(name);   // R2 = api/dl 프록시(완성 영상 정본 동형)
      else a.href=f.url;   // git 폴백 = 같은 출처 상대경로
      a.download=name; const _href=a.href; document.body.appendChild(a); a.click(); a.remove();
      dl.classList.add('dl-done');
      dlVerify(_href, dl);   // 사후 검증(평의회7 260731 — 베스트컷 스틸도 동일 위장 경로)
    });
    it.appendChild(im); it.appendChild(dl); res.appendChild(it);
  });
}

/* ══ 과거 작업 열기(openJob) — 완료 푸시 딥링크(#done=<id>)와 작업 내역 게시판 공용(260712) · video.json → 결과 표시(+자막 편집기 활성) / clips.json → 클립 후보 목록 / error.log → 사유 표시 · 반환 = 볼거리(영상·후보)를 열었는지 ══ */
async function openJob(id){
  EDIT_ID=id;
  const st=$('#cstatus');
  try{
    const r=await fetch('ly_out/'+id+'/video.json?t='+Date.now());
    if(r.ok){ const tx=await r.text();
      if(tx&&!/^\s*</.test(tx)){ let d=null; try{ d=JSON.parse(tx); }catch(e){}
        if(d&&d.url){ showResult(d,0); await editSubsInit(id); return true; }   // 과거 잡도 자막 편집기 활성(B-2 딥링크 동일) · await = 자막 라우팅(#vwrap→#lyBurn) 완료 후 반환 = 포커싱이 최종 화면 잡음
        if(d&&(d.error||d.skip)){ st.innerHTML=ERR_SVG+' '+esc(String(d.error||d.skip)); st.classList.add('err'); return false; } } }
    const rc=await fetch('ly_out/'+id+'/clips.json?t='+Date.now());   // 클리퍼 잡 — 후보 목록 직행(260711)
    if(rc.ok){ const tc=await rc.text();
      if(tc&&!/^\s*</.test(tc)){ let dc=null; try{ dc=JSON.parse(tc); }catch(e){}
        if(dc&&Array.isArray(dc.clips)){ showClips(dc); return true; } } }
    const rk=await fetch('ly_out/'+id+'/cuts.json?t='+Date.now());   // 컷 미리보기 잡 — 자를 곳 목록 직행(260727 ③)
    if(rk.ok){ const tk=await rk.text();
      if(tk&&!/^\s*</.test(tk)){ let dk=null; try{ dk=JSON.parse(tk); }catch(e){}
        if(dk&&Array.isArray(dk.rm)){ showCuts(dk, id); return true; } } }
    const er=await fetch('ly_out/'+id+'/error.log?t='+Date.now());
    if(er.ok){ const em=await er.text();
      if(em&&em.trim()&&!/^\s*</.test(em)){ st.innerHTML=ERR_SVG+' '+esc(em.trim().slice(0,160)); st.classList.add('err'); return false; } }
    // ── R2 즉시조회 폴백(평의회3 260731) ──
    //   위 4연타는 전부 **Pages 정적 경로**라, 러너가 R2에 올린 결과가 아직 git 커밋 → Pages 빌드를 안 거쳤으면
    //   전부 404다. 260728에 그 배포 대기(674초 잡 중 491초 = 73%)를 없애려고 `GET /api/edit?stat=`을 신설했는데
    //   **폴 경로(1622행)만 그걸 쓰고 openJob은 안 썼다** — 과거 작업 열기·완료 푸시 딥링크가 여기로 들어온다.
    //   그래서 영상이 R2에 멀쩡히 있고 1콜이면 나오는데도 "결과를 못 찾았어"를 띄웠다. 게다가 edit-make.yml의
    //   배포 게이트 2곳(180s 폴백·8분 미확인)은 `::warning::`만 남기고 통과하며 그 근거로 "뷰어 재시도 사다리가
    //   커버"를 들고 있었는데, 이 경로엔 그 사다리가 **존재하지 않았다**(주석이 사실과 달랐다).
    try{
      const rs=await fetch('/api/edit?stat='+encodeURIComponent(id)+'&t='+Date.now(), {cache:'no-store'});
      if(rs.ok){ const ts=await rs.text();
        if(ts&&!/^\s*</.test(ts)){ let ds=null; try{ ds=JSON.parse(ts); }catch(e){}
          if(ds&&ds.url){ showResult(ds,0); await editSubsInit(id); return true; }
          if(ds&&(ds.error||ds.skip)){ st.innerHTML=ERR_SVG+' '+esc(String(ds.error||ds.skip)); st.classList.add('err'); return false; } } }
    }catch(e){ /* 미바인딩·장애 = 아래 안내로(회귀 0) */ }
    for(const kk of ['clips','cuts']){   // 스캔 산출 R2 즉시 열람(운영자 260731 "클립·컷도 즉시" — 위 ?stat 영상 폴백의 스캔판 · 러너 'R2 즉시 게시' 스텝과 한 쌍 · 실패 = 아래 안내 그대로)
      try{
        const rq=await fetch('/api/edit?stat='+encodeURIComponent(id)+'&k='+kk+'&t='+Date.now(), {cache:'no-store'});
        if(rq.ok){ const tq=await rq.text();
          if(tq&&!/^\s*</.test(tq)){ let dq=null; try{ dq=JSON.parse(tq); }catch(e){}
            if(kk==='clips'&&dq&&Array.isArray(dq.clips)){ showClips(dq); return true; }
            if(kk==='cuts'&&dq&&Array.isArray(dq.rm)){ showCuts(dq, id); return true; } } }
      }catch(e){ /* 개별 종류 실패 = 다음 종류 시도 */ }
    }
    st.textContent='결과를 못 찾았어 — 진행 중이면 완성 후 다시 열어줘';
  }catch(e){ st.textContent='결과 불러오기 실패 — 새로고침해줘'; }
  return false;
}

/* ══ 완료 푸시 딥링크(?done=<id> · 구 #done 호환) — 알림 탭 = 그 작업 결과로 직행+강조(thumb 정본 계승 · 발송 = edit-make 완료 푸시 스텝) ══ */
function edFocusResult(tries){   // 완성 결과 컨테이너로 스크롤+강조 = '그 작업' 핀포인트(thumb flashEl 미러). 우선순위 = 자막영상(#lyBurn) > 편집영상(#vwrap) > 클립(#cliplist) > 자막탭(#lyTabs) > 개요(#out) — editSubsInit(subs.md 라우팅)이 async라 보일 때까지 짧게 폴
  const el=['#lyBurn','#vwrap','#cliplist','#cutlist','#lyTabs','#out'].map(s=>$(s)).find(e=>e&&!e.hidden&&e.offsetParent!==null);
  if(el){ try{ el.scrollIntoView({behavior:LY_RM.matches?'auto':'smooth',block:'center'}); }catch(e){}
    el.classList.add('edfocus'); setTimeout(()=>el.classList.remove('edfocus'),2200); return; }
  if(tries>0) setTimeout(()=>edFocusResult(tries-1),200);   // 아직 라우팅 전 = 재시도(캡 ~1.6s)
}
(function(){
  const q=(location.search.match(/[?&]done=([\w-]+)\b/)||[])[1];   // ?done= = 정본(Cloudflare Access 재로그인 하드 리다이렉트서 해시는 유실·쿼리는 생존 · thumb 260710) · 패턴 = thumb doneReq [\w-] 통일(Q176 — 구 12-6 하드코딩은 id 형식 변경 시 침묵 미착지·경로 주입은 [\w-]가 동일 차단)
  const h=(location.hash.match(/^#done=([\w-]+)$/)||[])[1];        // #done= = 기 발송 알림 호환
  const id=q||h; if(!id) return;
  USER_ACT=true; pendClear();   // 딥링크 = pend 재개보다 우선(그 작업 확정 랜딩)
  (async()=>{ if(await openJob(id)) edFocusResult(8); })();   // 결과 열리면 완성 화면으로 이동+강조
})();

/* ══ 재개(pend) — conv 문법(24h 게이트·폴 창 클램프·신선도 분리) ══ */
(function(){
  const p=pendGet(); if(!p||!p.id||USER_ACT) return;
  if(Date.now()-(p.t0||0)>24*3600e3){ pendClear(); return; }
  const t0c=Math.max(p.t0||0, Date.now()-BUDGET*1000);
  pollEdit(p.id, t0c, (p.t0||0)-90000, p.lbl||'편집 중', p.clip?'clip':p.cutscan?'cutscan':'');   // 컷 미리보기 재개(260727)   // 재개 표기 = 대기 스테이지(wmsg)만 — 버튼 상주 라벨(goWait) 폐지(260712)
})();

render();   // 초기 렌더(빈 스택 = 운영자 260711 stackInit=empty 유지) — ⚠ 구 recipe('reels') 제거 때 이 초기 렌더 트리거까지 사라져 '처리 추가' 시트가 빈 채 열리던 회귀(운영자 260712 스샷 실증) 봉합: 프리필 없이 render()만 복원(스택·시트·eta·요약 전부 이 호출이 첫 페인트)

// ── 작업 내역 게시판(운영자 260712 "이미지 생성기처럼 최근·기존 제작 라이브러리화" · 자막 탭 260707 게시판 원문 계승) — ly_out/index.json(서버측 = 기기간 공유·만료 없음) 로드 · 행 = 일시(KST)·라벨·길이·상태 · 탭 = openJob(과거 산출 상시 재열람 — 종전엔 pend 24h·푸시 딥링크뿐이라 시간 지나면 접근 불가였던 공백 봉합) · 자막-전용(subs) 잡 = 자막 탭 전담이라 제외 ──
let _jlSig='',_jlBusy=false;   // 무변경 감지 시그니처(재렌더 억제 = 깜빡임·스크롤 튐 0 · thumb pollServerHist sig 게이트 미러) + in-flight 가드(폴·수동 새로고침 동시 발동 코얼레싱)
const _r2Extra=new Map(),_jlIds=new Set();   // R2 즉시 발견 id→종류(video|clips|cuts · Pages 인덱스 합류 전 임시 행) · 인덱스 렌더 완료 id(합류 = 임시 축 자연 소거 — 같은 id는 인덱스 행이 대체)
async function loadJobLib(){   // 재호출 가능(구 1회성 IIFE → 부모 셸 헤더 새로고침 #toolRf 훅 + 10s 자동 폴 · 운영자 260731 "동기화가 십초 단위로") — 서버 인덱스 재fetch = 타 기기·타 플랫폼 제작분 수신
  if(_jlBusy) return; _jlBusy=true;
  try{
    let jobs=null, tx='x';   // tx 'x' = 인덱스 무소득 표식(sig 축 — thumb pollServerHist 'x' 문법 미러)
    try{
      const r=await fetch('ly_out/index.json?t='+Date.now());
      if(r.ok){ const ct=(r.headers.get('content-type')||'').toLowerCase(); const t=await r.text();
        if(t&&!ct.includes('text/html')&&!/^\s*</.test(t)){ const p=JSON.parse(t); if(Array.isArray(p)){ jobs=p; tx=t; } } }   // SPA 폴백(HTML 200)·불량 응답 = 무소득 취급(정상 sig 안 잠금)
    }catch(e){ /* 미배포·오프라인 = 무소득 — R2 즉시 발견분만이라도 아래서 렌더(260731 보강: 구 조기 return이 인덱스 결손 시 즉시분까지 삼켰다) */ }
    const vids=(jobs||[]).filter(j=>j&&j.st!=='subs');   // 영상 산출·클립 후보·실패·진행만(자막-전용 잡 제외)
    vids.forEach(j=>{ if(j&&j.id) _jlIds.add(j.id); });   // 인덱스 보유 id 등재 = R2 임시 행과 중복 차단(합류 시 인덱스 행이 대체)
    const XK={video:{t:'편집 영상',st:'done'},clips:{t:'클립 후보',st:'clip'},cuts:{t:'컷 후보',st:'cut'}};   // R2 발견 종류 → 임시 라벨·상태(인덱스 ST 축과 동일 어휘)
    const extra=[..._r2Extra].filter(([id])=>!_jlIds.has(id)).map(([id,k])=>({ id, ts:'20'+id.slice(0,2)+'-'+id.slice(2,4)+'-'+id.slice(4,6)+'T'+id.slice(6,8)+':'+id.slice(8,10)+':'+id.slice(10,12), t:(XK[k]||XK.video).t, d:0, st:(XK[k]||XK.video).st }));   // R2 즉시 발견분 임시 행(운영자 260731 · 스캔 산출 합류 = clips/cuts 260731 2차) — 시각 = id 12자리 KST 도장 절단(인덱스 ts와 동일 문자열 문법) · 라벨·길이는 배포 합류 시 인덱스 값으로 자연 교체
    const all=extra.concat(vids);   // 임시(최신) 먼저 — 인덱스 최신순 유지
    if(!all.length) return;   // 빈 목록 = 조용한 공백(§디자인 빈 상태) — 재진입 시에도 기존 표시 유지(축소 스테일은 수용)
    const sig=tx+'|'+extra.map(e=>e.id).join(',');   // 인덱스 원문 + 임시 행 구성 = 통합 무변경 감지(어느 축이 바뀌어도 재렌더 · 둘 다 그대로면 skip = 깜빡임 0)
    if(sig===_jlSig) return;
    _jlSig=sig;
    const box=$('#lyJobs'), list=$('#lyJobList'); if(!box||!list) return;
    list.textContent='';   // 재진입 = 비우고 재렌더(중복 누적 차단 · 접힘/펼침 상태는 list.hidden에 그대로 보존)
    const ST={done:'완료',clip:'클립 후보',cut:'컷 후보',fail:'실패',gen:'진행중'};   // cut 합류(260731) = build-viewer 인덱서가 cuts.json을 읽게 된 짝 — 이게 없으면 완료된 컷 스캔이 `ST[j.st]||'진행중'` 폴백으로 다시 "진행중" 거짓말이 된다
    all.slice(0,60).forEach(j=>{   // 캡 20→60(전체 보관 취지 정합 · 운영자 260712 "항상 기존 작업분" — 인덱스 자체는 만료 없음)
      if(!/^[A-Za-z0-9_-]+$/.test(j.id||'')) return;   // 경로 화이트리스트(복원 정규식과 동일 정신)
      const b=document.createElement('button'); b.type='button'; b.className='lyjob';
      const ts=String(j.ts||'');
      b.innerHTML='<span class="jts"></span><span class="jt"></span><span class="jts jdur"></span><span class="jst"></span>';
      b.querySelector('.jts').textContent=ts.length>=16? ts.slice(5,10)+' '+ts.slice(11,16):'';   // KST 도장 ISO를 문자열 절단 = 'MM-DD HH:MM'(TZ 재해석 함정 0 · §📐 KST)
      b.querySelector('.jt').textContent=j.t||'편집 영상';
      b.querySelector('.jdur').textContent=j.d? mmss(j.d):'';   // 길이 = 시각과 동급 보조정보(.jts 스타일 재사용 = 신규 CSS 0)
      const stEl=b.querySelector('.jst'); stEl.textContent=ST[j.st]||'진행중'; if(ST[j.st]) stEl.classList.add(j.st);
      b.onclick=async()=>{
        if(_polling) return;   // 생성 진행 중 = 진행 UI 보호(자막 탭 LY_GEN 게이트 계승)
        USER_ACT=true;
        if(await openJob(j.id)){   // 결과는 게시판보다 위(vwrap·cliplist)에 그려짐 — 열린 곳으로 시선 이동
          const tgt=(!$('#vwrap').hidden && $('#vwrap'))||(!$('#cliplist').hidden && $('#cliplist'))||null;
          if(tgt) tgt.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'center'});
        }
      };
      list.appendChild(b);
    });
    if(list.children.length){
      box.hidden=false;
      $('#lyJobsCnt').textContent='('+list.children.length+')';
      // 접기 토글 — thumb '이전 제작' histH 로직 계승(기본 접힘 · 펼침 = 스태거 촤르륵 + 섹션 랜딩 · 닫힘 = histOut 후 hidden · 운영자 260712). 닫힘 시 상단 복귀는 미계승(편집 폼 맥락 = 제자리 유지 · 의도 divergence)
      let closeT=null;
      $('#lyJobsH').onclick=()=>{
        const open=list.hidden;
        clearTimeout(closeT); list.classList.remove('closing');   // 닫힘 중 재클릭 = 취소(다시 펼침)
        $('#lyJobsH').setAttribute('aria-expanded',String(open)); box.classList.toggle('open',open);
        const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
        if(open){ list.hidden=false; requestAnimationFrame(()=>box.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'})); }
        else if(rm){ list.hidden=true; }
        else { list.classList.add('closing'); closeT=setTimeout(()=>{ list.hidden=true; list.classList.remove('closing'); },270); }   // .26s 애니 + 여유(thumb 동값)
      };
    }
  }catch(e){} finally{_jlBusy=false;}
}
let _r2eBusy=false;   // R2 즉시 발견 폴 in-flight 가드
async function pollR2RecentEdit(){   // R2 즉시 발견(운영자 260731 "비디오 스튜디오도 즉시") — 최근 완성 영상 id를 배포 랙 없이 발견 → 임시 행. 열람 = openJob 기존 R2 폴백(?stat=)이 즉시 서빙 · Pages 인덱스 합류 시 정식 행으로 자연 교체
  if(document.hidden||_r2eBusy) return; _r2eBusy=true;
  try{
    const r=await fetch('/api/edit?recent=24'); if(!r.ok) return;
    const d=await r.json(); const items=(d&&Array.isArray(d.items))?d.items:[]; if(!items.length) return;
    let changed=false;
    for(const it of items){ const id=it&&it.id; if(!id||!/^[A-Za-z0-9_-]{1,64}$/.test(id)||_jlIds.has(id)||_r2Extra.has(id)) continue; _r2Extra.set(id,{video:1,clips:1,cuts:1}[it.k]?it.k:'video'); changed=true; }   // 종류(k) 동봉 = 임시 행 라벨·상태 + 열람 폴백 힌트(화이트리스트 밖 = video 취급)
    if(changed){ _jlSig=''; await loadJobLib(); }   // 신규 발견 때만 sig 리셋 + 재렌더(무변경 = 종전 게이트 그대로 = 깜빡임 0)
  }catch(e){ /* API 미가용 = 종전 Pages 인덱스 사다리 유지(조용한 폴백) */ } finally{_r2eBusy=false;}
}
loadJobLib().then(()=>pollR2RecentEdit());   // 부팅 = 인덱스 먼저(_jlIds 등재) → R2 발견(이미 인덱스에 있는 id 임시행 방지)
window.nmRefresh=()=>{ pollR2RecentEdit(); return loadJobLib(); };   // 부모 셸 헤더 새로고침(#toolRf · 운영자 260731) 훅 — 즉시(R2)·정식(Pages) 두 축 동시 재fetch
setInterval(()=>{ if(!document.hidden){ loadJobLib(); pollR2RecentEdit(); } },10000);   // raw-ok: 폴 주기(ms — 지속시간 토큰 아님) · 10s 자동 폴(운영자 260731 "동기화가 십초 단위로" — 타 기기·타 플랫폼 제작이 파일 이동 없이 자동 수렴) · visible 게이트 + sig 게이트(무변경 재렌더 0) + in-flight 가드 = thumb pollServerHist 문법 미러 · 대상 = Pages 정적 JSON(CDN) + R2 발견 1콜
// ── 미리보기 확대(돋보기) = viewer/tr.html `PVZOOM` 정본 동문 사본(운영자 260803 "카드 제작 부분과 동일하게") · 저장 차단 환경은 무저장 = 상시 축소(종전 동작) ──
const PVZOOM = { K: 'nm.pvzoom',
  get() { try { return localStorage.getItem(this.K) === '1'; } catch (_) { return false; } },
  set(on) { try { on ? localStorage.setItem(this.K, '1') : localStorage.removeItem(this.K); } catch (_) {} } };
(function () {
  const td = document.getElementById('topDock'), b = document.getElementById('cpZoom'); if (!td || !b) return;
  const paint = on => { td.classList.toggle('dockzoom', on); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.setAttribute('aria-label', on ? '미리보기 원상복귀' : '미리보기 확대'); b.title = on ? '탭=원상복귀' : '탭=미리보기 확대 · 다시 탭=원상복귀'; };
  paint(PVZOOM.get());
  b.addEventListener('click', () => { const on = !td.classList.contains('dockzoom'); paint(on); PVZOOM.set(on); });
})();
