<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>진짜예요 오버레이 — CI 아래 구분선 + 2줄 가운데정렬 시안</title>
<style>
  :root{
    --bg:#0b0d0c; --pan:#16171a; --line:#2a2c31; --fg:#eef7f0; --mut:#8fa697;
    --accent:#00EED2; --accent-rgb:0,238,210; --pg-warn:#FFE13D; --danger:#e23b2a;
    --r-s:10px; --r-m:14px; --sp-1:8px; --sp-2:12px;
    --cpv-white:#ffffff; --cpv-green:#0FFD02;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Noto Sans KR',system-ui,sans-serif;
    font-size:13px;line-height:1.5;padding:14px;padding-bottom:60px}
  h1{font-size:15px;font-weight:800;margin:0 0 4px}
  .sub{color:var(--mut);font-size:11.5px;margin:0 0 14px}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:1180px;margin:0 auto}
  @media(min-width:900px){.wrap{grid-template-columns:360px minmax(0,1fr);align-items:start}}
  .stage{background:var(--pan);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
  .frame{overflow:auto;max-height:70vh;border-radius:var(--r-s)}
  /* 릴스 9:16 무대 = thumb .cpprev-stage.reels 계승(순흑 배경) */
  .app{position:relative;width:100%;aspect-ratio:9/16;background:#000;overflow:hidden;
    font-family:'Noto Sans KR','Pretendard Variable',sans-serif}
  .app .wm{position:absolute;inset:0;background-size:cover;background-position:center;opacity:1}
  .app .scrim{position:absolute;left:0;right:0;bottom:0;top:0;
    background:linear-gradient(to bottom,rgba(0,0,0,0) 25%,rgba(0,0,0,.30) 55%,rgba(0,0,0,.585) 70%,rgba(0,0,0,.585) 100%)}
  .app .rule{position:absolute;background:#fff}
  .app .ln{position:absolute;left:0;right:0;white-space:pre;font-weight:800;color:var(--cpv-white)}
  .app .ln b{color:var(--cpv-green);font-weight:inherit}
  .baseline{margin-top:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:var(--r-s);
    color:var(--mut);font-size:11px;line-height:1.55}
  .baseline b{color:var(--fg)}
  .csec{background:var(--pan);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;margin-bottom:12px}
  .csec h2{font-size:12.5px;font-weight:800;margin:0 0 9px;display:flex;align-items:center;gap:6px}
  .csec h2 .b{color:var(--accent);font-weight:700}
  #presets{display:flex;flex-wrap:wrap;gap:7px}
  .pbtn{padding:7px 11px;border-radius:var(--r-s);border:1px solid var(--line);background:transparent;
    color:var(--mut);font:inherit;font-weight:700;font-size:12px;cursor:pointer;transition:.15s}
  .pbtn:hover{color:var(--fg)}
  .pbtn.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.55);
    box-shadow:0 0 0 1px rgba(var(--accent-rgb),.18) inset}
  .pbtn:active{transform:scale(.96)}
  .ax{display:grid;grid-template-columns:78px 1fr 62px;align-items:center;gap:8px;margin-bottom:9px}
  .ax label{font-size:11.5px;color:var(--mut);font-weight:700}
  .ax input[type=range]{width:100%;accent-color:var(--accent)}
  .ax .v{font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
  .ax .v.near{color:var(--accent)}
  .ax select{width:100%;background:#0e0f11;color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:5px 7px;font:inherit;font-size:11.5px}
  #out{width:100%;min-height:132px;background:#0e0f11;color:var(--fg);border:1px solid var(--line);
    border-radius:var(--r-s);padding:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;line-height:1.55;resize:vertical}
  .row{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
  .note{color:var(--mut);font-size:11px;line-height:1.6}
  .note li{margin-bottom:5px}
  .tag{display:inline-block;padding:1px 6px;border-radius:999px;font-size:10px;font-weight:800;
    background:rgba(var(--accent-rgb),.14);color:var(--accent);margin-left:4px}
  .tag.warn{background:rgba(255,225,61,.14);color:var(--pg-warn)}
</style>
</head>
<body data-pg-template="v1">

<h1>진짜예요 오버레이 — CI 아래 구분선 + 2줄 가운데정렬</h1>
<p class="sub">운영자 260726 「ci 아래로 진짜예요 써진 그 아래 라인 있지, 거기에 선분 쭉 그어서 그 아래로 2줄이 들어가는데, 가운데 정렬로」 · 무대 = 릴스 9:16 · 좌표계 = 산출물 1080 기준</p>

<div class="wrap">
  <div>
    <div class="stage">
      <div class="frame" data-pg-scrollhost id="frame">
        <div class="app" data-pg-preview id="pv"></div>
      </div>
      <div class="baseline" data-pg-baseline id="bl"></div>
    </div>
  </div>

  <div>
    <section class="csec" id="psec">
      <h2><span class="b">•</span> 프리셋</h2>
      <div id="presets" data-pg-presets></div>
    </section>

    <section class="csec">
      <h2><span class="b">•</span> 미세조정 (7축)</h2>
      <div id="axes" data-pg-controls></div>
    </section>

    <section class="csec" data-pg-copy>
      <h2><span class="b">•</span> 선택값 <span id="warnN"></span></h2>
      <textarea id="out" readonly></textarea>
      <div class="row">
        <button class="pbtn" id="copy">복사</button>
        <button class="pbtn" id="reset">현행으로 되돌리기</button>
      </div>
    </section>

    <section class="csec" data-pg-note>
      <h2><span class="b">•</span> 재현 한계 각주</h2>
      <div class="note" id="notes"></div>
    </section>
  </div>
</div>

<script>
// ── 현행 실측값(기본값 = 현행) — nomute_overlay.SPECS['reels'] + jinjja_reels_base.png 실측 ──
// 현행 = 구분선 없음 · 자막 좌측정렬(lm 101) · ty 1119 · fs 78 · lh 96
// CI 워터마크 잉크 = x362~721 / y1010~1154(가로 중앙 cx 541.5) — 이 아래가 "선분 그을 라인"
const CUR = { rule:0, ruleY:1180, ruleW:60, ruleH:3, ruleA:70, ty:1240, fs:78, lh:96, align:'center' };
const BASE_Y = { wmTop:1010, wmBot:1154 };   // 워터마크 잉크 상/하단(1080 기준 실측)

const AXES = [
  { k:'ruleY', lbl:'구분선 y',   min:1160, max:1260, step:2,  unit:'' },
  { k:'ruleW', lbl:'구분선 폭',  min:20,   max:100,  step:2,  unit:'%' },
  { k:'ruleH', lbl:'구분선 두께', min:1,    max:8,    step:1,  unit:'px' },
  { k:'ruleA', lbl:'구분선 알파', min:20,   max:100,  step:5,  unit:'%' },
  { k:'ty',    lbl:'첫 줄 y',    min:1190, max:1330, step:2,  unit:'' },
  { k:'fs',    lbl:'글자 크기',   min:56,   max:96,   step:2,  unit:'' },
  { k:'lh',    lbl:'줄간',       min:78,   max:120,  step:2,  unit:'' },
];

const PRESETS = {
  '현행(구분선 없음·좌측)': { ...CUR, rule:0, align:'left', ty:1119, fs:78, lh:96 },
  'A 얇은선·좁게':          { ...CUR, rule:1, ruleY:1184, ruleW:38, ruleH:2, ruleA:55, ty:1236, fs:78, lh:96 },
  'B 중간선·표준':          { ...CUR, rule:1, ruleY:1188, ruleW:56, ruleH:3, ruleA:70, ty:1244, fs:78, lh:96 },
  'C 굵은선·넓게':          { ...CUR, rule:1, ruleY:1190, ruleW:78, ruleH:5, ruleA:85, ty:1252, fs:78, lh:96 },
  'D 풀폭·마진100':         { ...CUR, rule:1, ruleY:1192, ruleW:82, ruleH:3, ruleA:60, ty:1250, fs:82, lh:100 },
};

let S = { ...PRESETS['B 중간선·표준'] };
const LINES = ['*진짜예요* 오버레이', '릴스형 발사 테스트'];
const H = 1920;

// near() = 현행 대비 계승 판정(±근접이면 accent 점등 = "현행 그대로")
function near(a, b, tol) { return Math.abs(a - b) <= (tol == null ? 0.5 : tol); }

function emph(s) {
  return s.replace(/\*([^*]+)\*/g, '<b>$1</b>');
}
function render() {
  const host = document.getElementById('frame');
  const keep = host ? host.scrollTop : 0;          // 재렌더 스크롤 보존(튕김 차단)
  const pv = document.getElementById('pv');
  const pct = n => (n / H * 100).toFixed(3) + '%';
  const fsz = n => 'calc(' + (n / 1080 * 100).toFixed(3) + ' * var(--pvw))';
  let h = '';
  h += '<div class="wm" style="background-image:url(../../assets/brand/jinjja_reels_preview.webp)"></div>';
  h += '<div class="scrim"></div>';
  if (S.rule) {
    h += '<div class="rule" style="left:' + ((100 - S.ruleW) / 2).toFixed(2) + '%;width:' + S.ruleW + '%;top:' + pct(S.ruleY)
       + ';height:' + S.ruleH + 'px;opacity:' + (S.ruleA / 100).toFixed(2) + '"></div>';
  }
  LINES.forEach((ln, i) => {
    h += '<div class="ln" style="top:' + pct(S.ty + i * S.lh) + ';text-align:' + S.align
       + ';font-size:' + fsz(S.fs) + ';line-height:1.15;'
       + (S.align === 'left' ? 'padding-left:' + (101 / 1080 * 100).toFixed(2) + '%;' : '')
       + '">' + emph(ln) + '</div>';
  });
  pv.innerHTML = h;
  if (host) host.scrollTop = keep;                 // scrollTop 복원
  document.getElementById('bl').innerHTML =
    '<b>현행</b> = 구분선 없음 · 자막 <b>좌측정렬</b>(lm 101) · 첫 줄 y 1119 · fs 78 · 줄간 96<br>'
    + '<b>지금 선택</b> = ' + (S.rule ? '구분선 y' + S.ruleY + ' / 폭' + S.ruleW + '% / 두께' + S.ruleH + 'px / 알파' + S.ruleA + '%' : '구분선 없음')
    + ' · 정렬 ' + (S.align === 'center' ? '가운데' : '좌측') + ' · 첫 줄 y' + S.ty + ' · fs' + S.fs + ' · 줄간' + S.lh + '<br>'
    + 'CI 워터마크 잉크 하단 = y' + BASE_Y.wmBot + ' → 구분선까지 여백 <b>' + (S.ruleY - BASE_Y.wmBot) + 'px</b>'
    + ' · 구분선 → 첫 줄 여백 <b>' + (S.ty - S.ruleY) + 'px</b>';
  syncOut();
}
function syncOut() {
  const chg = [];
  if (S.align !== 'left') chg.push('정렬 = 가운데(현행 좌측 lm101 폐기)');
  if (S.rule) chg.push('구분선 신설: y' + S.ruleY + ' · 폭 ' + S.ruleW + '%(중앙) · 두께 ' + S.ruleH + 'px · 흰색 알파 ' + S.ruleA + '%');
  if (!near(S.ty, 1119, 0)) chg.push('첫 줄 ty: 1119 → ' + S.ty);
  if (!near(S.fs, 78, 0)) chg.push('fs: 78 → ' + S.fs);
  if (!near(S.lh, 96, 0)) chg.push('lh: 96 → ' + S.lh);
  document.getElementById('out').value =
    '# 진짜예요 오버레이(릴스) — 선택값\n'
    + JSON.stringify({ rule: !!S.rule, ruleY: S.ruleY, ruleW: S.ruleW + '%', ruleH: S.ruleH, ruleAlpha: S.ruleA / 100,
                       align: S.align, ty: S.ty, fs: S.fs, lh: S.lh }, null, 1)
    + '\n\n# 현행 대비 변경점\n' + (chg.length ? chg.map(s => '- ' + s).join('\n') : '- 없음(현행 그대로)');
  const n = chg.length;
  document.getElementById('warnN').textContent = n ? '(' + n + '개 변경)' : '(현행 그대로)';
  document.getElementById('warnN').className = n ? 'tag warn' : 'tag';
}
function buildAxes() {
  const box = document.getElementById('axes');
  box.innerHTML = AXES.map(a =>
    '<div class="ax"><label>' + a.lbl + '</label>'
    + '<input type="range" id="ax_' + a.k + '" min="' + a.min + '" max="' + a.max + '" step="' + a.step + '" value="' + S[a.k] + '">'
    + '<span class="v" id="v_' + a.k + '">' + S[a.k] + a.unit + '</span></div>'
  ).join('')
  + '<div class="ax"><label>정렬</label><select id="ax_align"><option value="center">가운데</option><option value="left">좌측(현행)</option></select>'
  + '<span class="v" id="v_align"></span></div>'
  + '<div class="ax"><label>구분선</label><select id="ax_rule"><option value="1">표시</option><option value="0">없음(현행)</option></select>'
  + '<span class="v" id="v_rule"></span></div>';
  AXES.forEach(a => {
    const el = document.getElementById('ax_' + a.k);
    el.addEventListener('input', () => {
      S[a.k] = +el.value;
      const v = document.getElementById('v_' + a.k);
      v.textContent = S[a.k] + a.unit;
      v.classList.toggle('near', near(S[a.k], PRESETS['현행(구분선 없음·좌측)'][a.k], 0));
      markPreset(); render();
    });
  });
  document.getElementById('ax_align').addEventListener('change', e => { S.align = e.target.value; markPreset(); render(); });
  document.getElementById('ax_rule').addEventListener('change', e => { S.rule = +e.target.value; markPreset(); render(); });
}
function syncAxes() {
  AXES.forEach(a => {
    const el = document.getElementById('ax_' + a.k); if (!el) return;
    el.value = S[a.k];
    const v = document.getElementById('v_' + a.k);
    v.textContent = S[a.k] + a.unit;
    v.classList.toggle('near', near(S[a.k], PRESETS['현행(구분선 없음·좌측)'][a.k], 0));
  });
  const al = document.getElementById('ax_align'); if (al) al.value = S.align;
  const ru = document.getElementById('ax_rule'); if (ru) ru.value = String(S.rule);
}
function markPreset() {
  document.querySelectorAll('.pbtn[data-p]').forEach(b => {
    const p = PRESETS[b.dataset.p];
    const same = p && Object.keys(p).every(k => p[k] === S[k]);
    b.classList.toggle('on', !!same);
  });
}
function buildPresets() {
  const box = document.getElementById('presets');
  box.innerHTML = Object.keys(PRESETS).map(k => '<button class="pbtn" data-p="' + k + '">' + k + '</button>').join('');
  box.querySelectorAll('.pbtn').forEach(b => b.addEventListener('click', () => {
    S = { ...PRESETS[b.dataset.p] }; syncAxes(); markPreset(); render();
  }));
}
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(document.getElementById('out').value);
        const b = document.getElementById('copy'); b.textContent = '복사됨 ✓'; setTimeout(() => b.textContent = '복사', 1200); }
  catch { document.getElementById('out').select(); }
});
document.getElementById('reset').addEventListener('click', () => {
  S = { ...PRESETS['현행(구분선 없음·좌측)'] }; syncAxes(); markPreset(); render();
});
document.getElementById('notes').innerHTML = [
  '<li><b>재현 한계</b> — 이 무대는 CSS 근사다. 실제 산출은 PIL(<code>nomute_jinjja.render_overlay</code>)이 글자별 <code>getlength</code>+자간으로 그린다. 폰트가 웹 Noto Sans KR ↔ NotoSansCJK-Bold.ttc라 <b>잉크 높이 ±3~4px</b> 차가 난다(헤더형 실측 −3.5px).</li>',
  '<li><b>스크림</b> — 실제 그라데는 100단 스탑을 선형보간한 곡선(reels 최대 알파 149/255)인데 여기선 4스탑 근사다. 농도 인상만 참고.</li>',
  '<li><b>자간</b> — 이 시안엔 자간 sweep이 없다. 실제로는 폭 <b>844</b>(reels 정본) 초과 시 −1→−30까지 자동 압축된다. 가운데정렬로 바꾸면 이 폭 기준을 <b>좌우 마진 대칭</b>으로 다시 잡아야 한다(운영자 확정 필요).</li>',
  '<li><b>구분선 색</b> — 흰색(#fff) 알파만 조절한다. 형광그린·극진보 등 유채색은 콘텐츠 산출물 색 축이라 별도 승인 대상(CLAUDE.md 【바인딩】 "발행 콘텐츠 색은 별개 축").</li>',
  '<li><b>워터마크</b> — <code>jinjja_reels_preview.webp</code>(270×480 축소판)를 늘려 깔았다. 실제 합성은 1080 원본이라 선명도가 다르다. 잉크 하단 y1154는 원본 실측값.</li>',
  '<li><b>미확정</b> — 2줄 고정인지(현행 자막은 최대 3줄), 구분선이 헤더형에도 들어가는지는 이 시안 범위 밖이다.</li>',
].join('');
buildPresets(); buildAxes(); syncAxes(); markPreset(); render();
// 무대 실폭을 CSS 변수로(폰트 px 환산 기준)
const setPvw = () => document.documentElement.style.setProperty('--pvw', (document.getElementById('pv').clientWidth / 100) + 'px');
setPvw(); addEventListener('resize', () => { setPvw(); render(); });
</script>
</body>
</html>
