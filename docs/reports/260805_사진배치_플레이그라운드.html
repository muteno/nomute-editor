<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>사진 배치(이동·확대축소·크롭) 플레이그라운드 — 260805</title>
<!--
  ═══════════════════════════════════════════════════════════════════════
  사진 배치 플레이그라운드 (운영자 260805 "html로 이 기능을 실험해보게")
  ─ 골격 = shared/playground_template.html v1 동결 엔진 그대로(CONFIG만 교체 + 실험 패널 1절 추가).
  ─ 대상 = viewer/thumb.html 카드 생성 미리보기 사진 배치(CPAN) · 굽기(cpBake) · 여백 채움.
  ─ 수식 = 라이브 코드 1:1 이식(cpPanGeo / cpPanClamp / cpBake) — 값 창작 0.
  ─ 색·값: 아래 --pg-*는 viewer/index.html :root 실측값의 복사(자기완결 스냅샷 · §핵심명령 3-c).
  ═══════════════════════════════════════════════════════════════════════
-->
<style>
:root{color-scheme:dark;
  /* viewer :root 실측 사본(값 복사 = 계승 · 임의 창작 금지) */
  --pg-bg:#0b0d0e; --pg-fg:#eef7f0; --pg-mut:#9aa39d; --pg-accent:#00EED2; --pg-accent-rgb:0,238,210;
  --pg-warn:#FFE13D; --pg-danger:#e23b2a; --pg-r-s:9px; --pg-r-m:11px; --pg-r-l:16px; --pg-r-modal:22px;
}
*{box-sizing:border-box;margin:0} button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{background:var(--pg-bg);color:var(--pg-fg);font:14px/1.5 "Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;padding:14px}
h1{font-size:17px}.sub{color:var(--pg-mut);font-size:11.5px;margin:3px 0 12px}
.wrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.stagewrap{position:sticky;top:10px;flex:0 0 300px;align-self:flex-start;max-height:calc(100dvh - 20px);overflow:auto;scrollbar-width:none}
.stagewrap::-webkit-scrollbar{width:0;height:0;display:none}
/* ⑥ 미리보기 고정 = 폰 티어(세로형) — 상단 sticky · 아래 콘솔만 스크롤(운영자 260801 · 포터블 §3-1 ⑥). */
@media (max-width:900px){
  .wrap{padding-top:0}
  .stagewrap{flex:1 1 100%;position:sticky;top:0;z-index:20;max-height:62dvh;background:var(--bg,#0b0d0c);padding:8px 0;box-shadow:0 10px 18px -12px rgba(0,0,0,.9)}
  .console{flex:1 1 100%;max-width:none}
}
.frame{width:300px;height:560px;border:1px solid rgba(255,255,255,.14);border-radius:26px;overflow-y:auto;overflow-x:hidden;background:#0d1012;position:relative}
.frame .app,.frame .baseline{min-height:100%}
.frame .baseline{display:none}
.frame.showcur .app{display:none}.frame.showcur .baseline{display:block}
.stagebar{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.vseg{display:flex;border:1px solid rgba(255,255,255,.14);border-radius:999px;overflow:hidden;font-size:11.5px}
.vseg button{padding:5px 12px;color:var(--pg-mut)}
.vseg button.on{background:rgba(var(--pg-accent-rgb),.12);color:var(--pg-accent)}
.finfo{color:var(--pg-mut);font-size:10.5px;font-variant-numeric:tabular-nums}
.console{flex:1;min-width:320px;max-width:560px}
.csec{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);border-radius:var(--pg-r-l);padding:12px;margin-bottom:12px}
.csec>h2{font-size:12.5px;font-weight:800;margin-bottom:9px}
.csec>h2 .b{color:var(--pg-accent)}
.pill{display:inline-block;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-size:11.5px;color:var(--pg-mut);margin:0 6px 6px 0}
.pill.on{border-color:rgba(var(--pg-accent-rgb),.55);color:var(--pg-accent);background:rgba(var(--pg-accent-rgb),.08)}
.pill .st{color:var(--pg-warn)}
/* 변형 갤러리 = 부품 1개당 방식 N개를 실물로 나란히 */
.gal{margin-bottom:10px}
.gal-t{font-size:11.5px;color:var(--pg-mut);margin-bottom:7px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gcard{border:1px solid rgba(255,255,255,.11);border-radius:var(--pg-r-m);padding:10px 8px 8px;text-align:center;cursor:pointer;position:relative;background:rgba(255,255,255,.02)}
.gcard.on{border-color:rgba(var(--pg-accent-rgb),.6);background:rgba(var(--pg-accent-rgb),.06)}
.gcard .gnm{font-size:11px;margin-top:8px}
.gcard .gtag{font-size:9.5px;color:var(--pg-mut);margin-top:2px}
.gcard.on .gnm{color:var(--pg-accent)}
.gcard .demo{min-height:44px;display:flex;align-items:center;justify-content:center}
/* 축 컨트롤 */
.grp-t{font-size:10.5px;color:var(--pg-mut);letter-spacing:.06em;margin:12px 0 6px;text-transform:uppercase}
.axis{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;flex-wrap:wrap}
.axis .nm{flex:0 0 96px}
.axis input[type=range]{flex:1;min-width:110px;accent-color:var(--pg-accent)}
.axis .v{font-variant-numeric:tabular-nums;min-width:58px;text-align:right;color:var(--pg-accent)}
.axis .v.warn{color:var(--pg-warn)}
.axis .tok{flex-basis:100%;font-size:10px;color:var(--pg-mut);padding-left:96px}
.axis .seg{display:flex;border:1px solid rgba(255,255,255,.14);border-radius:999px;overflow:hidden}
.axis .seg button{padding:4px 10px;font-size:11px;color:var(--pg-mut)}
.axis .seg button.on{background:rgba(var(--pg-accent-rgb),.12);color:var(--pg-accent)}
.axis select{background:#14171a;color:var(--pg-fg);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:4px 8px;font-size:11.5px}
/* 출력·복사 */
#outtxt{white-space:pre-wrap;font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;background:#0d1012;border:1px solid rgba(255,255,255,.1);border-radius:var(--pg-r-m);padding:10px;max-height:260px;overflow:auto}
.copybtn{margin-top:8px;border:1px solid rgba(var(--pg-accent-rgb),.5);color:var(--pg-accent);border-radius:999px;padding:7px 16px;font-size:12px}
.copybtn.done{border-color:rgba(255,255,255,.2);color:var(--pg-mut)}
.note{font-size:11px;color:var(--pg-mut);line-height:1.6}
/* 복사 경고 모달(역제안) */
#cmodal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:50}
#cmodal.on{display:flex}
#cmodal .box{background:#14171a;border:1px solid rgba(255,255,255,.14);border-radius:var(--pg-r-modal);padding:16px;max-width:340px;font-size:12.5px}
#cmodal .box h3{font-size:13px;margin-bottom:8px}
#cmodal .box .ls{color:var(--pg-warn);font-size:11.5px;margin-bottom:10px;white-space:pre-wrap}
#cmodal .box .row{display:flex;gap:8px;flex-wrap:wrap}
#cmodal .box button{border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:11.5px}
#cmodal .box button.pri{border-color:rgba(var(--pg-accent-rgb),.5);color:var(--pg-accent)}

/* ══ 미리보기 = viewer/thumb.html 카드 생성 도크 실측 미러 ══
   .pgdock/.pgbox/.pgstage = .topdock/.cpprev-box/.cpprev-stage · .pgrail = 코너 옵션 레일(.trail) 값 사본.
   실측 원천: .cpprev-box{background:#121212} · .cpprev-stage{background:#000; aspect-ratio 4/5|9/16}
             .trail-i{22px/10.5px/--mut/on=accent} · .trail 캡슐{padding:5px 2px; r=--r-s} · .trail-div{14×1 rgba(255,255,255,.16)} */
.pgdock{padding:12px 10px;background:rgba(18,18,18,1);border-bottom:1px solid rgba(var(--pg-accent-rgb),.35)}
.pgwrap{position:relative;display:flex;gap:8px;align-items:flex-start}
.pgbox{position:relative;flex:1;min-width:0;height:var(--t-boxh,200px);background:#121212;border-radius:var(--pg-r-s);overflow:hidden}
.pgstage{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);background:#000;overflow:hidden;aspect-ratio:4/5;height:100%;touch-action:none;cursor:grab}
.pgstage.reels{aspect-ratio:9/16}
.pgstage.drag{cursor:grabbing}
.pgstage>*{pointer-events:none}
.pgfill{position:absolute;inset:0}
.pgfill img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(var(--t-gapblur,24px));transform:scale(1.25)}
.pgfill .dim{position:absolute;inset:0;background:rgba(0,0,0,var(--t-gapdim,0))}
.pgfill.mark::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,225,61,.22) 0 6px,transparent 6px 12px)}
.pgfill.ai::before{content:'AI가 이어 그림';position:absolute;left:0;right:0;top:6px;text-align:center;font-size:8.5px;color:rgba(255,255,255,.5);letter-spacing:.04em}
/* 배치 = 라이브 정본과 같은 문법: contain + cover 환산 배수(--pnf) × 배율(--t-s) · 이동 = 스테이지 대비 % */
.pgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 50%;
  transform:translate(var(--t-x,0%), var(--t-y,0%)) scale(calc(var(--t-s,1) * var(--pnf,1)))}
.pgscrim{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 38%,rgba(0,0,0,.92));opacity:calc(var(--t-opa,60) / 100)}
.pgcap{position:absolute;left:8%;right:5%;bottom:16%;color:#fff;font-size:11px;font-weight:800;line-height:1.18;letter-spacing:-.02em}
.pgcap b{color:#0FFD02;font-weight:inherit}
.pglogo{position:absolute;left:9%;bottom:30%;font:800 8px/1 system-ui;color:#fff;opacity:.9;letter-spacing:-.04em}
.pggrid{position:absolute;inset:0;
  background:linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.28) 33.2% 33.4%,transparent 33.4% 66.5%,rgba(255,255,255,.28) 66.5% 66.7%,transparent 66.7%),
             linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.28) 33.2% 33.4%,transparent 33.4% 66.5%,rgba(255,255,255,.28) 66.5% 66.7%,transparent 66.7%)}
.pgrail{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:5px 2px;border:1px solid rgba(255,255,255,.10);border-radius:var(--pg-r-s);background:rgba(255,255,255,.02);align-items:center}
.pgrail .ri{display:grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:var(--pg-r-l);color:var(--pg-mut);font-size:10.5px;font-weight:800;letter-spacing:-.2px;line-height:1;white-space:nowrap}
.pgrail .ri.on{color:var(--pg-accent)}
.pgrail .rd{width:14px;height:1px;background:rgba(255,255,255,.16);flex:none}
.pgrail .rst{display:flex;align-items:center;justify-content:center}
.pgrail .rst .stp{color:var(--pg-accent);font-weight:800;padding:0 5px;font-size:10.5px;cursor:pointer;pointer-events:auto}
.pgrail .rv{color:var(--pg-accent);font-variant-numeric:tabular-nums;font-size:10.5px;font-weight:800;min-width:22px;text-align:center}
.pgrail .fillchip{cursor:pointer;pointer-events:auto}
.pggo{margin-top:10px;padding:9px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.02);color:var(--pg-accent);text-align:center;font-weight:800;font-size:12px}
.pghint{padding:10px 12px;color:var(--pg-mut);font-size:10.5px;line-height:1.7}
.pghint b{color:var(--pg-fg)}
/* 실험 패널(굽기 결과) */
.bakerow{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
#bakecv{max-width:150px;border:1px solid rgba(255,255,255,.14);border-radius:var(--pg-r-s);background:#000}
.bakebtn{border:1px solid rgba(var(--pg-accent-rgb),.5);color:var(--pg-accent);border-radius:999px;padding:7px 14px;font-size:12px}
.bakebtn.gh{border-color:rgba(255,255,255,.2);color:var(--pg-mut)}
.bakeinfo{font:11px/1.7 ui-monospace,Menlo,Consolas,monospace;color:var(--pg-mut);flex:1;min-width:170px}
.bakeinfo b{color:var(--pg-fg)}
.filelab{display:inline-block;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 13px;font-size:11.5px;color:var(--pg-mut);cursor:pointer}
</style>
</head>
<body data-pg-template="v1">
<h1>사진 배치 <span style="color:var(--pg-accent)">플레이그라운드</span> — 이동·확대축소·크롭·여백 채움</h1>
<p class="sub">미리보기 사진을 <b>끌고·휠(핀치)로 키우고 줄여</b> 보고, 그대로 <b>산출 캔버스에 구워</b> 결과를 확인한다. 기본값 = 라이브 현행 실측 · 골격 = 동결 템플릿(CONFIG만 교체).</p>
<div class="wrap">
  <section class="stagewrap">
    <div class="frame" data-pg-scrollhost id="frame">
      <div class="app" data-pg-preview id="pv"></div>
      <div class="baseline" data-pg-baseline id="bl"></div>
    </div>
    <div class="stagebar">
      <div class="vseg" id="vseg"><button data-v="prop" class="on">제안</button><button data-v="cur">현행(비교)</button></div>
      <span class="finfo" id="finfo"></span>
    </div>
  </section>
  <aside class="console">
    <section class="csec" id="psec"><h2><span class="b">•</span> 프리셋</h2><div id="presets" data-pg-presets></div></section>
    <section class="csec"><h2><span class="b">•</span> 실험 — 산출 굽기(진짜 결과)</h2>
      <div class="bakerow">
        <canvas id="bakecv" width="1080" height="1350"></canvas>
        <div class="bakeinfo" id="bakeinfo">[산출 굽기]를 누르면 지금 배치 그대로 산출 캔버스에 굽는다.</div>
      </div>
      <div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="bakebtn" id="bake">산출 굽기</button>
        <button class="bakebtn gh" id="bakedl">굽은 결과 저장</button>
        <label class="filelab">내 사진으로 실험<input type="file" accept="image/*" id="pgfile" hidden></label>
      </div>
    </section>
    <section class="csec"><h2><span class="b">•</span> 변형 갤러리 — 방식 선택</h2><div id="gallery"></div></section>
    <section class="csec"><h2><span class="b">•</span> 미세조정</h2><div id="axes" data-pg-controls></div></section>
    <section class="csec" data-pg-copy><h2><span class="b">•</span> 선택값 <span id="warnN" style="color:var(--pg-warn);font-size:10.5px"></span></h2>
      <pre id="outtxt"></pre><button class="copybtn" id="copy">선택값 복사</button></section>
    <section class="csec" data-pg-note><h2><span class="b">•</span> 재현 한계 각주</h2><div class="note" id="notes"></div></section>
  </aside>
</div>
<div id="cmodal" data-pg-warnmodal><div class="box">
  <h3>⚠ 확립 사다리 밖 값 포함</h3><div class="ls" id="cmLs"></div>
  <div class="row"><button class="pri" id="cInc">역제안 포함 복사</button><button id="cOnly">계승분만 복사</button><button id="cNo">취소</button></div>
</div></div>

<script>
/* ═══════════ 동결 엔진 v1 — 여기부터 CONFIG 전까지 수정 금지 ═══════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const near=(a,b,eps)=>Math.abs((+a)-(+b))<=((eps==null)?.26:eps);          // 계승판정(축별 eps)
const kw=s=>[...String(s)].reduce((n,c)=>n+(c.charCodeAt(0)>127?2:1),0);   // 한글 2칸 폭
const padK=(s,w)=>String(s)+' '.repeat(Math.max(0,w-kw(s)));
const state={v:{},a:{}};
function scrollGuard(fn){const h=$('#frame');const y=h?h.scrollTop:0;fn();if(h)h.scrollTop=y;} // 재렌더 스크롤 보존(§7-1-6)
function initState(){CONFIG.AXES.forEach(ax=>state.a[ax.k]=CONFIG.DEFAULTS[ax.k]);
  CONFIG.GALLERY.forEach(g=>state.v[g.comp]=CONFIG.DEFAULTS['v_'+g.comp]);}
function fmt(ax,v){return (ax.step&&ax.step<1)?(+v).toFixed(ax.step<.01?3:2):String(v)}
function applyAll(structural){
  const pv=$('#pv');
  CONFIG.AXES.forEach(ax=>pv.style.setProperty('--t-'+ax.k, state.a[ax.k]+(ax.u||'')));
  if(structural){scrollGuard(()=>{pv.innerHTML=CONFIG.renderPreview(state);});}
  syncPresets(); warnAxes(); buildOut();
}
function buildGallery(){
  $('#gallery').innerHTML=CONFIG.GALLERY.map(g=>
    '<div class="gal"><div class="gal-t">'+g.nm+(g.desc?' — '+g.desc:'')+'</div><div class="gal-grid">'+
    g.variants.map(v=>'<div class="gcard'+(state.v[g.comp]===v.id?' on':'')+'" data-comp="'+g.comp+'" data-id="'+v.id+'">'+
      '<div class="demo">'+v.r(state)+'</div><div class="gnm">'+v.nm+(v.id===(CONFIG.DEFAULTS['v_'+g.comp])?' <span style="color:var(--pg-mut)">(현행)</span>':'')+'</div>'+
      (v.tag?'<div class="gtag">'+v.tag+'</div>':'')+'</div>').join('')+'</div></div>').join('');
}
function buildControls(){
  let html='',grp='';
  CONFIG.AXES.forEach(ax=>{
    if(ax.grp!==grp){grp=ax.grp;html+='<div class="grp-t">'+grp+'</div>';}
    html+='<div class="axis" data-k="'+ax.k+'"><span class="nm">'+ax.nm+'</span>';
    if(ax.type==='seg'){html+='<div class="seg">'+ax.sg.map(o=>'<button data-val="'+o[0]+'"'+(String(state.a[ax.k])===String(o[0])?' class="on"':'')+'>'+o[1]+'</button>').join('')+'</div>';}
    else if(ax.type==='select'){html+='<select>'+ (ax.pal||[]).map(o=>'<option value="'+o[0]+'"'+(String(state.a[ax.k])===String(o[0])?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';}
    else{const lid=ax.lad?('lad-'+ax.k):'';
      html+='<input type="range" min="'+ax.min+'" max="'+ax.max+'" step="'+(ax.step||1)+'" value="'+state.a[ax.k]+'"'+(lid?' list="'+lid+'"':'')+'>'
        +(lid?'<datalist id="'+lid+'">'+ax.lad.map(v=>'<option value="'+v+'">').join('')+'</datalist>':'')
        +'<span class="v">'+fmt(ax,state.a[ax.k])+(ax.u||'')+'</span>';}
    if(ax.tok)html+='<span class="tok">'+ax.tok+'</span>';
    html+='</div>';});
  $('#axes').innerHTML=html;
}
function buildPresets(){
  $('#presets').innerHTML=CONFIG.PRESETS.map((p,i)=>'<button class="pill" data-p="'+i+'">'+(p.star?'<span class="st">★</span> ':'')+p.nm+'</button>').join('');
}
/* 타입별 비교(포터블 §4 ⚠ "프리셋 비교 함수의 함정") — 세그/셀렉트 축은 값이 문자열이라
   near()의 +'post' = NaN → NaN<=eps = false → **전 프리셋이 영원히 안 켜진다**(260805 실측 검출).
   숫자면 near(오차 허용) · 아니면 문자열 동일성. near()는 그대로 살아 있다(계승판정·사다리 판정 공용). */
const eqv=(a,b,eps)=>{const na=+a,nb=+b;return (Number.isFinite(na)&&Number.isFinite(nb)&&String(a).trim()!==''&&String(b).trim()!=='')?near(na,nb,eps):String(a)===String(b);};
function presetMatch(p){
  const st=Object.assign({},CONFIG.DEFAULTS,p.st||{});
  return CONFIG.AXES.every(ax=>eqv(state.a[ax.k],st[ax.k],ax.eps))
    && CONFIG.GALLERY.every(g=>state.v[g.comp]===(st['v_'+g.comp]!==undefined?st['v_'+g.comp]:CONFIG.DEFAULTS['v_'+g.comp]));
}
function syncPresets(){$$('#presets .pill').forEach((el,i)=>el.classList.toggle('on',presetMatch(CONFIG.PRESETS[i])));}
function offLadder(ax,v){return ax.lad&&!ax.lad.some(l=>near(l,v,ax.eps));}
function warnAxes(){
  const ws=[];
  CONFIG.AXES.forEach(ax=>{const v=state.a[ax.k];
    const el=$('#axes .axis[data-k="'+ax.k+'"] .v');
    const off=offLadder(ax,v);
    if(el){el.classList.toggle('warn',!!off);el.textContent=fmt(ax,v)+(ax.u||'');}
    if(off)ws.push({ax,v});});
  $('#warnN').textContent=ws.length?('⚠ 사다리 밖 '+ws.length+'축'):'';
  return ws;
}
function lineOut(ax){
  const v=state.a[ax.k], cur=CONFIG.DEFAULTS[ax.k];
  let judge;
  if(ax.tokv!=null&&near(v,ax.tokv,ax.eps)) judge='계승 var('+ax.tokn+')';
  else if(ax.lad&&!offLadder(ax,v)) judge='계승(확립 사다리)';
  else if(ax.free) judge='자유(알파 변주)';
  else judge='갱신 후보 ⚠';
  return padK(ax.k,10)+': '+fmt(ax,v)+(ax.u||'')+'  [현행 '+fmt(ax,cur)+(ax.u||'')+'] · '+judge;
}
function buildOut(){
  const L=['# '+CONFIG.META.label+' — 선택값 ('+new Date().toISOString().slice(0,10)+')','## 방식(변형 갤러리)'];
  CONFIG.GALLERY.forEach(g=>{const v=g.variants.find(x=>x.id===state.v[g.comp]);
    L.push(padK(g.comp,10)+': '+(v?v.nm:'-')+(state.v[g.comp]===CONFIG.DEFAULTS['v_'+g.comp]?'  [현행 유지]':'  [변경]'));});
  L.push('## 미세조정(7축)');
  CONFIG.AXES.forEach(ax=>L.push(lineOut(ax)));
  $('#outtxt').textContent=L.join('\n');
}
function counterBlock(ws){
  return '\n## ⚠ 기틀 갱신 역제안(사다리 밖 값 — 회신 = (갱신) 승인 정문)\n'+
    ws.map(w=>'- '+w.ax.nm+'('+w.ax.k+') = '+fmt(w.ax,w.v)+(w.ax.u||'')+' — 근접: '+(w.ax.lad?w.ax.lad.join('/'):'-')+(w.ax.u||'')).join('\n');
}
function doCopy(txt,btn){
  const done=()=>{btn.classList.add('done');btn.textContent='복사됨 ✓';setTimeout(()=>{btn.classList.remove('done');btn.textContent='선택값 복사';},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();done();}

  const st=Object.assign({},CONFIG.DEFAULTS,p.st||{});CONFIG.AXES.forEach(ax=>state.a[ax.k]=st[ax.k]);
  CONFIG.GALLERY.forEach(g=>state.v[g.comp]=st['v_'+g.comp]!==undefined?st['v_'+g.comp]:CONFIG.DEFAULTS['v_'+g.comp]);

$('#vseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;

$('#copy').addEventListener('click',()=>{
  const ws=warnAxes(), base=$('#outtxt').textContent;
  if(!ws.length){doCopy(base,$('#copy'));return;}
  $('#cmLs').textContent=ws.map(w=>w.ax.nm+' = '+fmt(w.ax,w.v)+(w.ax.u||'')+' (사다리: '+(w.ax.lad||[]).join('/')+')').join('\n');
  $('#cmodal').classList.add('on');
  $('#cInc').onclick=()=>{doCopy(base+counterBlock(ws),$('#copy'));$('#cmodal').classList.remove('on');};
  $('#cOnly').onclick=()=>{doCopy(base.split('\n').filter(l=>!l.includes('갱신 후보')).join('\n'),$('#copy'));$('#cmodal').classList.remove('on');};
  $('#cNo').onclick=()=>$('#cmodal').classList.remove('on');
});
function boot(){initState();buildPresets();buildGallery();buildControls();

  $('#finfo').textContent=CONFIG.META.frame.w+'×'+CONFIG.META.frame.h+' · SSOT='+CONFIG.META.ssot;
  applyAll(true);}

const FMT={post:{w:1080,h:1350,ko:'포스트 4:5'}, reels:{w:1080,h:1920,ko:'릴스 9:16'}};
function curSrc(){const s=SRC[state.v.src]||SRC.wide; return (s.d?s:SRC.wide);}
/* ── 라이브 정본 수식 1:1 이식(viewer/thumb.html cpPanGeo / cpPanClamp) ── */
function geo(fmtKey,scale){
  const s=curSrc(); if(!s.w||!s.h) return null;
  const F=FMT[fmtKey]||FMT.post;
  const r=s.w/s.h, R=F.w/F.h;
  const f=Math.max(r/R,R/r);
  const cw=r>=R?1:r/R, ch=r>=R?R/r:1;
  return {r,R,f,wp:cw*f*scale,hp:ch*f*scale};
}
function clampXY(){
  const g=geo(state.a.fmt,+state.a.s); if(!g) return;
  const lx=Math.abs(g.wp-1)/2*100, ly=Math.abs(g.hp-1)/2*100;   // % 단위(스테이지 대비)
  state.a.x=Math.max(-lx,Math.min(lx,+state.a.x));
  state.a.y=Math.max(-ly,Math.min(ly,+state.a.y));
}
function hasGap(){return (+state.a.s)<0.999;}

  DEFAULTS:{s:1, x:0, y:0, smin:0.3, smax:4, stepv:0.1, wheel:1.1, snap:0,

    const gap=(+a.s)<0.999;

    let fill='';
    if(gap){
      if(gf==='blur'||gf==='ai') fill='<div class="pgfill'+(gf==='ai'?' ai':'')+(a.gapmark==='on'?' mark':'')+'"><img src="'+src.d+'" alt=""><span class="dim"></span></div>';
      else if(gf==='edge') fill='<div class="pgfill'+(a.gapmark==='on'?' mark':'')+'" style="background:'+(window.__pgEdge||'#1b2430')+'"><span class="dim"></span></div>';
      else fill='<div class="pgfill'+(a.gapmark==='on'?' mark':'')+'"><span class="dim"></span></div>';
    }
    return '<div class="pgdock"><div class="pgwrap">'
      + '<div class="pgbox"><div class="pgstage'+(a.fmt==='reels'?' reels':'')+'" id="pgstage" style="--pnf:'+f.toFixed(4)+'">'
      +   fill

      +   (a.ovl==='on'?'<div class="pgscrim"></div><div class="pglogo">NO<br>mute</div><div class="pgcap"><b>배치</b>를 내가 고른다</div>':'')
      +   (a.grid==='on'?'<div class="pggrid"></div>':'')
      + '</div></div>'
      + (a.rail==='on'
          ? '<div class="pgrail"><span class="ri">배경</span><span class="rd"></span><span class="ri on">축약</span><span class="rd"></span><span class="ri on">배경 합성</span><span class="rd"></span>'

            + (gap?'<span class="rd"></span><span class="ri on fillchip" data-pan="fill">AI 채움</span>':'')
            + '<span class="rd"></span><span class="rst"><span class="stp">−</span><span class="rv">'+a.opa+'</span><span class="stp">+</span></span></div>'
          : '')
      + '</div><div class="pggo">생성</div></div>'
      + '<div class="pghint">끌어서 <b>이동</b> · '
      + ({wheel:'휠(모바일 = 두 손가락)로 <b>확대축소</b>', ctrl:'<b>Ctrl+휠</b>로 확대축소(그냥 휠 = 페이지 스크롤)', slider:'레일 <b>−/+</b>로만 확대축소(제스처 없음)', dblstep:'<b>더블클릭</b>으로 2배씩 순환'}[v.pczoom]||'')
      + ' · 더블클릭 = ' + (v.pczoom==='dblstep'?'2배 순환':'원상복귀')
      + '<br>지금 그림 = 스테이지의 <b>'+(geoTxt(a,src,F))+'</b>';
  },
  renderBaseline(){
    const st={a:Object.assign({},CONFIG.DEFAULTS),v:{src:state.v.src||CONFIG.DEFAULTS.v_src,gapfill:CONFIG.DEFAULTS.v_gapfill,pczoom:CONFIG.DEFAULTS.v_pczoom}};
    return '<div style="--t-s:1;--t-x:0%;--t-y:0%;--t-boxh:'+CONFIG.DEFAULTS.boxh+'px;--t-opa:'+CONFIG.DEFAULTS.opa+';--t-gapblur:'+CONFIG.DEFAULTS.gapblur+'px;--t-gapdim:0">'
      + CONFIG.renderPreview(st) + '</div>';
  },
};
function geoTxt(a,src,F){
  const r=src.w/src.h, R=F.w/F.h, f=Math.max(r/R,R/r);
  const cw=r>=R?1:r/R, ch=r>=R?R/r:1, wp=cw*f*(+a.s), hp=ch*f*(+a.s);
  return '가로 '+(wp*100).toFixed(0)+'% · 세로 '+(hp*100).toFixed(0)+'%'
    + (Math.min(wp,hp)<0.999?' → <b style="color:var(--pg-warn)">여백 발생</b>':' → 여백 0(크롭)');
}

/* ═══════════ 실험 배선(엔진 밖) — 제스처 · 굽기 · 내 사진 ═══════════ */
/* 라이브(viewer/thumb.html)의 포인터 위임과 같은 구조: 스테이지 1곳 · 드래그=이동 · 휠/핀치=확대축소 · 더블=원상복귀 */
(function(){
  const pv=$('#pv'); const pts=new Map(); let last=null, pinch=0;
  const stage=()=>pv.querySelector('#pgstage');
  const A=()=>state.a;
  const syncLive=()=>{   // 드래그 중 = CSS 변수·레일 값만(재렌더 금지 = 조작이 끊긴다)
    clampXY();
    pv.style.setProperty('--t-s',A().s); pv.style.setProperty('--t-x',A().x+'%'); pv.style.setProperty('--t-y',A().y+'%');
    const sz=pv.querySelector('#pgsize'); if(sz)sz.textContent=Math.round((+A().s)*100);
    warnAxes(); buildOut();
  };
  const settle=()=>{buildControls();applyAll(true);};   // 손 떼면 슬라이더 위치·레일 칩까지 재동기
  const zoom=(mul,cx,cy)=>{
    const s0=+A().s, s1=Math.max(+A().smin,Math.min(+A().smax,s0*mul));
    if(s1===s0)return;
    if(Number.isFinite(cx)){A().x=cx-(cx-(+A().x))*(s1/s0); A().y=cy-(cy-(+A().y))*(s1/s0);}
    A().s=s1; syncLive();
  };
  const rect=()=>{const st=stage();return st?st.getBoundingClientRect():null;};
  pv.addEventListener('pointerdown',e=>{
    const step=e.target.closest('[data-pan]');
    if(step){const d=step.dataset.pan;
      if(d==='fill'){alert('실제 라이브에선 여기서 AI 채움 작업이 발사된다(러너 Gemini 3.1 Flash + 픽셀락 → 완료 시 자동 재첨부).\n\n이 플레이그라운드는 브라우저 안이라 아웃페인팅을 못 한다 — 갤러리에서 「AI 채움」을 골라 자리만 모의로 본다.');return;}
      const st=+A().stepv; zoom(d>0?1+st:1/(1+st)); settle(); return;}
    const st=stage(); if(!st||!st.contains(e.target)&&e.target!==st)return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){const a=[...pts.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);last=null;}
    else last={x:e.clientX,y:e.clientY};
    st.classList.add('drag');
  });
  pv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const rc=rect(); if(!rc||!rc.width)return;
    if(pts.size>=2){
      const a=[...pts.values()], d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      const mx=(a[0].x+a[1].x)/2, my=(a[0].y+a[1].y)/2;
      if(pinch>0&&d>0) zoom(d/pinch,(mx-rc.left)/rc.width-.5,(my-rc.top)/rc.height-.5);
      pinch=d; e.preventDefault(); return;
    }
    if(!last)return;
    A().x=(+A().x)+((e.clientX-last.x)/rc.width)*100;
    A().y=(+A().y)+((e.clientY-last.y)/rc.height)*100;
    const sn=+A().snap;
    if(sn>0){if(Math.abs(A().x)<sn)A().x=0; if(Math.abs(A().y)<sn)A().y=0;}
    last={x:e.clientX,y:e.clientY}; syncLive(); e.preventDefault();
  },{passive:false});
  const up=e=>{if(!pts.has(e.pointerId))return; pts.delete(e.pointerId); if(pts.size<2)pinch=0;
    if(!pts.size){last=null;const st=stage();if(st)st.classList.remove('drag');settle();}
    else{const a=[...pts.values()][0];last={x:a.x,y:a.y};}};
  pv.addEventListener('pointerup',up); pv.addEventListener('pointercancel',up);
  pv.addEventListener('wheel',e=>{
    const st=stage(); if(!st)return;
    const mode=state.v.pczoom;
    if(mode==='slider')return;                       // 제스처 없음 = 페이지 스크롤 그대로
    if(mode==='ctrl'&&!e.ctrlKey)return;             // Ctrl 없으면 페이지 스크롤
    const rc=rect(); if(!rc)return;
    e.preventDefault();
    zoom(e.deltaY<0?(+A().wheel):1/(+A().wheel),(e.clientX-rc.left)/rc.width-.5,(e.clientY-rc.top)/rc.height-.5);
    settle();
  },{passive:false});
  pv.addEventListener('dblclick',e=>{
    const st=stage(); if(!st)return; e.preventDefault();
    if(state.v.pczoom==='dblstep'){const s=+A().s; A().s=s<1.99?2:(s<3.99?4:1); A().x=0;A().y=0;}
    else {A().s=1;A().x=0;A().y=0;}
    settle();
  });
})();

/* 가장자리 평균색 실측(러너 solid_pad 산식 = 가장자리 8px 밴드 평균) */
function measureEdge(){
  const s=curSrc(); if(!s.d)return;
  const im=new Image();
  im.onload=()=>{
    const w=Math.min(240,im.naturalWidth), h=Math.round(im.naturalHeight*w/im.naturalWidth);
    const c=document.createElement('canvas'); c.width=w;c.height=h;
    const x=c.getContext('2d'); x.drawImage(im,0,0,w,h);
    const b=Math.max(2,Math.round(8*w/im.naturalWidth));
    const grab=(sx,sy,sw,sh)=>x.getImageData(sx,sy,Math.max(1,sw),Math.max(1,sh)).data;
    const bands=[grab(0,0,w,b),grab(0,h-b,w,b),grab(0,0,b,h),grab(w-b,0,b,h)];
    let R=0,G=0,B=0,n=0;
    bands.forEach(d=>{for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++;}});
    window.__pgEdge='rgb('+Math.round(R/n)+','+Math.round(G/n)+','+Math.round(B/n)+')';
    if(state.v.gapfill==='edge')applyAll(true);
  };
  im.src=s.d;
}
measureEdge();

/* 굽기 = viewer/thumb.html cpBake 산식 1:1(목표 캔버스 · 배치 좌표 · q90) + 여백 채움 방식 반영 */
function bake(){
  return new Promise(res=>{
    const src=curSrc(); const a=state.a;
    const F=FMT[a.fmt]||FMT.post;
    const g=geo(a.fmt,+a.s); if(!g)return res(null);
    const im=new Image();
    im.onload=()=>{
      const m=(a.bx==='auto')?((im.naturalWidth>g.wp*1080*1.5)?2:1):(+a.bx);
      const TW=1080*m, TH=F.h/F.w*1080*m;
      const c=$('#bakecv'); c.width=TW; c.height=TH;
      const x=c.getContext('2d'); x.imageSmoothingQuality='high';
      const dx=(0.5+(+a.x)/100-g.wp/2)*TW, dy=(0.5+(+a.y)/100-g.hp/2)*TH, dw=g.wp*TW, dh=g.hp*TH;
      const gap=Math.min(g.wp,g.hp)<0.999;
      const gf=state.v.gapfill;
      // ① 여백 채움
      x.save();
      if(gap&&(gf==='blur'||gf==='ai')){                       // 러너 blur_pad 미러(블러 + 1.25 확대 커버)
        x.filter='blur('+Math.round((+a.gapblur)*m*1080/300)/4+'px)';
        const k=Math.max(TW/im.naturalWidth,TH/im.naturalHeight)*1.25;
        const bw=im.naturalWidth*k, bh=im.naturalHeight*k;
        x.drawImage(im,(TW-bw)/2,(TH-bh)/2,bw,bh);
        x.filter='none';
      } else if(gap&&gf==='edge'){
        x.fillStyle=window.__pgEdge||'#1b2430'; x.fillRect(0,0,TW,TH);
      } else {
        x.fillStyle='#000'; x.fillRect(0,0,TW,TH);             // 현행 = 순흑(산출 배경 관례)
      }
      if(gap&&(+a.gapdim)>0){x.fillStyle='rgba(0,0,0,'+a.gapdim+')';x.fillRect(0,0,TW,TH);}
      x.restore();
      // ② 원본 배치
      x.drawImage(im,dx,dy,dw,dh);
      const q=(+a.jq)/100;
      const url=c.toDataURL('image/jpeg',q);
      const kb=Math.round(url.length*0.75/1024);
      const gapPct=gap?Math.round((1-Math.min(1,g.wp)*Math.min(1,g.hp))*100):0;
      $('#bakeinfo').innerHTML='<b>'+TW+'×'+Math.round(TH)+'</b> ('+F.ko+' ×'+m+') · JPEG q'+a.jq+' · 약 <b>'+kb+'KB</b><br>'
        +'그림 = 가로 <b>'+(g.wp*100).toFixed(1)+'%</b> · 세로 <b>'+(g.hp*100).toFixed(1)+'%</b><br>'
        +(gap?('여백 = 화면의 약 <b style="color:var(--pg-warn)">'+gapPct+'%</b> · 채움 = '+({black:'검정',blur:'블러 확대',edge:'가장자리 단색',ai:'AI(모의)'}[gf])):'여백 <b>0</b> — 크롭만 적용(AI 채움 불필요)')
        +'<br>원본 사용률 = <b>'+Math.round(Math.min(1,1/g.wp)*Math.min(1,1/g.hp)*100)+'%</b> (100% = 원본이 하나도 안 잘림)';
      res(url);
    };
    im.onerror=()=>res(null);
    im.src=src.d;
  });
}
$('#bake').addEventListener('click',()=>bake());
$('#bakedl').addEventListener('click',async()=>{
  const u=await bake(); if(!u)return;
  const a=document.createElement('a'); a.href=u; a.download='배치실험_'+state.a.fmt+'_'+Math.round((+state.a.s)*100)+'.jpg'; a.click();
});
$('#pgfile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{SRC.mine.d=fr.result;SRC.mine.w=im.naturalWidth;SRC.mine.h=im.naturalHeight;
      SRC.mine.tag=im.naturalWidth+'×'+im.naturalHeight;
      state.v.src='mine'; measureEdge(); buildGallery(); applyAll(true);};
    im.src=fr.result;};
  fr.readAsDataURL(f);
});
</script>
</body>
