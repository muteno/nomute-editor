<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>노뮤트 뉴스카드 — 세로 영상</title>

<!-- 값 SSOT = viewer/index.html :root (node video/build.mjs 가 통짜 복사) -->
<link rel="stylesheet" href=".build/palette.css">

<style>
/* 본문 폰트 = 뷰어 index.html:25 @font-face 그대로 계승(자산도 동일 파일 사본) */
@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:block;
  src:local('Pretendard Variable'),url(.build/pretendard.woff2) format('woff2-variations')}

html,body{ margin:0; padding:0; background:var(--bg); }

/* 스테이지 = 1080×1920(9:16).
   #frame 은 뷰어와 같은 360×640 CSS px 폰 화면이고 scale(3) 정수 배율로 채운다.
   → 배율은 DPR 확대일 뿐 디자인 값이 아니다. 모든 색·간격·타이포는 var() 토큰 계승(값 창작 0). */
#stage{ position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--bg); }
#frame{ position:absolute; top:0; left:0; width:360px; height:640px;
  transform:scale(3); transform-origin:top left;
  box-sizing:border-box; padding:var(--sp-4);
  display:flex; flex-direction:column; gap:var(--sp-3);
  font-family:var(--font-status); color:var(--fg); line-height:var(--lh-base);
  -webkit-font-smoothing:antialiased; }

.meta{ display:flex; align-items:center; gap:var(--sp-2);
  font-size:var(--fs-sm); color:var(--mut); }
.chip{ font-size:var(--fs-xs); color:var(--nmBiasColor); border:1px solid var(--line);
  border-radius:var(--r-pill); padding:0 var(--sp-1); }

.hook{ font-size:var(--fs-display); font-weight:var(--fw-x); color:var(--fg); margin:0; }
.title{ font-size:var(--fs-h3); font-weight:var(--fw-b); color:var(--mut); margin:0; }
.rule{ height:1px; background:var(--line); }
.spacer{ flex:1 1 auto; }

/* 등장 = CSS 키프레임(유한 길이·결정적 지연·fill both = 시크 안전) */
@keyframes nmRise{ from{ opacity:0; transform:translateY(var(--sp-2)); } to{ opacity:1; transform:none; } }
.clip{ animation:nmRise var(--dur-acc) var(--ease) both; }
@media (prefers-reduced-motion:reduce){ .clip{ animation:none; } }
</style>
</head>
<body>

<div id="stage"
     data-composition-id="news-card"
     data-start="0"
     data-duration="6"
     data-no-timeline
     data-width="1080"
     data-height="1920"
     data-composition-variables='[
       {"id":"nmHook","type":"string","label":"훅(큰 문장)","default":"만점 받고도 예비번호조차 없었다면, 그 통장은 뭘 위해 부은 건가"},
       {"id":"nmTitle","type":"string","label":"기사 제목","default":"“싼 집보다 예측 가능한 주거”…청년들이 정부에 던진 주택정책 과제"},
       {"id":"nmMedia","type":"string","label":"매체","default":"에너지경제신문"},
       {"id":"nmDate","type":"string","label":"날짜","default":"2026-07-27"},
       {"id":"nmBias","type":"string","label":"편향 라벨","default":"🟩 중립"},
       {"id":"nmBiasColor","type":"string","label":"편향 색 토큰","default":"var(--bias-mid)"}
     ]'>

  <div id="frame">
    <div id="nm-meta" class="meta clip" data-start="0.1" data-duration="5.9" data-track-index="0">
      <span data-var-text="nmMedia">에너지경제신문</span>
      <span data-var-text="nmDate">2026-07-27</span>
      <span class="chip" data-var-text="nmBias">🟩 중립</span>
    </div>

    <div id="nm-rule" class="rule clip" data-start="0.25" data-duration="5.75" data-track-index="1"></div>

    <p id="nm-hook" class="hook clip" data-start="0.45" data-duration="5.55" data-track-index="2"
       data-var-text="nmHook">만점 받고도 예비번호조차 없었다면, 그 통장은 뭘 위해 부은 건가</p>

    <p id="nm-title" class="title clip" data-start="1.1" data-duration="4.9" data-track-index="3"
       data-var-text="nmTitle">“싼 집보다 예측 가능한 주거”…청년들이 정부에 던진 주택정책 과제</p>

    <div class="spacer"></div>
  </div>

</div>

</body>
</html>
